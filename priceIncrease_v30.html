    <script>
      (() => {
        const REMOTE_URL =
          "https://storage.googleapis.com/divine-vehicle-292507.appspot.com/json/report/priceChange.json";
        const CARD_DATA_BASE_URL =
          "https://storage.googleapis.com/divine-vehicle-292507.appspot.com/json/cardData/";
        // 卡名與作品名都已經在 repo 裡，不需要新資料來源
        const CARD_DICTIONARY_URL = "json/cardDictionary.json";
        const CARD_TITLE_URL = "json/cardTitle.json";
        const SPARKLINE_CONCURRENCY = 6;
        const THEME_STORAGE_KEY = "priceIncreaseTheme";
        const WATCHLIST_STORAGE_KEY = "cardWatchlist";

        /** @type {null | { generatedAt: number, cards: Record<string, any>}} */
        let rawData = null;
        /** @type {Array<any>} */
        let cardRows = [];
        let exRate = 0.22;
        let exRateFallback = false;
        let renderVersion = 0;
        let activeSortKey = "change1dPct";
        let activeSortDirection = "desc";
        const pageSize = 200;
        let currentPage = 1;
        let stickyHeaderMirror = null;
        const productDataPromiseCache = new Map();
        const cardSeriesPromiseCache = new Map();

        // 卡名／作品名查詢表。都在背景載入，載完再補進已經畫好的列。
        /** @type {Map<string, string>} 卡號 → 卡名 */
        const cardNameMap = new Map();
        /** @type {Map<string, string>} 系列代號 → 作品名 */
        const seriesTitleMap = new Map();

        // 追蹤清單設定 (Watchlist Setup)
        const watchlist = new Set(JSON.parse(localStorage.getItem(WATCHLIST_STORAGE_KEY) || "[]"));
        let activeTrendFilter = "all";
        let activeCurrency = "JPY";

        const els = {
          generatedAtText: document.getElementById("generatedAtText"),
          reloadBtn: document.getElementById("reloadBtn"),
          themeToggleBtn: document.getElementById("themeToggleBtn"),
          q: document.getElementById("q"),
          pageInfo: document.getElementById("pageInfo"),
          prevPageBtn: document.getElementById("prevPageBtn"),
          nextPageBtn: document.getElementById("nextPageBtn"),
          pageStatsText: document.getElementById("pageStatsText"),
          kpiShown: document.getElementById("kpiShown"),
          kpiShownSub: document.getElementById("kpiShownSub"),
          kpiAvgLabel: document.getElementById("kpiAvgLabel"),
          kpiAvg: document.getElementById("kpiAvg"),
          kpiAvgSub: document.getElementById("kpiAvgSub"),
          kpiMedianLabel: document.getElementById("kpiMedianLabel"),
          kpiMedian: document.getElementById("kpiMedian"),
          kpiMedianSub: document.getElementById("kpiMedianSub"),
          kpiMaxLabel: document.getElementById("kpiMaxLabel"),
          kpiMinLabel: document.getElementById("kpiMinLabel"),
          kpiMax: document.getElementById("kpiMax"),
          kpiMin: document.getElementById("kpiMin"),
          kpiMaxCard: document.getElementById("kpiMaxCard"),
          kpiMinCard: document.getElementById("kpiMinCard"),
          kpiDistLabel: document.getElementById("kpiDistLabel"),
          kpiDistBar: document.getElementById("kpiDistBar"),
          kpiDistLegend: document.getElementById("kpiDistLegend"),
          statusText: document.getElementById("statusText"),
          statusSub: document.getElementById("statusSub"),
          clearWatchlistBtn: document.getElementById("clearWatchlistBtn"),
          sourceText: document.getElementById("sourceText"),
          tbody: document.getElementById("tbody"),
          errorBox: document.getElementById("errorBox"),
        };

        function resolveInitialTheme() {
          const saved = localStorage.getItem(THEME_STORAGE_KEY);
          if (saved === "light" || saved === "dark") return saved;
          return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }

        function applyTheme(theme) {
          document.body.setAttribute("data-theme", theme);
          localStorage.setItem(THEME_STORAGE_KEY, theme);
          if (els.themeToggleBtn) {
            const isDark = theme === "dark";
            els.themeToggleBtn.innerHTML = isDark 
              ? `<i class="fa-regular fa-sun"></i> 淺色` 
              : `<i class="fa-regular fa-moon"></i> 深色`;
          }
        }

        function toggleTheme() {
          const now = document.body.getAttribute("data-theme") || "light";
          applyTheme(now === "dark" ? "light" : "dark");
        }

        function fmtNum(n) {
          if (n === null || n === undefined || Number.isNaN(Number(n))) return "—";
          return new Intl.NumberFormat("zh-TW").format(Number(n));
        }

        function cardNoToProductCode(cardNo) {
          return (String(cardNo || "").split("-")[0] || "").replace(/\//g, "_");
        }

        function normalizePriceSeries(series) {
          if (!Array.isArray(series)) return [];
          return series.map((v) => Number(v)).filter((v) => Number.isFinite(v));
        }

        function normalizeDateKey(v) {
          const s = String(v ?? "").replace(/\D/g, "");
          return s.length === 8 ? s : "";
        }

        function normalizeDateSeries(series) {
          if (!Array.isArray(series)) return [];
          return series.map((v) => normalizeDateKey(v));
        }

        function findCardEntry(data, cardNo) {
          if (!data || !cardNo) return null;
          if (data[cardNo]) return data[cardNo];
          const lower = String(cardNo).toLowerCase();
          for (const [k, v] of Object.entries(data)) {
            if (String(k).toLowerCase() === lower) return v;
          }
          return null;
        }

        function fmtDateKey(key) {
          const s = String(key || "");
          return s.length === 8 ? `${s.slice(0, 4)}/${s.slice(4, 6)}/${s.slice(6, 8)}` : "";
        }

        // 走勢線畫的是「全期」，跟左邊三欄的 1／3／7 日不是同一個期間，所以同一列
        // 出現「三個綠色百分比 + 一條紅色下跌線」是可能且正確的。v29 沒有任何地方
        // 說明這件事，讀者只會讀成畫面在自相矛盾。表頭補了「全期」，每一格再把
        // 實際的起訖日與起訖價寫進 aria-label／title。
        function sparklineSvg(prices, dates) {
          const values = normalizePriceSeries(prices);
          const stamps = Array.isArray(dates) ? dates : [];
          if (values.length < 2) {
            return '<span class="sparkline-na">N/A</span>';
          }
          const width = 128;
          const height = 30;
          const pad = 2;
          const chartW = width - pad * 2;
          const chartH = height - pad * 2;
          const min = Math.min(...values);
          const max = Math.max(...values);
          const range = max - min || 1;
          const points = values.map((v, i) => {
            const x = pad + (i / (values.length - 1)) * chartW;
            const y = pad + (1 - (v - min) / range) * chartH;
            return `${x.toFixed(2)},${y.toFixed(2)}`;
          });
          const first = values[0];
          const last = values[values.length - 1];
          const trendClass = last >= first ? "up" : "down";
          const from = fmtDateKey(stamps[0]);
          const to = fmtDateKey(stamps[stamps.length - 1]);
          const span =
            stamps.length === values.length && from && to
              ? `${from} → ${to}`
              : `共 ${values.length} 筆收錄`;
          const label = `全期走勢（${span}）：${formatPrice(first)} → ${formatPrice(last)}`;
          return `
            <span class="sparkline ${trendClass}" role="img" aria-label="${escapeHtml(label)}" title="${escapeHtml(label)}">
              <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" aria-hidden="true">
                <polyline points="${points.join(" ")}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline>
              </svg>
            </span>
          `.trim();
        }

        async function getProductData(productCode) {
          if (!productCode) return null;
          if (!productDataPromiseCache.has(productCode)) {
            const url = `${CARD_DATA_BASE_URL}${productCode}.json`;
            productDataPromiseCache.set(
              productCode,
              fetchJson(url).catch(() => null)
            );
          }
          return await productDataPromiseCache.get(productCode);
        }

        // cardPrice 的排列順序沒有任何契約保證，而走勢線的紅綠是用「第一點 vs
        // 最後一點」判定的——順序反了整欄顏色就全反，而且畫面上看不出來。
        // upddate 本來就抓下來了（v29 算完 dates 就丟掉沒用），拿它排時序。
        // 日期缺一個就整組放棄排序，維持原順序，並讓 dates 為空好讓 UI 改印筆數。
        function orderChronologically(prices, dates) {
          if (dates.length !== prices.length || dates.some((d) => !d)) {
            return { prices, dates: [] };
          }
          const order = prices.map((_, i) => i).sort((a, b) => dates[a].localeCompare(dates[b]));
          return { prices: order.map((i) => prices[i]), dates: order.map((i) => dates[i]) };
        }

        async function getCardSeries(cardNo) {
          const key = String(cardNo || "");
          if (!key) return { prices: [], dates: [] };
          if (!cardSeriesPromiseCache.has(key)) {
            cardSeriesPromiseCache.set(key, (async () => {
              const productCode = cardNoToProductCode(key);
              const data = await getProductData(productCode);
              const cardEntry = findCardEntry(data, key);
              if (!cardEntry) return { prices: [], dates: [] };
              const prices = normalizePriceSeries(cardEntry.cardPrice);
              const rawDates = cardEntry.upddate ?? cardEntry.update ?? [];
              const dates = normalizeDateSeries(rawDates);
              return orderChronologically(prices, dates);
            })());
          }
          return await cardSeriesPromiseCache.get(key);
        }

        // 庫存是三態：有貨 / 售罄 / 不知道。
        // v29 寫 `latestStock > 0 ? "◯" : "售罄"`，而查不到時 latestStock 是 null，
        // `null > 0` 為 false，於是「缺欄位、卡號對不上、這張沒被收錄」全部被印成
        // 一句很有把握的「售罄」——把沒有答案講成一個答案，直接違反這個專案自己
        // 的原則 4。◯ 也一起換掉：那是拿 Unicode 字元當圖示，而且沒人教過它。
        function stockCell(raw) {
          const n = Number(raw);
          if (!Number.isFinite(n)) {
            return `<td class="right stockCell col-stock isUnknown" title="這張卡沒有庫存資料">—</td>`;
          }
          if (n > 0) return `<td class="right stockCell col-stock">有貨</td>`;
          return `<td class="right stockCell col-stock isOut">售罄</td>`;
        }

        async function runWithConcurrency(items, limit, worker) {
          if (!items.length) return;
          const cap = Math.max(1, Math.min(limit, items.length));
          let cursor = 0;
          const runners = Array.from({ length: cap }, async () => {
            while (cursor < items.length) {
              const idx = cursor++;
              await worker(items[idx], idx);
            }
          });
          await Promise.all(runners);
        }

        function renderSparklines(renderToken) {
          const cells = Array.from(els.tbody.querySelectorAll(".sparklineCell[data-sparkline-key]"));
          runWithConcurrency(cells, SPARKLINE_CONCURRENCY, async (cell) => {
            if (renderToken !== renderVersion) return;
            const key = cell.getAttribute("data-sparkline-key") || "";
            let cardNo = "";
            try {
              cardNo = decodeURIComponent(key);
            } catch {
              cardNo = key;
            }
            const series = await getCardSeries(cardNo);
            const prices = normalizePriceSeries(series && series.prices);
            const dates = (series && series.dates) || [];
            if (renderToken !== renderVersion || !cell.isConnected) return;
            cell.innerHTML = sparklineSvg(prices, dates);
          }).catch(() => {});
        }

        /* renderStockCells 整個拿掉了。庫存值在 toRows() 就已經在每一列的
           r.latestStock 上，v29 卻用骨架屏 + 併發佇列 + 三個計數器 + 兩支
           console.log 再去 rawData 查一次同一個值——那是一套假的非同步，
           每次 render（含每一次搜尋按鍵）都要跑 200 格。現在直接在列樣板裡
           用 stockCell(r.latestStock) 印出來。 */

        function fmtPct(n) {
          if (n === null || n === undefined || Number.isNaN(Number(n))) return "—";
          const v = Number(n);
          const sign = v > 0 ? "+" : "";
          return `${sign}${v.toFixed(2)}%`;
        }

        // 匯率三個來源全掛掉時會退回 0.22。v29 只在最頂列的匯率那格加了
        // 「（預設值）」——捲兩下就不在畫面上了，而表格裡每一格 NT$ 都是用那個
        // 數字換算出來的。改成就地標記：估算值前面加 ≈，並帶上原因當 title。
        function isEstimatedPrice() {
          return activeCurrency === "TWD" && exRateFallback;
        }

        const ESTIMATE_NOTE = "匯率來源皆無回應，以預設 0.22 換算，僅供參考";

        // marked=false 給級距標籤用：一段區間的兩端各加一個 ≈ 只是雜訊
        function formatPrice(n, marked = true) {
          if (n === null || n === undefined || Number.isNaN(Number(n))) return "—";
          let val = Number(n);
          if (activeCurrency === "TWD") {
            val = Math.round(val * exRate);
            const mark = marked && isEstimatedPrice() ? "≈" : "";
            return mark + "NT$" + new Intl.NumberFormat("zh-TW", { maximumFractionDigits: 0 }).format(val);
          }
          return "¥" + new Intl.NumberFormat("zh-TW", { maximumFractionDigits: 0 }).format(Math.round(val));
        }

        function pctClass(n) {
          const v = Number(n);
          if (!Number.isFinite(v)) return "zero";
          if (v > 0) return "good";
          if (v < 0) return "bad";
          return "zero";
        }

        const BAR_REF = 20;

        function moveCell(v, colClass) {
          const mag = Number.isFinite(Number(v)) ? Math.min(1, Math.abs(Number(v)) / BAR_REF) : 0;
          return `<td class="right pct ${colClass} ${pctClass(v)}">${escapeHtml(fmtPct(v))}<span class="move-bar" style="--m:${mag.toFixed(3)}"></span></td>`;
        }

        function setStatus(main, sub = "") {
          if (els.statusText) {
            els.statusText.textContent = main;
          }
          if (els.statusSub) {
            els.statusSub.textContent = sub ? `｜${sub}` : "";
          }
        }

        function showError(html) {
          els.errorBox.style.display = "block";
          els.errorBox.innerHTML = html;
        }

        function clearError() {
          els.errorBox.style.display = "none";
          els.errorBox.innerHTML = "";
        }

        function toRows(data) {
          const entries = Object.entries((data && data.cards) || {});
          return entries.map(([cardNo, c]) => ({
            cardNo: c.cardNo || cardNo,
            latestPrice: c.latestPrice,
            latestStock: c.latestStock,
            change1dPct: c.change1dPct,
            change3dPct: c.change3dPct,
            change7dPct: c.change7dPct,
            base1dDate: c.base1dDate,
            base1dPrice: c.base1dPrice,
            base3dDate: c.base3dDate,
            base3dPrice: c.base3dPrice,
            base7dDate: c.base7dDate,
            base7dPrice: c.base7dPrice,
          }));
        }

        function compareRows(a, b, sortKey) {
          if (sortKey === "cardNo") {
            return String(a.cardNo || "").localeCompare(String(b.cardNo || ""), "zh-Hant", {
              numeric: true,
              sensitivity: "base",
            });
          }

          const av = Number(a[sortKey]);
          const bv = Number(b[sortKey]);
          const aSafe = Number.isFinite(av) ? av : -Infinity;
          const bSafe = Number.isFinite(bv) ? bv : -Infinity;
          return aSafe - bSafe;
        }

        function sortLabel(sortKey) {
          switch (sortKey) {
            case "cardNo":
              return "卡號";
            case "latestPrice":
              return "最新價";
            case "change1dPct":
              return "1日漲跌幅";
            case "change3dPct":
              return "3日漲跌幅";
            case "change7dPct":
              return "7日漲跌幅";
            default:
              return sortKey;
          }
        }

        /* ── 篩選與統計共用同一個期間 ──────────────────────────────────
           v29 的「只看上漲／只看下跌」寫死吃 change3dPct，而排序、KPI、分布圖、
           頂列的「24h 上漲／下跌」、H1 的「今天」全都是 1 日。結果是同一個視窗
           裡頁籤亮著「只看上漲」，它下面的 KPI 印「上漲 47 ／ 下跌 39」、最低
           1 日漲跌幅 −31.44%。這不是體驗瑕疵，是可信度歸零。
           期間現在只有一個來源：目前排序的那一欄。排卡號或價格時退回 1 日，
           並且由狀態列把「依 X 日」明講出來。 */
        function trendKey() {
          return String(activeSortKey).startsWith("change") ? activeSortKey : "change1dPct";
        }

        function trendPeriodLabel() {
          const k = trendKey();
          return k === "change3dPct" ? "3 日" : k === "change7dPct" ? "7 日" : "1 日";
        }

        // 手機版只留當前期間的漲跌欄，用 body[data-period] 選（見 @media 640）
        function trendPeriodSlug() {
          const k = trendKey();
          return k === "change3dPct" ? "3d" : k === "change7dPct" ? "7d" : "1d";
        }

        // 頁籤狀態集中在這裡：空狀態的「看全部卡片」也要能把頁籤切回去，
        // 不然按鈕做了事、頁籤還亮在別的地方。
        function setTrendFilter(next) {
          activeTrendFilter = next;
          document.querySelectorAll(".tab-btn").forEach((b) => {
            const on = b.getAttribute("data-trend") === next;
            b.classList.toggle("active", on);
            b.setAttribute("aria-pressed", on ? "true" : "false");
          });
          resetClearWatchlistBtn();
        }

        function formatSortValue(sortKey, row) {
          if (!row) return "—";
          if (sortKey === "cardNo") return row.cardNo || "—";
          if (sortKey === "latestPrice") return formatPrice(row.latestPrice);
          return fmtPct(row[sortKey]);
        }

        /* ---------- KPI 統計 ---------- */

        // 以卡號排序時無數值可統計，退回 1 日漲跌幅
        function statKeyForKpi() {
          return activeSortKey === "cardNo" ? "change1dPct" : activeSortKey;
        }

        function formatStatValue(statKey, v) {
          if (!Number.isFinite(v)) return "—";
          return statKey === "latestPrice" ? formatPrice(v) : fmtPct(v);
        }

        // values 需已由小到大排序
        function medianOf(values) {
          const n = values.length;
          if (!n) return NaN;
          const mid = n >> 1;
          return n % 2 ? values[mid] : (values[mid - 1] + values[mid]) / 2;
        }

        function setKpiTone(el, v, enabled) {
          if (!el) return;
          const tone = enabled && Number.isFinite(v) ? pctClass(v) : "";
          // className 整個覆寫，所以樣式不能掛在 .v 上，一律從 .summaryItem 選下來
          el.className = tone ? `v mono pct ${tone}` : "v mono";

          // 幅度尺跟表格的 .move-bar 共用 BAR_REF 這組刻度。是元素的兄弟節點，
          // 因為 el.textContent 每次都會清掉 .v 底下的子節點。
          const bar = el.parentElement && el.parentElement.querySelector(".kpiBar");
          if (!bar) return;
          bar.className = tone ? `kpiBar ${tone}` : "kpiBar";
          const mag = tone ? Math.min(1, Math.abs(v) / BAR_REF) : 0;
          bar.style.setProperty("--m", mag.toFixed(3));
        }

        // 漲跌幅用固定級距，價格用等寬 5 段動態級距
        const PCT_BUCKETS = [
          { label: "≥ +10%", tone: "good", strength: 1, test: (v) => v >= 10 },
          { label: "+5 ~ +10%", tone: "good", strength: 0.62, test: (v) => v >= 5 && v < 10 },
          { label: "0 ~ +5%", tone: "good", strength: 0.32, test: (v) => v > 0 && v < 5 },
          { label: "平盤", tone: "zero", strength: 0.8, test: (v) => v === 0 },
          { label: "-5 ~ 0%", tone: "bad", strength: 0.32, test: (v) => v < 0 && v > -5 },
          { label: "-10 ~ -5%", tone: "bad", strength: 0.62, test: (v) => v <= -5 && v > -10 },
          { label: "≤ -10%", tone: "bad", strength: 1, test: (v) => v <= -10 },
        ];

        function buildBuckets(statKey, values) {
          if (statKey !== "latestPrice") {
            return PCT_BUCKETS.map((b) => ({ ...b, count: 0 }));
          }
          if (!values.length) return [];

          const min = values[0];
          const max = values[values.length - 1];
          const segments = 5;
          const step = (max - min) / segments;
          if (!(step > 0)) {
            return [{ label: formatPrice(min, false), tone: "price", strength: 1, count: 0, test: () => true }];
          }

          const out = [];
          for (let i = 0; i < segments; i++) {
            const lo = min + step * i;
            const isLast = i === segments - 1;
            const hi = isLast ? Infinity : min + step * (i + 1);
            out.push({
              label: `${formatPrice(lo, false)} ~ ${formatPrice(isLast ? max : hi, false)}`,
              tone: "price",
              strength: 0.35 + (0.65 * i) / (segments - 1),
              count: 0,
              test: (v) => v >= lo && v < hi,
            });
          }
          return out;
        }

        function renderDistribution(buckets, total) {
          if (!els.kpiDistBar || !els.kpiDistLegend) return;

          if (!total || !buckets.length) {
            els.kpiDistBar.innerHTML = "";
            els.kpiDistLegend.innerHTML = `<span class="distLegendEmpty">無可統計的資料</span>`;
            return;
          }

          els.kpiDistBar.innerHTML = buckets
            .filter((b) => b.count > 0)
            .map((b) => {
              const share = (b.count / total) * 100;
              const tip = `${b.label}：${fmtNum(b.count)} 筆（${share.toFixed(1)}%）`;
              return `<span class="distSeg distSeg--${b.tone}" style="flex: ${b.count} 0 auto; opacity: ${b.strength};" title="${escapeHtml(tip)}"></span>`;
            })
            .join("");

          els.kpiDistLegend.innerHTML = buckets
            .map((b) => {
              const share = (b.count / total) * 100;
              return `<span class="distLegendItem${b.count ? "" : " isEmpty"}" title="${escapeHtml(`${b.label}：${fmtNum(b.count)} 筆（${share.toFixed(1)}%）`)}"><span class="distDot distSeg--${b.tone}" style="opacity: ${b.strength};"></span><span class="distLegendLabel">${escapeHtml(b.label)}</span><span class="distLegendVal"><b>${fmtNum(b.count)}</b><span class="distLegendShare">${share.toFixed(1)}%</span></span></span>`;
            })
            .join("");
        }

        function updateKpi(filtered) {
          const statKey = statKeyForKpi();
          const label = sortLabel(statKey);
          const isPct = statKey !== "latestPrice";

          const rows = filtered
            .filter((r) => Number.isFinite(Number(r[statKey])))
            .sort((a, b) => Number(a[statKey]) - Number(b[statKey]));
          const values = rows.map((r) => Number(r[statKey]));
          const n = values.length;

          els.kpiAvgLabel.textContent = `平均${label}`;
          els.kpiMedianLabel.textContent = `中位數${label}`;
          els.kpiMaxLabel.textContent = `最高${label}`;
          els.kpiMinLabel.textContent = `最低${label}`;
          els.kpiDistLabel.textContent = `${label} 分布區間`;

          els.kpiShown.textContent = fmtNum(filtered.length);
          els.kpiShownSub.textContent = `／ 全部 ${fmtNum(cardRows.length)} 筆`;

          const avg = n ? values.reduce((s, v) => s + v, 0) / n : NaN;
          const med = medianOf(values);
          const minRow = rows[0] || null;
          const maxRow = rows[n - 1] || null;

          els.kpiAvg.textContent = formatStatValue(statKey, avg);
          els.kpiMedian.textContent = formatStatValue(statKey, med);
          els.kpiMax.textContent = maxRow ? formatStatValue(statKey, Number(maxRow[statKey])) : "—";
          els.kpiMin.textContent = minRow ? formatStatValue(statKey, Number(minRow[statKey])) : "—";

          setKpiTone(els.kpiAvg, avg, isPct);
          setKpiTone(els.kpiMedian, med, isPct);
          setKpiTone(els.kpiMax, maxRow ? Number(maxRow[statKey]) : NaN, isPct);
          setKpiTone(els.kpiMin, minRow ? Number(minRow[statKey]) : NaN, isPct);

          const maxCardNo = maxRow ? String(maxRow.cardNo || "—") : "—";
          const minCardNo = minRow ? String(minRow.cardNo || "—") : "—";
          els.kpiMaxCard.textContent = maxCardNo;
          els.kpiMaxCard.title = maxCardNo;
          els.kpiMinCard.textContent = minCardNo;
          els.kpiMinCard.title = minCardNo;

          els.kpiAvgSub.textContent = n ? `有效樣本 ${fmtNum(n)} 筆` : "無有效樣本";
          if (isPct) {
            const up = values.filter((v) => v > 0).length;
            const down = values.filter((v) => v < 0).length;
            els.kpiMedianSub.textContent = `上漲 ${fmtNum(up)} ／ 下跌 ${fmtNum(down)}`;
          } else {
            els.kpiMedianSub.textContent = `幣別 ${activeCurrency === "TWD" ? "NT$" : "¥"}`;
          }

          const buckets = buildBuckets(statKey, values);
          for (const v of values) {
            const hit = buckets.find((b) => b.test(v));
            if (hit) hit.count++;
          }
          renderDistribution(buckets, n);
        }

        function updateHeaderSortState() {
          const roots = [document.getElementById("tableWrapHeader")];
          if (stickyHeaderMirror) {
            const mirrorHead = stickyHeaderMirror.querySelector("thead");
            if (mirrorHead) roots.push(mirrorHead);
          }

          for (const root of roots) {
            if (!root) continue;
            root.querySelectorAll("th.sortable").forEach((th) => {
              const sortKey = th.getAttribute("data-sort-key") || "";
              const isActive = sortKey === activeSortKey;
              // v29 兩個分支都寫 "none"，所以讀屏永遠不知道目前依哪一欄、
              // 哪個方向排序——視覺上的 ▲▼ 對它們不存在。
              if (isActive) {
                th.setAttribute("data-sort-dir", activeSortDirection);
                th.setAttribute("aria-sort", activeSortDirection === "asc" ? "ascending" : "descending");
              } else {
                th.removeAttribute("data-sort-dir");
                th.setAttribute("aria-sort", "none");
              }
            });
          }
        }

        function applySort(sortKey, toggleIfSame = false) {
          if (!sortKey) return;

          if (toggleIfSame && activeSortKey === sortKey) {
            activeSortDirection = activeSortDirection === "desc" ? "asc" : "desc";
          } else {
            activeSortKey = sortKey;
            activeSortDirection = sortKey === "cardNo" ? "asc" : "desc";
          }

          render();
        }

        function handleHeaderSortClick(event) {
          const th = event.target.closest("th.sortable[data-sort-key]");
          if (!th) return;
          applySort(th.getAttribute("data-sort-key"), true);
        }

        // v29 的排序只有滑鼠點得動：th 是純 <th>，沒有 tabindex、沒有鍵盤事件。
        function handleHeaderSortKeydown(event) {
          if (event.key !== "Enter" && event.key !== " " && event.key !== "Spacebar") return;
          const th = event.target.closest("th.sortable[data-sort-key]");
          if (!th) return;
          event.preventDefault();
          applySort(th.getAttribute("data-sort-key"), true);
        }

        function sortAndFilterRows(rows) {
          const q = (els.q.value || "").trim().toLowerCase();

          let out = rows;
          if (q) {
            // 客人記得的是卡名或作品名，不是卡號，所以三個都要能搜
            out = out.filter((r) => {
              const no = String(r.cardNo || "");
              if (no.toLowerCase().includes(q)) return true;
              if (cardName(no).toLowerCase().includes(q)) return true;
              return seriesTitle(no).toLowerCase().includes(q);
            });
          }

          // 頁籤篩選邏輯。上漲／下跌吃 trendKey()，也就是排序中的那一欄，
          // 所以「只看上漲」之後 KPI 的下跌筆數必定是 0，分布圖必定全綠。
          if (activeTrendFilter === "watchlist") {
            out = out.filter((r) => watchlist.has(r.cardNo));
          } else if (activeTrendFilter === "up" || activeTrendFilter === "down") {
            const key = trendKey();
            const wantUp = activeTrendFilter === "up";
            out = out.filter((r) => {
              const v = Number(r[key]);
              return Number.isFinite(v) && (wantUp ? v > 0 : v < 0);
            });
          }

          out = out.slice().sort((a, b) => {
            const cmp = compareRows(a, b, activeSortKey);
            return activeSortDirection === "asc" ? cmp : -cmp;
          });
          return out;
        }

        function clampPage(totalItems) {
          const totalPages = Math.max(1, Math.ceil(totalItems / pageSize));
          currentPage = Math.min(Math.max(1, currentPage), totalPages);
          return totalPages;
        }

        function updatePaginationUi(totalItems, pageItemsLength, totalPages, pageStartIndex) {
          const pageEndIndex = pageItemsLength > 0 ? pageStartIndex + pageItemsLength : 0;
          const displayStart = pageItemsLength > 0 ? pageStartIndex + 1 : 0;

          els.pageInfo.textContent = `第 ${currentPage} / ${totalPages} 頁`;
          els.pageStatsText.textContent = `顯示 ${displayStart}-${pageEndIndex} / ${totalItems}`;
          els.prevPageBtn.disabled = currentPage <= 1;
          els.nextPageBtn.disabled = currentPage >= totalPages || totalItems === 0;
        }

        // 全站統計板更新 (Global Stats)
        function updateGlobalStats() {
          const total = cardRows.length;
          const gainers = cardRows.filter(r => Number(r.change1dPct) > 0).length;
          const losers = cardRows.filter(r => Number(r.change1dPct) < 0).length;

          document.getElementById("global-total").textContent = fmtNum(total);
          document.getElementById("global-gainers").textContent = fmtNum(gainers);
          document.getElementById("global-losers").textContent = fmtNum(losers);
          document.getElementById("global-watchlist").textContent = fmtNum(watchlist.size);
          document.getElementById("global-rate").textContent = exRate
            ? `1 JPY ≈ ${exRate.toFixed(4)} TWD${exRateFallback ? "（預設值）" : ""}`
            : "—";
        }

        function render() {
          if (!rawData) return;
          const renderToken = ++renderVersion;
          clearError();

          const filtered = sortAndFilterRows(cardRows);
          const totalPages = clampPage(filtered.length);
          const startIdx = (currentPage - 1) * pageSize;
          const pageRows = filtered.slice(startIdx, startIdx + pageSize);

          updateHeaderSortState();
          updateKpi(filtered);
          updatePaginationUi(filtered.length, pageRows.length, totalPages, startIdx);

          // 手機版靠這個屬性決定留下哪一欄漲跌幅（見 @media max-width: 640）
          document.body.setAttribute("data-period", trendPeriodSlug());

          const priceTitle = isEstimatedPrice() ? ` title="${escapeHtml(ESTIMATE_NOTE)}"` : "";

          const frag = document.createDocumentFragment();
          pageRows.forEach((r) => {
            const tr = document.createElement("tr");
            const cardNo = String(r.cardNo ?? "");
            const isFavorite = watchlist.has(cardNo);

            // <button aria-pressed>，不是 <span>：v29 的星星不可聚焦、沒有角色、
            // 沒有狀態，鍵盤與讀屏使用者完全用不到自訂清單這個功能。
            const starLabel = `${isFavorite ? "自清單移除" : "加入清單"}：${cardName(cardNo) || cardNo}`;
            const starHtml =
              `<button type="button" class="watchlist-star" data-card="${encodeURIComponent(cardNo)}"` +
              ` aria-pressed="${isFavorite ? "true" : "false"}" aria-label="${escapeHtml(starLabel)}"` +
              ` title="${escapeHtml(starLabel)}">` +
              `<i class="fa-${isFavorite ? "solid" : "regular"} fa-star" aria-hidden="true"></i></button>`;

            tr.innerHTML = `
              <td class="center-align">${starHtml}</td>
              ${cardIdentCell(cardNo)}
              <td class="right price-cell col-price"${priceTitle}>${escapeHtml(formatPrice(r.latestPrice))}</td>
              ${moveCell(r.change1dPct, "col-1d")}
              ${moveCell(r.change3dPct, "col-3d")}
              ${moveCell(r.change7dPct, "col-7d")}
              ${stockCell(r.latestStock)}
              <td class="right col-spark sparklineCell" data-sparkline-key="${encodeURIComponent(cardNo)}"><span class="sparklineSkeleton" aria-hidden="true"></span></td>
            `.trim();
            frag.appendChild(tr);
          });

          // v29 在零結果時只留下一排表頭跟一句「顯示 0-0 / 0」。第一次造訪點開
          // 「自訂清單」保證是空的，那是新訪客最可能按的一個頁籤。
          if (!pageRows.length) frag.appendChild(emptyStateRow());

          els.tbody.replaceChildren(frag);

          const statusParts = [];
          const filterNote = trendFilterNote();
          if (filterNote) statusParts.push(filterNote);
          statusParts.push(
            `依「${sortLabel(activeSortKey)}」${activeSortDirection === "asc" ? "由低到高" : "由高到低"}排序`
          );
          statusParts.push(`第 ${currentPage}/${totalPages} 頁`);
          setStatus("已載入", statusParts.join("｜"));

          updateWatchlistAction();
          updatePeriodSegment();
          renderSparklines(renderToken);
          updateGlobalStats();
        }

        // 期間切換器要反映 trendKey()，不是 activeSortKey：排序在「最新價」時
        // 畫面上生效的漲跌期間是退回的 1 日，切換器就該亮在 1 日。
        function updatePeriodSegment() {
          const key = trendKey();
          document.querySelectorAll("#periodSegment .segment-btn").forEach((b) => {
            const on = b.getAttribute("data-period-key") === key;
            b.classList.toggle("active", on);
            b.setAttribute("aria-pressed", on ? "true" : "false");
          });
        }

        // 篩選中的期間要講出來。排序在「最新價」而篩選退回 1 日時，這是畫面上
        // 唯一說得出「依 1 日」的地方。
        function trendFilterNote() {
          if (activeTrendFilter === "up") return `只看上漲（依 ${trendPeriodLabel()}）`;
          if (activeTrendFilter === "down") return `只看下跌（依 ${trendPeriodLabel()}）`;
          if (activeTrendFilter === "watchlist") return `自訂清單 ${watchlist.size} 張`;
          return "";
        }

        function emptyStateRow() {
          const q = (els.q.value || "").trim();
          const tr = document.createElement("tr");
          tr.className = "emptyRow";
          const td = document.createElement("td");
          td.colSpan = 8;

          let title = "沒有可顯示的卡片";
          let body = "資料來源可能還沒更新，按右上角「重新整理」再試一次。";
          let action = "";

          if (q) {
            title = `找不到符合「${escapeHtml(q)}」的卡片`;
            body =
              `可以只打卡號的前半段（例如 <span class="mono">KC/S42</span>），` +
              `或改用卡名、作品名搜尋。`;
            action = `<button type="button" class="statusAction" data-empty-action="clearQuery">清除搜尋</button>`;
          } else if (activeTrendFilter === "watchlist") {
            title = "自訂清單還是空的";
            body =
              `在任何一列左邊按 <i class="fa-solid fa-star star" aria-hidden="true"></i>，` +
              `那張卡就會收進這裡。清單只存在這台裝置上，換裝置不會跟著走。`;
            action = `<button type="button" class="statusAction" data-empty-action="showAll">先看全部卡片</button>`;
          } else if (activeTrendFilter === "up" || activeTrendFilter === "down") {
            title = `目前沒有${activeTrendFilter === "up" ? "上漲" : "下跌"}的卡片（依 ${trendPeriodLabel()}）`;
            body = "換一個期間看看：點表頭的「1 日」「3 日」「7 日」就會一起換。";
            action = `<button type="button" class="statusAction" data-empty-action="showAll">看全部卡片</button>`;
          }

          td.innerHTML =
            `<span class="emptyTitle">${title}</span>` +
            `<span class="emptyBody">${body}</span>` +
            (action ? `<div class="emptyActions">${action}</div>` : "");
          tr.appendChild(td);
          return tr;
        }

        // 清空清單是破壞性動作，所以要按兩次：第一次把按鈕變成確認，
        // 第二次才真的清掉。不用原生 confirm()，那個對話框跟這頁沒有關係。
        let clearWatchlistArmed = false;

        function resetClearWatchlistBtn() {
          clearWatchlistArmed = false;
          if (els.clearWatchlistBtn) els.clearWatchlistBtn.textContent = "清空清單";
        }

        function updateWatchlistAction() {
          const btn = els.clearWatchlistBtn;
          if (!btn) return;
          const show = activeTrendFilter === "watchlist" && watchlist.size > 0;
          btn.style.display = show ? "" : "none";
          if (!show) resetClearWatchlistBtn();
        }

        // 卡片欄：縮圖 + 上為卡名，下為卡號（有作品名時接在卡號後面）。
        // cardNo 一律放在 data-card-no，因為卡圖預覽的事件是靠這個屬性取卡號，
        // 不能再讀整格的 textContent（現在裡面有卡名了）。
        function cardIdentCell(cardNo) {
          const name = cardName(cardNo);
          const title = seriesTitle(cardNo);
          // 字典還沒載完（或查不到）時，卡號就是主要標題，下面那行不重複顯示
          const primary = name || cardNo;
          const metaParts = name ? [`<span class="no">${escapeHtml(cardNo)}</span>`] : [];
          if (title) metaParts.push(escapeHtml(title));

          // 縮圖跟滑鼠移入的大圖走同一組來源：devilfox 先試，抓不到再退回官方
          // cardlist（見 tbody 的 error 監聽）。兩邊都沒有就留空框，不留破圖。
          const primarySrc = cardNoToDevilFoxUrl(cardNo);
          const fallbackSrc = cardNoToImageUrl(cardNo);
          const src = primarySrc || fallbackSrc;
          const spare = primarySrc && fallbackSrc !== primarySrc ? fallbackSrc : "";
          const img = src
            ? `<img class="cardThumb" src="${escapeHtml(src)}" data-fallback="${escapeHtml(spare)}" alt="" loading="lazy" decoding="async" />`
            : `<span class="cardThumb" aria-hidden="true"></span>`;

          return `
            <td class="card-no-col" data-card-no="${escapeHtml(cardNo)}">
              <div class="cardIdent">
                ${img}
                <div class="cardIdentText">
                  <span class="cardName" title="${escapeHtml(primary)}">${escapeHtml(primary)}</span>
                  <span class="cardMeta">${metaParts.join(" · ")}</span>
                </div>
              </div>
            </td>`;
        }

        // ── 卡名與作品名 ──
        // 兩份檔案都在同源 repo 裡。先讓表格畫出來，載完再把名字補上去，
        // 所以 cardDictionary.json 的體積不會擋住首次渲染。
        let cardNamesLoaded = false;
        async function loadCardNames() {
          // 字典是靜態的，按重新整理不需要再抓一次
          if (cardNamesLoaded) return;
          cardNamesLoaded = true;
          try {
            const [dict, titles] = await Promise.allSettled([
              fetchJson(CARD_DICTIONARY_URL),
              fetchJson(CARD_TITLE_URL),
            ]);
            if (dict.status === "fulfilled" && Array.isArray(dict.value)) {
              for (const pair of dict.value) {
                if (Array.isArray(pair) && pair[0]) cardNameMap.set(String(pair[0]), String(pair[1] ?? ""));
              }
            }
            if (titles.status === "fulfilled" && titles.value && typeof titles.value === "object") {
              for (const [code, title] of Object.entries(titles.value)) {
                seriesTitleMap.set(code, String(title ?? ""));
              }
            }
          } catch {
            /* 沒有名字也不影響價格，維持只顯示卡號 */
          }
        }

        function cardName(cardNo) {
          return cardNameMap.get(String(cardNo || "")) || "";
        }

        // 作品名以系列代號查（KC/S42-010C → KC/S42）。cardTitle.json 的值常帶括號
        // 後綴標明代號，這裡去掉，因為卡號本來就顯示在旁邊了。
        function seriesTitle(cardNo) {
          const code = String(cardNo || "").split("-")[0];
          if (!code) return "";
          const raw = seriesTitleMap.get(code);
          if (!raw) return "";
          return raw.replace(/\s*[（(]\s*[A-Za-z0-9/]+\s*[)）]\s*$/, "").trim();
        }

        function escapeHtml(s) {
          return String(s ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#39;");
        }

        const WS_TCG_CARDLIST_BASE = "https://ws-tcg.com/wordpress/wp-content/images/cardlist/";

        function cardNoToImageUrl(cardNo) {
          if (!cardNo) return "";
          const s = String(cardNo).trim();
          const m = s.match(/^([^/]+)\/([^-]+)-(.+)$/);
          if (!m) return "";
          const series = m[1].toLowerCase();
          const expansion = m[2].toLowerCase();
          const cardId = m[3].replace(/\s+/g, "").toLowerCase();
          if (!series || !expansion || !cardId) return "";
          if (series.startsWith("os")) {
            return (
              "https://ws-rose.com/wordpress/wp-content/images/cardlist/" +
              series + "/" + expansion + "/" + series + "_" + expansion + "_" + cardId + ".png"
            );
          }
          let folderSlug = series + "_" + expansion;
          if (series === "srd" || series === "sks") folderSlug = "sxx_" + expansion;
          const first = series.charAt(0);
          return (
            WS_TCG_CARDLIST_BASE + first + "/" + folderSlug + "/" +
            series + "_" + expansion + "_" + cardId + ".png"
          );
        }

        function cardNoToDevilFoxUrl(cardNo) {
          if (!cardNo) return "";
          const s = String(cardNo).trim();
          const m = s.match(/^([^\/]+)\/([^-]+)-(.+)$/);
          if (!m) return "";
          const series = m[1].toLowerCase();
          const expansion = m[2].toLowerCase();
          const cardId = m[3].replace(/\s+/g, "").toLowerCase();
          if (!series || !expansion || !cardId) return "";
          return `https://imgs.devilfox.net/ws/${series}_${expansion}/${series}_${expansion}_${cardId}.png`;
        }

        const tooltip = document.getElementById("cardTooltip");
        const tooltipImg = document.getElementById("cardTooltipImg");
        let tooltipVisible = false;
        let tooltipCurrentUrl = "";

        function preloadImage(url) {
          if (!url || tooltipCurrentUrl === url) return;
          const img = new Image();
          img.src = url;
        }

        function setTooltipSrc(url, fallbackUrl) {
          if (tooltipCurrentUrl === url) {
            tooltipImg.classList.remove("loading");
            return;
          }
          tooltipCurrentUrl = url;
          tooltipImg.classList.add("loading");
          tooltipImg.src = url;
          tooltipImg.onload = () => tooltipImg.classList.remove("loading");
          tooltipImg.onerror = () => {
            tooltipImg.classList.remove("loading");
            if (fallbackUrl && fallbackUrl !== url) {
              tooltipCurrentUrl = fallbackUrl;
              tooltipImg.src = fallbackUrl;
            }
          };
        }

        function showTooltip(cardNo, x, y) {
          const devilUrl = cardNoToDevilFoxUrl(cardNo);
          const wsUrl = cardNoToImageUrl(cardNo);
          const url = devilUrl || wsUrl;
          if (!url) return;
          setTooltipSrc(url, devilUrl ? wsUrl : "");
          tooltip.style.transform = "";
          placeTooltip(x, y);
          tooltip.style.display = "block";
          tooltipVisible = true;
        }

        function placeTooltip(x, y) {
          const pad = 16;
          const tw = 192;
          const th = 280;
          let left = x + 14;
          let top = y - th - 10;
          if (top < pad) top = y + 24;
          if (left + tw + pad > window.innerWidth) left = x - tw - 14;
          if (left < pad) left = pad;
          tooltip.style.left = left + "px";
          tooltip.style.top = top + "px";
        }

        function hideTooltip() {
          tooltip.style.display = "none";
          tooltipVisible = false;
        }

        const isTouch = () => window.matchMedia("(hover: none)").matches;

        // 卡片格裡現在有卡名（可能還有作品名），所以卡號一律從 data-card-no 讀
        const cardNoOf = (td) => (td.getAttribute("data-card-no") || "").trim();

        // 縮圖抓不到時先換備援來源，再不行就把圖藏起來（框還在，列高不會跳）。
        // error 事件不冒泡，所以要用捕獲階段掛在 tbody 上，才不必逐張圖綁監聽。
        els.tbody.addEventListener(
          "error",
          (e) => {
            const img = e.target;
            if (!(img instanceof HTMLImageElement) || !img.classList.contains("cardThumb")) return;
            const spare = img.dataset.fallback || "";
            if (spare) {
              img.dataset.fallback = "";
              img.src = spare;
            } else {
              img.style.visibility = "hidden";
            }
          },
          true
        );

        // 桌機預覽
        document.getElementById("tbody").addEventListener("mouseover", (e) => {
          if (isTouch()) return;
          const td = e.target.closest("td.card-no-col");
          if (!td) return;
          const rect = td.getBoundingClientRect();
          showTooltip(cardNoOf(td), rect.left + rect.width / 2, rect.top);
        });

        document.getElementById("tbody").addEventListener("mouseout", (e) => {
          if (isTouch()) return;
          const td = e.target.closest("td.card-no-col");
          if (!td) return;
          hideTooltip();
        });

        // 行動版預載
        document.getElementById("tbody").addEventListener("touchstart", (e) => {
          const td = e.target.closest("td.card-no-col");
          if (!td) return;
          const cardNo = cardNoOf(td);
          preloadImage(cardNoToDevilFoxUrl(cardNo) || cardNoToImageUrl(cardNo));
        }, { passive: true });

        // 行動版點擊
        document.getElementById("tbody").addEventListener("click", (e) => {
          if (!isTouch()) return;
          const td = e.target.closest("td.card-no-col");
          if (!td) {
            hideTooltip();
            return;
          }
          e.stopPropagation();
          const cardNo = cardNoOf(td);
          if (tooltipVisible) {
            hideTooltip();
          } else {
            const rect = td.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top;
            showTooltip(cardNo, x, y);
            setTimeout(() => {
              document.addEventListener("click", hideTooltip, { once: true });
            }, 0);
          }
        });

        // 監聽星星點擊行為 (Watchlist Click Event)
        els.tbody.addEventListener("click", (e) => {
          const star = e.target.closest(".watchlist-star");
          if (!star) return;
          e.stopPropagation();
          const cardNo = decodeURIComponent(star.getAttribute("data-card"));
          const nowOn = !watchlist.has(cardNo);
          if (nowOn) {
            watchlist.add(cardNo);
          } else {
            watchlist.delete(cardNo);
          }
          // 狀態只有 aria-pressed 一個來源，圖示跟著它換
          star.setAttribute("aria-pressed", nowOn ? "true" : "false");
          star.innerHTML = `<i class="fa-${nowOn ? "solid" : "regular"} fa-star" aria-hidden="true"></i>`;
          const label = `${nowOn ? "自清單移除" : "加入清單"}：${cardName(cardNo) || cardNo}`;
          star.setAttribute("aria-label", label);
          star.setAttribute("title", label);
          localStorage.setItem(WATCHLIST_STORAGE_KEY, JSON.stringify([...watchlist]));
          updateGlobalStats();
          updateWatchlistAction();
          // 正在看自訂清單時取消收藏，那一列要當場離開清單
          if (activeTrendFilter === "watchlist" && !nowOn) render();
        });

        // 空狀態裡的出口動作
        els.tbody.addEventListener("click", (e) => {
          const btn = e.target.closest("[data-empty-action]");
          if (!btn) return;
          const kind = btn.getAttribute("data-empty-action");
          if (kind === "clearQuery") {
            els.q.value = "";
            els.q.focus();
          } else if (kind === "showAll") {
            setTrendFilter("all");
          }
          currentPage = 1;
          render();
        });

        async function fetchJson(url) {
          const res = await fetch(url, { cache: "no-store" });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return await res.json();
        }

        // 匯率來源依序嘗試，全部都支援 CORS；任一來源失敗就換下一個
        const EX_RATE_SOURCES = [
          {
            name: "jsdelivr currency-api",
            url: "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/jpy.json",
            pick: (d) => d && d.jpy && d.jpy.twd,
          },
          {
            name: "open.er-api",
            url: "https://open.er-api.com/v6/latest/JPY",
            pick: (d) => d && d.rates && d.rates.TWD,
          },
          {
            name: "frankfurter",
            url: "https://api.frankfurter.app/latest?from=JPY&to=TWD",
            pick: (d) => d && d.rates && d.rates.TWD,
          },
        ];

        async function fetchExchangeRate() {
          for (const source of EX_RATE_SOURCES) {
            try {
              const rate = Number(source.pick(await fetchJson(source.url)));
              // 合理範圍檢查，避免來源回傳壞資料造成價格全錯
              if (!Number.isFinite(rate) || rate <= 0.05 || rate >= 1) continue;
              exRate = rate;
              exRateFallback = false;
              return;
            } catch {
              /* 換下一個來源 */
            }
          }
          exRate = 0.22;
          exRateFallback = true;
        }

        function setGeneratedAt(ms) {
          if (!els.generatedAtText) return;
          if (!ms || !Number.isFinite(Number(ms))) {
            els.generatedAtText.textContent = "—";
            return;
          }
          const d = new Date(Number(ms));
          const s = new Intl.DateTimeFormat("zh-TW", {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false,
          }).format(d);
          els.generatedAtText.textContent = s;
        }

        async function load() {
          renderVersion += 1;
          productDataPromiseCache.clear();
          cardSeriesPromiseCache.clear();
          setStatus("載入中…");
          clearError();
          if (els.sourceText) {
            els.sourceText.textContent = "";
          }
          els.tbody.replaceChildren();

          const [, dataResult] = await Promise.allSettled([
            fetchExchangeRate(),
            fetchJson(REMOTE_URL),
          ]);

          if (dataResult.status === "rejected") {
            const err1 = dataResult.reason instanceof Error ? dataResult.reason.message : String(dataResult.reason);
            setStatus("載入失敗", "請確認網路或 JSON 來源是否可用");
            // 按鈕上寫的是「重新整理」。v29 的這句話指向一個不存在的按鈕名稱。
            showError(
              `遠端資料載入失敗：<code>${escapeHtml(err1)}</code><br/>` +
                `你可以稍後按右上角「重新整理」重試。`
            );
            return;
          }

          const data = dataResult.value;
          rawData = data;
          cardRows = toRows(data);
          setGeneratedAt(data.generatedAt);
          if (els.sourceText) {
            els.sourceText.textContent = `source: ${REMOTE_URL}`;
          }
          render();

          // 名字補完後重畫一次，讓已經在畫面上的列換成卡名
          loadCardNames().then(() => {
            if (rawData) render();
          });
        }

        function bind() {
          const onChange = () => {
            currentPage = 1;
            render();
          };

          els.q.addEventListener("input", onChange);

          // 頁籤篩選點擊 (Filter Tab Clicks)
          document.getElementById("filterTabs").addEventListener("click", (e) => {
            const btn = e.target.closest(".tab-btn");
            if (!btn) return;
            setTrendFilter(btn.getAttribute("data-trend"));
            onChange();
          });

          // 幣別 Segment 控制器 (Currency Segment Clicks)
          document.getElementById("currencySegment").addEventListener("click", (e) => {
            const btn = e.target.closest(".segment-btn");
            if (!btn) return;
            document.querySelectorAll(".segment-btn").forEach((b) => {
              const on = b === btn;
              b.classList.toggle("active", on);
              b.setAttribute("aria-pressed", on ? "true" : "false");
            });
            activeCurrency = btn.getAttribute("data-currency");
            render();
          });

          // 期間切換（手機版）。等同於去點那一欄的表頭排序，所以直接走 applySort。
          document.getElementById("periodSegment").addEventListener("click", (e) => {
            const btn = e.target.closest(".segment-btn");
            if (!btn) return;
            applySort(btn.getAttribute("data-period-key"));
          });

          // 清空清單：按兩次才生效
          if (els.clearWatchlistBtn) {
            els.clearWatchlistBtn.addEventListener("click", () => {
              if (!clearWatchlistArmed) {
                clearWatchlistArmed = true;
                els.clearWatchlistBtn.textContent = `確定清空 ${watchlist.size} 張？`;
                return;
              }
              watchlist.clear();
              localStorage.setItem(WATCHLIST_STORAGE_KEY, JSON.stringify([]));
              resetClearWatchlistBtn();
              currentPage = 1;
              render();
            });
            // 手指或焦點移開就解除待確認狀態，不留一個半按下的按鈕
            els.clearWatchlistBtn.addEventListener("blur", resetClearWatchlistBtn);
          }

          // 換頁後把畫面捲回數據表格最上方
          const scrollToTableTop = () => {
            const tableWrap = document.querySelector(".tableWrap");
            if (!tableWrap) return;
            const top = tableWrap.getBoundingClientRect().top + window.pageYOffset - 12;
            window.scrollTo({ top: Math.max(top, 0), behavior: "smooth" });
          };

          els.prevPageBtn.addEventListener("click", () => {
            if (currentPage <= 1) return;
            currentPage -= 1;
            render();
            scrollToTableTop();
          });
          els.nextPageBtn.addEventListener("click", () => {
            currentPage += 1;
            render();
            scrollToTableTop();
          });

          const mainHeader = document.getElementById("tableWrapHeader");
          mainHeader.addEventListener("click", handleHeaderSortClick);
          mainHeader.addEventListener("keydown", handleHeaderSortKeydown);
          els.reloadBtn.addEventListener("click", () => load());
          if (els.themeToggleBtn) {
            els.themeToggleBtn.addEventListener("click", toggleTheme);
          }

          window.addEventListener("keydown", (ev) => {
            if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "r") {
              ev.preventDefault();
              load();
            }
            if (ev.key === "/" && document.activeElement !== els.q) {
              ev.preventDefault();
              els.q.focus();
            }
          });
        }
        applyTheme(resolveInitialTheme());
        bind();

        // ── Sticky thead 鏡像方案 ──
        (function initStickyThead() {
          const tableWrap = document.querySelector(".tableWrap");
          const table = tableWrap && tableWrap.querySelector("table");
          const thead = document.getElementById("tableWrapHeader");
          if (!tableWrap || !table || !thead) return;

          const mirror = document.createElement("div");
          mirror.id = "stickyTheadMirror";
          // 鏡像對讀屏是重複的一份表頭，也不該多出一組 Tab 停留點：
          // 整塊 aria-hidden，複製出來的 th 一律 tabindex="-1"。
          mirror.setAttribute("aria-hidden", "true");
          const mirrorTable = document.createElement("table");
          const mirrorThead = thead.cloneNode(true);
          mirrorThead.removeAttribute("id");
          mirrorThead.querySelectorAll("th[tabindex]").forEach((th) => {
            th.setAttribute("tabindex", "-1");
          });
          mirrorTable.appendChild(mirrorThead);
          mirror.appendChild(mirrorTable);
          document.body.appendChild(mirror);
          stickyHeaderMirror = mirror;
          mirror.addEventListener("click", handleHeaderSortClick);
          updateHeaderSortState();

          let pinned = false;

          function syncWidths() {
            const wrapRect = tableWrap.getBoundingClientRect();
            mirror.style.left  = wrapRect.left + "px";
            mirror.style.width = wrapRect.width + "px";
            const realThs   = thead.querySelectorAll("th");
            const cloneThs  = mirrorThead.querySelectorAll("th");
            mirrorTable.style.width = table.offsetWidth + "px";
            realThs.forEach((th, i) => {
              if (cloneThs[i]) {
                const w = th.getBoundingClientRect().width + "px";
                cloneThs[i].style.width    = w;
                cloneThs[i].style.minWidth = w;
                cloneThs[i].style.maxWidth = w;
              }
            });
          }

          function syncScroll() {
            mirror.scrollLeft = tableWrap.scrollLeft;
          }

          function update() {
            const rect   = tableWrap.getBoundingClientRect();
            const theadH = thead.getBoundingClientRect().height;
            const shouldPin = rect.top < 0 && rect.bottom > theadH + 10;
            if (shouldPin && !pinned) {
              pinned = true;
              mirror.style.display = "block";
              syncWidths();
              syncScroll();
            } else if (!shouldPin && pinned) {
              pinned = false;
              mirror.style.display = "none";
            } else if (pinned) {
              syncWidths();
              syncScroll();
            }
          }

          window.addEventListener("scroll",   update,     { passive: true });
          tableWrap.addEventListener("scroll", () => { if (pinned) { syncWidths(); syncScroll(); } }, { passive: true });
          window.addEventListener("resize",   () => { if (pinned) syncWidths(); }, { passive: true });
        })();

        // ── 右側浮動置頂按鈕 ──
        (function initBackToTop() {
          const btn = document.getElementById("backToTopBtn");
          if (!btn) return;
          const SHOW_AFTER = 240;

          const update = () => {
            btn.classList.toggle("visible", window.pageYOffset > SHOW_AFTER);
          };

          btn.addEventListener("click", () => {
            window.scrollTo({ top: 0, behavior: "smooth" });
          });
          window.addEventListener("scroll", update, { passive: true });
          update();
        })();

        load();
      })();
    </script>
  </body>
</html>
