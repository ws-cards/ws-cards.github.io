<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#141820">
  <meta name="description" content="Weiss Schwarz 攻擊階段紀錄：DeckLog 匯入、前排布陣、直攻／正面／側面與吃傷結算。">
  <meta property="og:title" content="攻擊記錄｜WS-Cards 卡片雲">
  <meta property="og:description" content="用 DeckLog 匯入雙方牌組，快速記錄攻擊宣告、取消與用牌總結。">
  <title>攻擊記錄｜WS-Cards 卡片雲</title>
  <link rel="icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #e8ecf2;
      --muted: #8b95a8;
      --panel: #1c222d;
      --panel-2: #252c3a;
      --line: rgba(232, 236, 242, 0.12);
      --amber: #f0a202;
      --teal: #2ec4b6;
      --coral: #e85d4c;
      --good: #5dce8a;
      --danger: #ff6b6b;
      --bg: #141820;
      --display: "Chakra Petch", "Noto Sans TC", sans-serif;
      --body: "Noto Sans TC", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #pixi-host {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    #pixi-host canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
    .agl-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 16px;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      background: rgba(8, 10, 14, 0.55);
      backdrop-filter: blur(6px);
    }
    .agl-overlay.is-open { display: flex; }
    .agl-sheet {
      width: min(440px, 100%);
      background: linear-gradient(165deg, var(--panel-2), var(--panel));
      border: 1px solid var(--line);
      border-radius: 18px 18px 14px 14px;
      padding: 18px 16px 14px;
      box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.45);
      animation: sheetUp 0.28s ease;
    }
    @keyframes sheetUp {
      from { transform: translateY(24px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .agl-sheet h2 {
      margin: 0 0 6px;
      font-family: var(--display);
      font-size: 1.15rem;
      letter-spacing: 0.02em;
    }
    .agl-sheet p {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.45;
    }
    .agl-field { margin-bottom: 12px; }
    .agl-field label {
      display: block;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
      font-family: var(--display);
    }
    .agl-field input, .agl-field textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.28);
      color: var(--ink);
      border-radius: 10px;
      padding: 12px 12px;
      font-size: 1rem;
      font-family: var(--body);
      outline: none;
    }
    .agl-field input:focus, .agl-field textarea:focus {
      border-color: rgba(240, 162, 2, 0.65);
    }
    .agl-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .agl-actions button {
      flex: 1;
      min-height: 46px;
      border: 0;
      border-radius: 12px;
      font-family: var(--display);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .agl-btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line) !important;
    }
    .agl-btn-primary {
      background: var(--amber);
      color: #1a1200;
    }
    .agl-status {
      min-height: 1.2em;
      margin: 0 0 8px;
      font-size: 0.85rem;
      color: var(--teal);
    }
    .agl-status.is-err { color: var(--danger); }
    .agl-boot {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      background:
        radial-gradient(ellipse at 20% 0%, rgba(46, 196, 182, 0.18), transparent 45%),
        radial-gradient(ellipse at 90% 80%, rgba(240, 162, 2, 0.14), transparent 40%),
        var(--bg);
      font-family: var(--display);
      letter-spacing: 0.04em;
    }
    .agl-boot[hidden] { display: none !important; }
    .agl-boot strong { font-size: 1.4rem; }
    .agl-boot span { color: var(--muted); font-size: 0.9rem; }

    /* —— Landscape lock gate —— */
    .agl-orient-gate {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px 22px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(240, 162, 2, 0.16), transparent 50%),
        radial-gradient(ellipse at 20% 100%, rgba(46, 196, 182, 0.12), transparent 45%),
        linear-gradient(165deg, #0e1218 0%, #1a2230 48%, #121820 100%);
      color: var(--ink);
      text-align: center;
    }
    .agl-orient-gate::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.35;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(232, 236, 242, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(232, 236, 242, 0.04) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
    }
    .agl-orient-card {
      position: relative;
      width: min(320px, 100%);
      padding: 28px 22px 24px;
      border-radius: 20px;
      border: 1px solid rgba(240, 162, 2, 0.35);
      background: linear-gradient(160deg, rgba(37, 44, 58, 0.95), rgba(20, 24, 32, 0.98));
      box-shadow:
        0 0 0 1px rgba(46, 196, 182, 0.08),
        0 24px 60px rgba(0, 0, 0, 0.55);
    }
    .agl-orient-kicker {
      margin: 0 0 14px;
      font-family: var(--display);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--teal);
    }
    .agl-phone {
      width: 72px;
      height: 112px;
      margin: 0 auto 18px;
      border: 2.5px solid var(--amber);
      border-radius: 14px;
      position: relative;
      box-shadow: inset 0 0 0 1px rgba(240, 162, 2, 0.25);
      animation: phoneTilt 1.8s ease-in-out infinite;
      transform-origin: center center;
    }
    .agl-phone::before {
      content: "";
      position: absolute;
      top: 8px;
      left: 50%;
      width: 22px;
      height: 4px;
      margin-left: -11px;
      border-radius: 999px;
      background: rgba(240, 162, 2, 0.55);
    }
    .agl-phone::after {
      content: "";
      position: absolute;
      inset: 18px 10px 14px;
      border-radius: 6px;
      background:
        linear-gradient(135deg, rgba(46, 196, 182, 0.2), transparent 55%),
        rgba(232, 236, 242, 0.06);
    }
    @keyframes phoneTilt {
      0%, 18% { transform: rotate(0deg); }
      40%, 62% { transform: rotate(90deg); }
      82%, 100% { transform: rotate(0deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .agl-phone { animation: none; transform: rotate(90deg); }
    }
    .agl-orient-card h1 {
      margin: 0 0 8px;
      font-family: var(--display);
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.2;
    }
    .agl-orient-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
    }
    .agl-orient-card .agl-orient-hint {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px dashed rgba(232, 236, 242, 0.12);
      font-family: var(--display);
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      color: var(--amber);
    }

    /* Block game chrome while portrait */
    @media (orientation: portrait) {
      .agl-orient-gate { display: flex; }
      #pixi-host,
      .agl-overlay,
      .agl-boot {
        visibility: hidden !important;
        pointer-events: none !important;
      }
    }
    @media (orientation: landscape) {
      .agl-orient-gate { display: none !important; }
      .agl-overlay {
        align-items: center;
        padding: 12px;
      }
      .agl-sheet {
        width: min(520px, 92vw);
        max-height: min(92vh, 560px);
        overflow: auto;
        border-radius: 16px;
        animation: sheetIn 0.28s ease;
      }
      @keyframes sheetIn {
        from { transform: scale(0.96) translateY(8px); opacity: 0; }
        to { transform: scale(1) translateY(0); opacity: 1; }
      }
    }
  </style>
</head>
<body>
  <div id="orient-gate" class="agl-orient-gate" role="alertdialog" aria-modal="true" aria-labelledby="orientTitle" aria-describedby="orientDesc">
    <div class="agl-orient-card">
      <p class="agl-orient-kicker">Attack Log</p>
      <div class="agl-phone" aria-hidden="true"></div>
      <h1 id="orientTitle">請橫持裝置</h1>
      <p id="orientDesc">攻擊記錄僅支援橫向畫面，請旋轉手機後繼續。</p>
      <p class="agl-orient-hint">ROTATE TO LANDSCAPE</p>
    </div>
  </div>

  <div id="agl-boot" class="agl-boot" aria-live="polite">
    <strong>ATTACK LOG</strong>
    <span>載入戰場介面…</span>
  </div>
  <div id="pixi-host" aria-label="攻擊記錄主畫面"></div>

  <div id="overlay-setup" class="agl-overlay" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
    <div class="agl-sheet">
      <h2 id="setupTitle">匯入雙方牌組</h2>
      <p>請以橫向使用。輸入 DeckLog 代碼後匯入；也可載入示範牌組。</p>
      <div class="agl-field">
        <label for="firstCode">先攻 DeckLog</label>
        <input id="firstCode" type="text" inputmode="text" autocomplete="off" spellcheck="false" placeholder="例：2XXXX">
      </div>
      <div class="agl-field">
        <label for="secondCode">後攻 DeckLog</label>
        <input id="secondCode" type="text" inputmode="text" autocomplete="off" spellcheck="false" placeholder="例：2YYYY">
      </div>
      <p id="setupStatus" class="agl-status"></p>
      <div class="agl-actions">
        <button type="button" class="agl-btn-ghost" id="btnSample">示範牌組</button>
        <button type="button" class="agl-btn-primary" id="btnImport">匯入並開始</button>
      </div>
    </div>
  </div>

  <div id="overlay-number" class="agl-overlay" role="dialog" aria-modal="true">
    <div class="agl-sheet">
      <h2 id="numberTitle">輸入點數</h2>
      <p id="numberHint">請輸入正整數（可為 0）。</p>
      <div class="agl-field">
        <label for="numberInput">點數</label>
        <input id="numberInput" type="number" inputmode="numeric" min="0" step="1" placeholder="0">
      </div>
      <div class="agl-actions">
        <button type="button" class="agl-btn-ghost" id="btnNumberCancel">返回</button>
        <button type="button" class="agl-btn-primary" id="btnNumberOk">確定</button>
      </div>
    </div>
  </div>

  <div id="overlay-text" class="agl-overlay" role="dialog" aria-modal="true">
    <div class="agl-sheet">
      <h2 id="textTitle">打誰（文字）</h2>
      <p>選填：也可直接留空略過。</p>
      <div class="agl-field">
        <label for="textInput">對手角色／備註</label>
        <input id="textInput" type="text" autocomplete="off" placeholder="例：對手中央 Lv3">
      </div>
      <div class="agl-actions">
        <button type="button" class="agl-btn-ghost" id="btnTextSkip">略過</button>
        <button type="button" class="agl-btn-primary" id="btnTextOk">確定</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pixi.js-legacy@7.4.2/dist/pixi-legacy.min.js"></script>
  <script src="assets/js/ws-decklog.js"></script>
  <script src="assets/js/attack-game-log.js"></script>
</body>
</html>
