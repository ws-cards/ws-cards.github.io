<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
  <meta name="theme-color" content="#141414">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Weiss Schwarz 攻擊階段紀錄：DeckLog 匯入、前排布陣、直攻／正面／側面與吃傷結算。">
  <meta property="og:title" content="攻擊記錄｜WS-Cards 卡片雲">
  <meta property="og:description" content="用 DeckLog 匯入雙方牌組，快速記錄攻擊宣告、取消與用牌總結。">
  <title>攻擊記錄｜WS-Cards 卡片雲</title>
  <link rel="icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 與 line_test_v102 同源：顯示明朝／UI 角ゴシック／品牌宇文天穹／數據 mono -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@400;500;600;700&family=UoqMunThenKhung&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Zen+Old+Mincho:wght@500;600;700;900&display=swap">
  <style>
    :root {
      /* v102 dark desk tokens */
      --ink: #e9e7e1;
      --muted: #9a958b;
      --panel: #1c1b18;
      --panel-2: #24231f;
      --line: rgba(240, 238, 230, 0.12);
      --foil: #cbb083;
      --foil-deep: #b8955a;
      --foil-text: #211a10;
      --amber: var(--foil);
      --teal: #91a9c7;
      --coral: #dc8a80;
      --good: #8fc5a4;
      --danger: #dc8a80;
      --bg: #141414;
      --paper: #fffdf8;
      --display: "Zen Old Mincho", "Noto Serif TC", serif;
      --brand: "UoqMunThenKhung", "Noto Serif TC", serif;
      --body: "Zen Kaku Gothic New", "Noto Sans TC", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      color-scheme: dark;
    }
    body button,
    body input,
    body select,
    body textarea {
      font-family: var(--body);
    }
    /* Pin shell to visualViewport so URL/tab bars don't cover controls */
    #pixi-host,
    #agl-card-layer,
    #agl-picker-layer,
    .agl-overlay,
    .agl-boot,
    .agl-orient-gate,
    .agl-summary {
      position: fixed;
      top: var(--vv-top, 0px);
      left: var(--vv-left, 0px);
      width: var(--vv-width, 100%);
      height: var(--vv-height, 100%);
      right: auto;
      bottom: auto;
    }
    #pixi-host {
      z-index: 1;
    }
    #pixi-host canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
    /* Card art via DOM — avoids WebGL cross-origin texImage2D errors */
    #agl-card-layer,
    #agl-picker-layer {
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }
    #agl-picker-layer { z-index: 3; }
    #agl-card-layer .agl-slot-art,
    #agl-picker-layer .agl-picker-thumb {
      position: absolute;
      object-fit: contain;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.22);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }
    #agl-card-layer .agl-slot-art.is-rested {
      transform: rotate(90deg) scale(0.78);
      transform-origin: center center;
      border: 1px solid rgba(203, 176, 131, 0.45);
    }
    #agl-picker-layer .agl-picker-thumb {
      border-radius: 4px;
      border: 1px solid rgba(240, 238, 230, 0.12);
    }
    .agl-overlay {
      z-index: 20;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 16px;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      background: rgba(10, 10, 9, 0.58);
      backdrop-filter: blur(8px);
    }
    .agl-overlay.is-open { display: flex; }
    .agl-sheet {
      width: min(440px, 100%);
      background: var(--panel-2);
      border: 1px solid rgba(226, 189, 119, 0.24);
      border-radius: 14px;
      padding: 1.65rem 1.5rem 1.35rem;
      box-shadow: 0 20px 52px rgba(0, 0, 0, 0.48), 0 5px 18px rgba(0, 0, 0, 0.28);
      animation: sheetUp 0.42s var(--ease);
    }
    @keyframes sheetUp {
      from { transform: translateY(18px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .agl-sheet h2 {
      margin: 0 0 6px;
      font-family: var(--display);
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--ink);
    }
    .agl-sheet p {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.7;
    }
    .agl-field { margin-bottom: 12px; }
    .agl-field label {
      display: block;
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      color: var(--foil);
      margin-bottom: 6px;
      font-family: var(--body);
      font-weight: 500;
    }
    .agl-field input, .agl-field textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.28);
      color: var(--ink);
      border-radius: 10px;
      padding: 12px 12px;
      font-size: 1rem;
      font-family: var(--body);
      outline: none;
      transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
    }
    .agl-field input:focus, .agl-field textarea:focus {
      border-color: var(--foil);
      box-shadow: 0 0 0 1px var(--foil), 0 0 0 4px rgba(226, 189, 119, 0.22);
    }
    .agl-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .agl-actions button {
      flex: 1;
      min-height: 46px;
      border: 0;
      border-radius: 10px;
      font-family: var(--body);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s var(--ease), border-color 0.2s var(--ease);
    }
    .agl-btn-ghost {
      background: rgba(240, 238, 228, 0.09);
      color: var(--ink);
      border: 1px solid var(--line) !important;
    }
    .agl-btn-ghost:hover {
      background: rgba(240, 238, 228, 0.16);
    }
    .agl-btn-primary {
      background: var(--foil);
      color: var(--foil-text);
    }
    .agl-btn-primary:hover {
      background: #e0c493;
    }
    .agl-status {
      min-height: 1.2em;
      margin: 0 0 8px;
      font-size: 0.85rem;
      color: var(--teal);
    }
    .agl-status.is-err { color: var(--danger); }
    .agl-boot {
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(203, 176, 131, 0.14), transparent 48%),
        radial-gradient(ellipse at 85% 90%, rgba(145, 169, 199, 0.08), transparent 42%),
        var(--bg);
      letter-spacing: 0.04em;
    }
    .agl-boot[hidden] { display: none !important; }
    .agl-boot-brand {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 0.2rem;
    }
    .agl-boot-mark {
      display: block;
      width: 1.15rem;
      height: 1px;
      background: var(--foil);
      opacity: 0.72;
    }
    .agl-boot strong {
      font-family: var(--brand);
      font-size: 1.55rem;
      font-weight: 400;
      letter-spacing: 0.18em;
    }
    .agl-boot span {
      color: var(--muted);
      font-size: 0.84rem;
      opacity: 0.85;
    }

    /* —— Landscape lock gate —— */
    .agl-orient-gate {
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px 22px;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(203, 176, 131, 0.16), transparent 50%),
        radial-gradient(ellipse at 20% 100%, rgba(145, 169, 199, 0.1), transparent 45%),
        linear-gradient(165deg, #10100e 0%, #1a1916 48%, #141414 100%);
      color: var(--ink);
      text-align: center;
    }
    .agl-orient-gate::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.28;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(240, 238, 230, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(240, 238, 230, 0.04) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
    }
    .agl-orient-card {
      position: relative;
      width: min(320px, 100%);
      padding: 28px 22px 24px;
      border-radius: 14px;
      border: 1px solid rgba(226, 189, 119, 0.28);
      background: var(--panel-2);
      box-shadow:
        0 0 0 1px rgba(203, 176, 131, 0.06),
        0 20px 52px rgba(0, 0, 0, 0.48);
      animation: sheetUp 0.56s var(--ease);
    }
    .agl-orient-kicker {
      margin: 0 0 14px;
      font-family: var(--body);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--foil);
    }
    .agl-phone {
      width: 72px;
      height: 112px;
      margin: 0 auto 18px;
      border: 2px solid var(--foil);
      border-radius: 14px;
      position: relative;
      box-shadow: inset 0 0 0 1px rgba(203, 176, 131, 0.22);
      animation: phoneTilt 1.8s ease-in-out infinite;
      transform-origin: center center;
    }
    .agl-phone::before {
      content: "";
      position: absolute;
      top: 8px;
      left: 50%;
      width: 22px;
      height: 4px;
      margin-left: -11px;
      border-radius: 999px;
      background: rgba(203, 176, 131, 0.55);
    }
    .agl-phone::after {
      content: "";
      position: absolute;
      inset: 18px 10px 14px;
      border-radius: 6px;
      background:
        linear-gradient(135deg, rgba(203, 176, 131, 0.18), transparent 55%),
        rgba(240, 238, 230, 0.05);
    }
    @keyframes phoneTilt {
      0%, 18% { transform: rotate(0deg); }
      40%, 62% { transform: rotate(90deg); }
      82%, 100% { transform: rotate(0deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .agl-phone { animation: none; transform: rotate(90deg); }
      .agl-orient-card,
      .agl-sheet { animation: none; }
    }
    .agl-orient-card h1 {
      margin: 0 0 8px;
      font-family: var(--display);
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1.2;
    }
    .agl-orient-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.7;
    }
    .agl-orient-card .agl-orient-hint {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px dashed rgba(240, 238, 230, 0.12);
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: var(--foil);
    }

    /* —— Summary dashboard (v102 desk palette) —— */
    .agl-summary {
      z-index: 40;
      display: none;
      flex-direction: column;
      background:
        radial-gradient(ellipse at 15% 0%, rgba(203, 176, 131, 0.12), transparent 45%),
        radial-gradient(ellipse at 90% 100%, rgba(145, 169, 199, 0.08), transparent 42%),
        var(--bg);
      color: var(--ink);
      font-family: var(--body);
      overflow: hidden;
    }
    .agl-summary.is-open { display: flex; }
    .agl-summary-head {
      display: grid;
      grid-template-columns: 1.2fr 1.4fr 1fr;
      gap: 8px;
      padding: 12px 16px 10px;
      background: rgba(28, 27, 24, 0.94);
      border-bottom: 1px solid var(--line);
      align-items: center;
    }
    .agl-summary-vs {
      margin: 0;
      font-family: var(--display);
      font-size: clamp(1.25rem, 3.2vw, 1.85rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.15;
    }
    .agl-summary-vs .p1 { color: var(--teal); }
    .agl-summary-vs .p2 { color: var(--foil); }
    .agl-summary-vs .sep { color: var(--muted); margin: 0 0.25em; font-weight: 600; }
    .agl-summary-times {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.45;
      font-family: var(--mono);
    }
    .agl-summary-meta {
      text-align: right;
      font-size: 0.9rem;
      color: var(--ink);
      line-height: 1.45;
      font-weight: 600;
    }
    .agl-summary-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .agl-summary-tabs button {
      border: 0;
      border-right: 1px solid var(--line);
      background: transparent;
      min-height: 42px;
      font-family: var(--body);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--muted);
    }
    .agl-summary-tabs button:last-child { border-right: 0; }
    .agl-summary-tabs button.is-active {
      color: var(--ink);
      background: var(--panel-2);
      box-shadow: inset 0 -3px 0 var(--foil);
    }
    .agl-summary-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 12px 14px;
    }
    .agl-summary-pane { display: none; }
    .agl-summary-pane.is-active { display: block; height: auto; min-height: 100%; }
    /* Chart needs a definite height for Canvas layout */
    .agl-summary-pane.is-active[data-pane="chart"] { height: 100%; }
    .agl-stat-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      font-size: 0.92rem;
    }
    .agl-stat-table th,
    .agl-stat-table td {
      border: 1px solid var(--line);
      padding: 9px 12px;
      text-align: center;
      vertical-align: middle;
    }
    .agl-stat-table th {
      background: var(--panel-2);
      font-family: var(--display);
      font-weight: 700;
      color: var(--ink);
    }
    .agl-stat-table th.p1 { color: var(--teal); }
    .agl-stat-table th.p2 { color: var(--foil); }
    .agl-stat-table td.label {
      text-align: left;
      background: rgba(0, 0, 0, 0.22);
      font-weight: 600;
      width: 28%;
      color: var(--muted);
    }
    .agl-stat-table tbody tr:nth-child(even) td:not(.label) {
      background: rgba(240, 238, 230, 0.02);
    }
    .agl-stat-table td.p1 { color: var(--teal); font-weight: 600; }
    .agl-stat-table td.p2 { color: var(--foil); font-weight: 600; }
    .agl-stat-table td.small { font-size: 0.78rem; font-weight: 500; color: var(--muted); }
    .agl-card-dmg {
      margin-top: 14px;
      padding: 12px 14px 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .agl-card-dmg-title {
      margin: 0 0 4px;
      font-family: var(--display);
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--ink);
    }
    .agl-card-dmg-lede {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.5;
    }
    .agl-card-dmg-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .agl-card-dmg-col h3 {
      margin: 0 0 8px;
      font-family: var(--display);
      font-size: 0.95rem;
      font-weight: 700;
    }
    .agl-card-dmg-col.p1 h3 { color: var(--teal); }
    .agl-card-dmg-col.p2 h3 { color: var(--foil); }
    .agl-card-dmg-col ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .agl-card-dmg-col li {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 0;
      border-bottom: 1px solid var(--line);
      font-size: 0.85rem;
      color: var(--ink);
    }
    .agl-card-dmg-col li strong {
      color: var(--foil);
      font-family: var(--mono);
      font-weight: 600;
      white-space: nowrap;
    }
    .agl-card-dmg-col.p1 li strong { color: var(--teal); }
    .agl-card-dmg-empty {
      color: var(--muted);
      font-size: 0.85rem;
      padding: 4px 0 8px;
    }
    .agl-chart-wrap {
      height: calc(100% - 8px);
      min-height: 220px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px 10px;
      display: flex;
      flex-direction: column;
    }
    .agl-chart-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .agl-chart-toolbar h3 {
      margin: 0;
      font-family: var(--display);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: 0.04em;
    }
    .agl-chart-toolbar label {
      font-size: 0.85rem;
      font-weight: 600;
      margin-right: 10px;
      color: var(--teal);
    }
    .agl-chart-toolbar label.p2 { color: var(--foil); }
    .agl-chart-toolbar select {
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--ink);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.85rem;
      font-family: var(--body);
    }
    .agl-chart-toolbar select:focus {
      border-color: var(--foil);
      outline: none;
    }
    .agl-chart-canvas-box { flex: 1; min-height: 0; position: relative; }
    .agl-battle-detail {
      height: auto;
      min-height: 120px;
      overflow: visible;
      padding: 4px 2px 8px;
    }
    .agl-battle-detail-empty {
      color: var(--muted);
      font-size: 0.9rem;
      padding: 18px 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .agl-battle-block {
      margin-bottom: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px 8px;
    }
    .agl-battle-block-head {
      margin: 0 0 8px;
      font-family: var(--display);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .agl-battle-block.is-first .agl-battle-block-head { color: var(--teal); }
    .agl-battle-block.is-second .agl-battle-block-head { color: var(--foil); }
    .agl-battle-block ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .agl-battle-block li {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      padding: 8px 0;
      border-top: 1px solid var(--line);
      font-size: 0.9rem;
      color: var(--ink);
    }
    .agl-battle-block li:first-child { border-top: 0; }
    .agl-battle-block .atk-name {
      min-width: 0;
      flex: 1;
    }
    .agl-battle-block .atk-meta {
      flex: 0 0 auto;
      font-family: var(--mono);
      font-weight: 600;
      font-size: 0.84rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .agl-battle-block .atk-meta .res-damage { color: var(--coral); }
    .agl-battle-block .atk-meta .res-cancel { color: var(--good); }
    .agl-battle-block .atk-meta .res-other { color: var(--foil); }
    .agl-battle-block.is-first .atk-meta .res-damage { color: var(--teal); }
    .agl-battle-block li.is-life-adjust .atk-name { color: var(--muted); font-weight: 600; }
    .agl-battle-block li.is-life-adjust .atk-meta { color: var(--foil); }
    .agl-summary-footmeta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      padding: 8px 14px;
      background: var(--panel-2);
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
      font-family: var(--mono);
    }
    .agl-summary-actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px 12px;
      background: rgba(20, 19, 17, 0.96);
      border-top: 1px solid var(--line);
    }
    .agl-summary-actions .left,
    .agl-summary-actions .right { display: flex; gap: 8px; }
    .agl-summary-actions button {
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(240, 238, 228, 0.09);
      color: var(--ink);
      font-family: var(--body);
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
    }
    .agl-summary-actions .primary {
      background: var(--foil);
      border-color: transparent;
      color: var(--foil-text);
      min-width: 140px;
    }

    /* Block game chrome while portrait */
    @media (orientation: portrait) {
      .agl-orient-gate { display: flex; }
      #pixi-host,
      #agl-card-layer,
      .agl-overlay,
      .agl-summary,
      .agl-boot {
        visibility: hidden !important;
        pointer-events: none !important;
      }
    }
    @media (orientation: landscape) {
      .agl-orient-gate { display: none !important; }
      .agl-overlay {
        align-items: center;
        padding: 8px;
      }
      .agl-sheet {
        width: min(520px, 94%);
        max-height: calc(var(--vv-height, 100dvh) - 20px);
        overflow: auto;
        border-radius: 14px;
        padding: 12px 14px 10px;
        animation: sheetIn 0.42s var(--ease);
      }
      .agl-sheet h2 { font-size: 1.02rem; margin-bottom: 4px; }
      .agl-sheet p { margin-bottom: 8px; font-size: 0.8rem; }
      .agl-field { margin-bottom: 8px; }
      .agl-field label { margin-bottom: 4px; font-size: 0.7rem; }
      .agl-field input, .agl-field textarea { padding: 9px 10px; font-size: 0.95rem; }
      .agl-actions { margin-top: 4px; }
      .agl-actions button { min-height: 40px; font-size: 0.9rem; }
      @keyframes sheetIn {
        from { transform: scale(0.96) translateY(8px); opacity: 0; }
        to { transform: scale(1) translateY(0); opacity: 1; }
      }
    }
  </style>
</head>
<body>
  <div id="orient-gate" class="agl-orient-gate" role="alertdialog" aria-modal="true" aria-labelledby="orientTitle" aria-describedby="orientDesc">
    <div class="agl-orient-card">
      <p class="agl-orient-kicker">攻擊記錄</p>
      <div class="agl-phone" aria-hidden="true"></div>
      <h1 id="orientTitle">請橫持裝置</h1>
      <p id="orientDesc">攻擊記錄僅支援橫向畫面。請將裝置轉為橫向後繼續。</p>
      <p class="agl-orient-hint">ROTATE TO LANDSCAPE</p>
    </div>
  </div>

  <div id="agl-boot" class="agl-boot" aria-live="polite">
    <div class="agl-boot-brand" aria-hidden="true">
      <span class="agl-boot-mark"></span>
      <strong>卡片雲</strong>
      <span class="agl-boot-mark"></span>
    </div>
    <span>載入攻擊記錄…</span>
  </div>
  <div id="pixi-host" aria-label="攻擊記錄主畫面"></div>
  <div id="agl-card-layer" aria-hidden="true"></div>
  <div id="agl-picker-layer" aria-hidden="true"></div>

  <div id="overlay-setup" class="agl-overlay" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
    <div class="agl-sheet">
      <h2 id="setupTitle">匯入雙方牌組</h2>
      <p>請以橫向使用。輸入 DeckLog 代碼後匯入；也可載入示範牌組。</p>
      <div class="agl-field">
        <label for="firstCode">先攻 DeckLog</label>
        <input id="firstCode" type="text" inputmode="text" autocomplete="off" spellcheck="false" placeholder="例：2XXXX">
      </div>
      <div class="agl-field">
        <label for="secondCode">後攻 DeckLog</label>
        <input id="secondCode" type="text" inputmode="text" autocomplete="off" spellcheck="false" placeholder="例：2YYYY">
      </div>
      <p id="setupStatus" class="agl-status"></p>
      <div class="agl-actions">
        <button type="button" class="agl-btn-ghost" id="btnSample">示範牌組</button>
        <button type="button" class="agl-btn-primary" id="btnImport">匯入並開始</button>
      </div>
    </div>
  </div>

  <div id="overlay-number" class="agl-overlay" role="dialog" aria-modal="true">
    <div class="agl-sheet">
      <h2 id="numberTitle">輸入點數</h2>
      <p id="numberHint">請輸入正整數（可為 0）。</p>
      <div class="agl-field">
        <label for="numberInput">點數</label>
        <input id="numberInput" type="number" inputmode="numeric" min="0" step="1" placeholder="0">
      </div>
      <div class="agl-actions">
        <button type="button" class="agl-btn-ghost" id="btnNumberCancel">返回</button>
        <button type="button" class="agl-btn-primary" id="btnNumberOk">確定</button>
      </div>
    </div>
  </div>

  <div id="overlay-text" class="agl-overlay" role="dialog" aria-modal="true">
    <div class="agl-sheet">
      <h2 id="textTitle">打誰（文字）</h2>
      <p>選填：也可直接留空略過。</p>
      <div class="agl-field">
        <label for="textInput">對手角色／備註</label>
        <input id="textInput" type="text" autocomplete="off" placeholder="例：對手中央 Lv3">
      </div>
      <div class="agl-actions">
        <button type="button" class="agl-btn-ghost" id="btnTextSkip">略過</button>
        <button type="button" class="agl-btn-primary" id="btnTextOk">確定</button>
      </div>
    </div>
  </div>

  <div id="overlay-summary" class="agl-summary" role="dialog" aria-modal="true" aria-label="雙方總結算">
    <header class="agl-summary-head">
      <h1 class="agl-summary-vs" id="sumVs"><span class="p1">先攻</span><span class="sep">vs.</span><span class="p2">後攻</span></h1>
      <div class="agl-summary-times" id="sumTimes">
        <div>Started: —</div>
        <div>Ended: —</div>
      </div>
      <div class="agl-summary-meta" id="sumMeta">
        <div>模式：攻擊記錄</div>
        <div>勝者：—</div>
      </div>
    </header>
    <nav class="agl-summary-tabs" aria-label="結算分頁">
      <button type="button" class="is-active" data-sum-tab="stats">快速統計</button>
      <button type="button" data-sum-tab="chart">回合圖表</button>
      <button type="button" data-sum-tab="detail">對戰詳細資訊</button>
    </nav>
    <div class="agl-summary-body">
      <section class="agl-summary-pane is-active" id="sumPaneStats" data-pane="stats">
        <table class="agl-stat-table" id="sumStatTable">
          <thead>
            <tr>
              <th></th>
              <th class="p1" id="sumHeadP1">玩家 1</th>
              <th class="p2" id="sumHeadP2">玩家 2</th>
            </tr>
          </thead>
          <tbody id="sumStatBody"></tbody>
        </table>
        <div class="agl-card-dmg" aria-label="各卡攻擊傷害">
          <h2 class="agl-card-dmg-title">各卡攻擊傷害</h2>
          <p class="agl-card-dmg-lede">同卡號累積實際造成傷害與攻擊次數</p>
          <div class="agl-card-dmg-grid">
            <div class="agl-card-dmg-col p1" id="sumCardDmg1"></div>
            <div class="agl-card-dmg-col p2" id="sumCardDmg2"></div>
          </div>
        </div>
      </section>
      <section class="agl-summary-pane" id="sumPaneChart" data-pane="chart">
        <div class="agl-chart-wrap">
          <div class="agl-chart-toolbar">
            <div>
              <label><input type="checkbox" id="sumChartP1" checked> 玩家 1</label>
              <label class="p2"><input type="checkbox" id="sumChartP2" checked> 玩家 2</label>
            </div>
            <h3 id="sumChartTitle">受到傷害</h3>
            <select id="sumChartMetric" aria-label="圖表指標">
              <option value="damageReceived">受到傷害</option>
              <option value="cancelDamage">取消傷害</option>
              <option value="attacks">Attacks</option>
            </select>
          </div>
          <div class="agl-chart-canvas-box">
            <canvas id="sumChartCanvas"></canvas>
          </div>
        </div>
      </section>
      <section class="agl-summary-pane" id="sumPaneDetail" data-pane="detail">
        <div class="agl-battle-detail" id="sumBattleDetail" aria-label="對戰詳細資訊"></div>
      </section>
    </div>
    <div class="agl-summary-footmeta" id="sumFootMeta"></div>
    <div class="agl-summary-actions">
      <div class="left">
        <button type="button" id="btnSumLoad">讀取</button>
        <button type="button" id="btnSumExport">輸出圖片</button>
        <input type="file" id="sumLoadFile" accept="application/json,.json" hidden>
      </div>
      <div class="right">
        <button type="button" class="primary" id="btnSumHome">回到主界面</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js-legacy@7.4.2/dist/pixi-legacy.min.js"></script>
  <script src="assets/js/ws-decklog.js?v=20261017a"></script>
  <script src="assets/js/attack-game-log.js?v=20261017a"></script>
</body>
</html>
