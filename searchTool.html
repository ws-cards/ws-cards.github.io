<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <title>卡片雲 | 卡牌集合搜尋</title>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="搜尋 Weiss Schwarz 卡牌集合名稱或編號。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
/* === DESIGN TOKENS (aligned with landingPage_4) === */
:root {
    --bg: #fafafa;
    --bg-alt: #f4f4f5;
    --bg-card: #ffffff;
    --bg-dark: #0a0a0a;
    --text: #0a0a0a;
    --text-muted: #52525b;
    --text-light: #71717a;
    --text-on-dark: #ffffff;
    --border: rgba(0,0,0,0.08);
    --border-strong: rgba(0,0,0,0.14);
    --radius-sm: 8px;
    --radius-lg: 16px;
    --radius-xl: 20px;
    --shadow-soft: 0 24px 80px rgba(0,0,0,0.12);
    --shadow-card: 0 2px 12px rgba(0,0,0,0.06);
    --container-max: 1200px;
    --font-cjk: 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC';
    --font-display: 'Instrument Serif', var(--font-cjk), serif;
    --font-body: 'Inter', var(--font-cjk), sans-serif;
    --font-mono: 'JetBrains Mono', 'Consolas', var(--font-cjk), monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
::selection { background: rgba(10,10,10,0.12); color: var(--text); }
html, body { width: 100%; min-height: 100%; }
body {
    background: var(--bg);
    font-family: var(--font-body);
    color: var(--text);
    overflow-x: hidden;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
}

:focus-visible {
    outline: 2px solid var(--text);
    outline-offset: 3px;
}

/* stroke icons — match landingPage_4 */
.ico {
    width: 1.125rem;
    height: 1.125rem;
    flex-shrink: 0;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    display: block;
}

/* soft paper atmosphere */
.page-atmosphere {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(0,0,0,0.04), transparent 55%),
        radial-gradient(circle, rgba(0,0,0,0.035) 1px, transparent 1px);
    background-size: auto, 28px 28px;
    mask-image: radial-gradient(ellipse 70% 55% at 50% 20%, #000 25%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 70% 55% at 50% 20%, #000 25%, transparent 75%);
}

.page-container {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* === HEADER === */
.site-header {
    width: 100%;
    max-width: var(--container-max);
    padding: 72px 24px 8px;
    text-align: center;
}

.glitch-title {
    font-family: var(--font-display);
    font-size: clamp(2.6rem, 7vw, 4.5rem);
    font-weight: 400;
    letter-spacing: -0.02em;
    color: var(--text);
    line-height: 1.05;
}

.subtitle {
    font-family: var(--font-mono);
    font-size: clamp(0.68rem, 1.6vw, 0.78rem);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-light);
    margin-top: 14px;
    min-height: 1.3em;
}

.subtitle::after {
    content: '|';
    margin-left: 2px;
    animation: blink 1s step-end infinite;
    color: var(--text-muted);
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* === SEARCH SECTION === */
.search-section {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px 32px;
    width: 100%;
}

.search-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* animation shell only — no visible double border */
.search-wrapper .tcg-frame {
    position: absolute;
    left: 0;
    top: 0;
    width: 64px;
    height: 64px;
    border-radius: var(--radius-sm);
    pointer-events: none;
    z-index: 0;
    transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    border: none;
    background: transparent;
    box-shadow: none;
    opacity: 0;
}
.search-wrapper .tcg-frame::before,
.search-wrapper .tcg-frame::after { display: none; }

.search-wrapper.active .tcg-frame {
    left: -12px;
    top: -20px;
    width: calc(100% + 24px);
    height: calc(100% + 40px);
    border-radius: 999px;
    background: transparent;
    box-shadow: none;
    opacity: 0;
}

.search-wrapper .input-holder {
    height: 64px;
    width: 64px;
    overflow: hidden;
    background: transparent;
    border-radius: var(--radius-sm);
    position: relative;
    z-index: 2;
    transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
}

.search-wrapper.active .input-holder {
    width: min(480px, calc(100vw - 88px));
    border-radius: 999px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-card);
}

.search-wrapper .input-holder .search-input {
    width: 100%;
    height: 48px;
    padding: 0 64px 0 22px;
    opacity: 0;
    position: absolute;
    top: 0;
    left: 0;
    background: transparent;
    border: none;
    outline: none;
    font-family: var(--font-body);
    font-size: 0.95rem;
    font-weight: 400;
    letter-spacing: 0.01em;
    color: var(--text);
    caret-color: var(--text);
    transform: translate(0, 56px);
    transition: all 0.38s cubic-bezier(0.22, 1, 0.36, 1);
    transition-delay: 0.3s;
}

.search-wrapper .input-holder .search-input::placeholder {
    color: var(--text-light);
    font-size: 0.88rem;
}

.search-wrapper.active .input-holder .search-input {
    opacity: 1;
    transform: translate(0, 8px);
}

.search-wrapper .input-holder .search-icon {
    width: 64px;
    height: 64px;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--bg-dark);
    color: var(--text-on-dark);
    padding: 0;
    outline: none;
    position: relative;
    z-index: 2;
    float: right;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.3s ease, border-radius 0.4s ease, color 0.3s ease, box-shadow 0.3s ease;
    box-shadow: var(--shadow-card);
    overflow: hidden;
}

.search-wrapper .input-holder .search-icon:hover {
    background: #1a1a1a;
}

.search-wrapper.active .input-holder .search-icon {
    width: 48px;
    height: 48px;
    margin: 8px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    box-shadow: none;
}

.search-wrapper.active .input-holder .search-icon:hover {
    background: var(--bg-alt);
    color: var(--text);
}

.search-wrapper .close {
    position: absolute;
    z-index: 1;
    top: 14px;
    right: 14px;
    width: 36px;
    height: 36px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--text-muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transform: scale(0.85);
    transition: opacity 0.35s ease, transform 0.35s ease, right 0.35s ease, color 0.25s ease, background 0.25s ease;
    transition-delay: 0.2s;
    opacity: 0;
    pointer-events: none;
}

.search-wrapper.active .close {
    right: -52px;
    transform: scale(1);
    transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1), transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), right 0.55s cubic-bezier(0.22, 1, 0.36, 1), color 0.25s ease, background 0.25s ease;
    transition-delay: 0.42s;
    opacity: 1;
    pointer-events: auto;
}

.search-wrapper .close:hover {
    color: var(--text);
    background: var(--bg-alt);
}

.search-wrapper .close .ico {
    width: 1rem;
    height: 1rem;
}

.ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.22);
    transform: scale(0);
    animation: rippleAnim 0.7s linear forwards;
    pointer-events: none;
}
@keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

/* === RESULTS === */
.results-section {
    width: 100%;
    max-width: var(--container-max);
    padding: 0 24px 96px;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.5s ease, transform 0.5s ease;
}
.results-section.visible {
    opacity: 1;
    transform: translateY(0);
}

.results-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
}

.results-count {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-light);
}

.results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 12px;
}

.result-card {
    position: relative;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    cursor: pointer;
    overflow: hidden;
    opacity: 0;
    transform: translateY(10px);
    animation: cardFadeIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
}

.result-card:hover {
    border-color: var(--border-strong);
    box-shadow: var(--shadow-card);
    transform: translateY(-2px);
}

.result-card::before,
.result-card::after { display: none; }

@keyframes cardFadeIn {
    to { transform: translateY(0); opacity: 1; }
}

.card-code {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    color: var(--text-light);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.card-code::before {
    content: '';
    display: inline-block;
    width: 1px;
    height: 0.85em;
    background: var(--border-strong);
    flex-shrink: 0;
}

.card-name {
    font-family: var(--font-body);
    font-size: 0.95rem;
    font-weight: 500;
    line-height: 1.45;
    color: var(--text);
    margin-bottom: 14px;
}

.card-meta { display: flex; gap: 8px; flex-wrap: wrap; }

.card-tag {
    font-family: var(--font-mono);
    font-size: 0.62rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 6px;
    border: none;
    background: var(--bg-alt);
    color: var(--text-light);
}

.card-tag.tc {
    color: var(--text-muted);
    background: var(--bg-alt);
}

.card-tag.ts {
    color: var(--text-light);
    background: transparent;
    padding-left: 0;
    padding-right: 0;
}

/* === SKELETON === */
.skeleton-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    overflow: hidden;
    position: relative;
}

.skeleton-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.03) 50%, transparent 100%);
    animation: shimmer 1.5s infinite;
}

@keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
}

.skel-ln {
    height: 11px;
    border-radius: 6px;
    background: var(--bg-alt);
    margin-bottom: 10px;
}
.skel-ln.s { width: 38%; }
.skel-ln.m { width: 68%; }
.skel-ln.l { width: 88%; }

.no-results {
    grid-column: 1 / -1;
    text-align: center;
    padding: 72px 24px;
    font-family: var(--font-body);
    font-size: 0.95rem;
    color: var(--text-light);
}

.no-results-icon {
    font-family: var(--font-display);
    font-size: 2.4rem;
    display: block;
    margin-bottom: 14px;
    opacity: 0.35;
    color: var(--text);
}

@media (max-width: 560px) {
    .site-header { padding-top: 48px; }
    .search-section { padding: 28px 16px 20px; }
    .search-wrapper.active .input-holder { width: calc(100vw - 80px); }
    .search-wrapper.active .close { right: -44px; }
    .results-grid { grid-template-columns: 1fr; }
}

@media (max-width: 400px) {
    .search-wrapper .input-holder { height: 56px; width: 56px; }
    .search-wrapper .tcg-frame { width: 56px; height: 56px; }
    .search-wrapper .input-holder .search-icon { width: 56px; height: 56px; }
    .search-wrapper.active .input-holder { height: 56px; width: calc(100vw - 70px); }
    .search-wrapper.active .input-holder .search-icon { width: 40px; height: 40px; margin: 8px; }
    .search-wrapper .input-holder .search-input { font-size: 0.88rem; padding: 0 52px 0 16px; }
    .search-wrapper.active .close { right: -40px; width: 32px; height: 32px; }
}
</style>
</head>
<body>

<div class="page-atmosphere" aria-hidden="true"></div>

<div class="page-container">
    <header class="site-header">
        <div class="glitch-title" data-text="WS-CARDS">WS-CARDS</div>
        <div class="subtitle" id="typewriter"></div>
    </header>

    <main class="search-section">
        <div class="search-wrapper" id="searchWrapper">
            <div class="tcg-frame"></div>
            <div class="input-holder">
                <input type="text" class="search-input" id="searchInput" placeholder="搜尋卡牌集合名稱或編號…" autocomplete="off" spellcheck="false" />
                <button class="search-icon" id="searchBtn" onclick="searchToggle(this, event)" aria-label="開啟搜尋">
                    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"></circle>
                        <path d="M20 20l-3.5-3.5"></path>
                    </svg>
                </button>
            </div>
            <button type="button" class="close" id="closeBtn" onclick="searchToggle(this, event)" aria-label="關閉搜尋">
                <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 6l12 12"></path>
                    <path d="M18 6L6 18"></path>
                </svg>
            </button>
        </div>
    </main>

    <section class="results-section" id="resultsSection">
        <div class="results-header">
            <span class="results-count" id="resultsCount"></span>
        </div>
        <div class="results-grid" id="resultsGrid"></div>
    </section>
</div>

<script src="https://code.jquery.com/jquery-3.6.1.slim.js" integrity="sha256-tXm+sa1uzsbFnbXt8GJqsgi2Tw+m4BLGDof6eUPjbtk=" crossorigin="anonymous"></script>
<script>
/* ===================== TYPEWRITER ===================== */
const twEl   = document.getElementById('typewriter');
const twText = 'Card Collection Search';
let twI = 0;
function typeWrite() {
    twEl.textContent = twText.slice(0, twI++);
    if (twI <= twText.length) setTimeout(typeWrite, twI < 4 ? 70 : 42);
}
setTimeout(typeWrite, 400);

/* ===================== RIPPLE ===================== */
function addRipple(btn, e) {
    const rc   = btn.getBoundingClientRect();
    const size = Math.max(rc.width, rc.height);
    const sp   = document.createElement('span');
    sp.className = 'ripple';
    sp.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-rc.left-size/2}px;top:${e.clientY-rc.top-size/2}px;`;
    btn.appendChild(sp);
    setTimeout(() => sp.remove(), 600);
}

/* ===================== DATA ===================== */
let titleData = null;
async function loadTitles() {
    if (titleData) return titleData;
    try { titleData = await (await fetch('cardTitle.json')).json(); }
    catch { titleData = {}; }
    return titleData;
}

/* ===================== SEARCH TOGGLE ===================== */
function searchToggle(obj, evt) {
    const wrap = $('#searchWrapper');
    if (!wrap.hasClass('active')) {
        addRipple(obj, evt);
        wrap.addClass('active');
        evt.preventDefault();
        setTimeout(() => document.getElementById('searchInput').focus(), 480);
    } else if (!$(obj).closest('.input-holder').length) {
        wrap.removeClass('active');
        document.getElementById('searchInput').value = '';
        clearResults();
    }
}

/* ===================== SEARCH LOGIC ===================== */
const sinput  = document.getElementById('searchInput');
const secSect = document.getElementById('resultsSection');
const secGrid = document.getElementById('resultsGrid');
const secCnt  = document.getElementById('resultsCount');
let debounce;

sinput.addEventListener('input', function() {
    clearTimeout(debounce);
    const q = this.value.trim();
    if (!q) { clearResults(); return; }
    showSkeleton();
    debounce = setTimeout(() => doSearch(q), 320);
});

sinput.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.getElementById('closeBtn').click();
});

function clearResults() {
    secSect.classList.remove('visible');
    secGrid.innerHTML = '';
    secCnt.textContent = '';
}

function showSkeleton() {
    secSect.classList.add('visible');
    secGrid.innerHTML = Array(6).fill(0).map(() =>
        `<div class="skeleton-card">
            <div class="skel-ln s"></div>
            <div class="skel-ln l"></div>
            <div class="skel-ln m"></div>
        </div>`
    ).join('');
    secCnt.textContent = '搜尋中…';
}

async function doSearch(query) {
    const data = await loadTitles();
    const q = query.toLowerCase();
    const hits = Object.entries(data).filter(([code, name]) =>
        code.toLowerCase().includes(q) || name.toLowerCase().includes(q)
    ).map(([code, name]) => ({code, name}));
    renderResults(hits, query);
}

function renderResults(hits, query) {
    secGrid.innerHTML = '';
    if (!hits.length) {
        secSect.classList.add('visible');
        secCnt.textContent = '無結果';
        secGrid.innerHTML = `<div class="no-results"><span class="no-results-icon">—</span>找不到「${esc(query)}」相關卡牌集合</div>`;
        return;
    }
    const shown = hits.slice(0, 60);
    secCnt.textContent = `找到 ${hits.length.toLocaleString()} 個集合`;
    secSect.classList.add('visible');

    shown.forEach((item, i) => {
        const card = document.createElement('div');
        card.className = 'result-card';
        card.style.animationDelay = `${i * 40}ms`;
        const series = item.code.split('/')[0] || '';
        card.innerHTML = `
            <div class="card-code">${esc(item.code)}</div>
            <div class="card-name">${esc(item.name)}</div>
            <div class="card-meta">
                <span class="card-tag tc">Collection</span>
                ${series ? `<span class="card-tag ts">${esc(series)}</span>` : ''}
            </div>`;
        secGrid.appendChild(card);
    });
}

function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

setTimeout(loadTitles, 1200);
</script>
</body>
</html>
