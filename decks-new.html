<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DECK SELECT｜我的牌組｜WS-Cards 卡片雲</title>
  <meta name="description" content="選擇並使用你的 Weiss Schwarz 牌組。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#d4c8ef">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="plugins/fontawesome-free/css/all.min.css">
  <style>
    :root {
      --ink: #1a1430;
      --ink-soft: rgba(26, 20, 48, 0.72);
      --glass: rgba(28, 22, 52, 0.55);
      --glass-border: rgba(255, 255, 255, 0.22);
      --violet: #7b5cff;
      --gold: #f0c14b;
      --chip: rgba(255, 255, 255, 0.42);
      --chip-ink: #3a2f68;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --font-ui: 'Zen Kaku Gothic New', 'Noto Sans TC', sans-serif;
      --font-display: 'Outfit', 'Zen Kaku Gothic New', sans-serif;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --phone-w: min(430px, 100vw);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: #1a1230;
      color: var(--ink);
      font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .stage {
      position: relative;
      width: var(--phone-w);
      height: min(932px, 100dvh);
      max-height: 100dvh;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(ellipse 80% 50% at 15% 18%, rgba(255, 255, 255, 0.55), transparent 55%),
        radial-gradient(ellipse 60% 40% at 85% 12%, rgba(180, 150, 255, 0.45), transparent 50%),
        radial-gradient(ellipse 70% 55% at 70% 75%, rgba(140, 170, 255, 0.35), transparent 55%),
        radial-gradient(ellipse 50% 40% at 20% 80%, rgba(200, 170, 255, 0.3), transparent 50%),
        linear-gradient(165deg, #e8dff8 0%, #d5c8f0 38%, #c8d4f5 72%, #d2c4ee 100%);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.18),
        0 28px 80px rgba(20, 10, 50, 0.45);
    }

    @media (min-width: 480px) and (max-width: 899.98px) {
      .stage { border-radius: 28px; }
      body {
        background:
          radial-gradient(ellipse at 30% 20%, #3a2a68, transparent 50%),
          radial-gradient(ellipse at 80% 80%, #1e2a58, transparent 45%),
          #120c24;
        padding: 12px;
      }
    }

    .stage-atmosphere {
      position: absolute;
      inset: -8%;
      pointer-events: none;
      z-index: 0;
      background-position: center 28%;
      background-size: cover;
      background-repeat: no-repeat;
      opacity: 0;
      filter: blur(34px) saturate(1.2) brightness(1.05);
      transform: scale(1.12);
      transition: opacity 0.55s ease;
      -webkit-mask-image: radial-gradient(ellipse 72% 58% at 50% 40%, #000 18%, transparent 78%);
      mask-image: radial-gradient(ellipse 72% 58% at 50% 40%, #000 18%, transparent 78%);
    }
    .stage-atmosphere.is-on { opacity: 0.26; }

    .stage-fx {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .stage-fx::before {
      content: '';
      position: absolute;
      inset: -20%;
      background-image:
        linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, 0.07) 50%, transparent 60%),
        repeating-linear-gradient(-28deg, transparent 0 28px, rgba(123, 92, 255, 0.035) 28px 29px);
      animation: drift 18s linear infinite;
    }
    .stage-fx::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle 7px at 18% 32%, rgba(255, 255, 255, 0.55), transparent 70%),
        radial-gradient(circle 5px at 72% 28%, rgba(255, 255, 255, 0.4), transparent 70%),
        radial-gradient(circle 9px at 88% 58%, rgba(180, 160, 255, 0.45), transparent 70%),
        radial-gradient(circle 4px at 32% 68%, rgba(255, 255, 255, 0.35), transparent 70%),
        radial-gradient(circle 6px at 58% 82%, rgba(200, 180, 255, 0.4), transparent 70%);
      animation: floatBokeh 9s ease-in-out infinite alternate;
    }
    @keyframes drift {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(-4%, 3%, 0); }
    }
    @keyframes floatBokeh {
      from { transform: translateY(0) scale(1); opacity: 0.85; }
      to { transform: translateY(-12px) scale(1.04); opacity: 1; }
    }

    .app {
      position: relative;
      z-index: 1;
      display: grid;
      /* 輪播放大；資訊／按鈕／底欄緊湊，避免輪播區留白過多 */
      grid-template-rows: auto minmax(0, 1.4fr) auto auto auto;
      height: 100%;
      padding:
        max(0.5rem, env(safe-area-inset-top, 0px))
        0.85rem
        calc(0.25rem + var(--safe-b))
        0.85rem;
      gap: 0.4rem;
    }

    /* —— Header —— */
    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "brand menu"
        "filters filters";
      align-items: center;
      gap: 0.45rem 0.55rem;
      animation: riseIn 0.7s var(--ease) both;
    }
    .brand-cluster { grid-area: brand; }
    .menu-btn { grid-area: menu; }
    .filters { grid-area: filters; }
    .brand-cluster {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      min-width: 0;
      /* grid-area set above */
    }
    .ws-logo {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      color: inherit;
      flex-shrink: 0;
    }
    .ws-logo-mark {
      width: 2.35rem;
      height: 2.35rem;
      filter: drop-shadow(0 2px 8px rgba(40, 20, 80, 0.28));
    }
    .brand-copy { min-width: 0; }
    .page-title {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(0.95rem, 4.2vw, 1.12rem);
      letter-spacing: 0.16em;
      color: #2a2150;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.45);
      white-space: nowrap;
    }
    .page-lede {
      display: none;
      margin: 0.15rem 0 0;
      font-size: 0.78rem;
      color: rgba(42, 33, 80, 0.55);
      letter-spacing: 0.04em;
    }
    .menu-btn {
      width: 2.35rem;
      height: 2.35rem;
      border: 0;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.42);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #2a2150;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.4) inset;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .menu-btn:hover { background: rgba(255, 255, 255, 0.55); }
    .menu-btn:active { transform: scale(0.96); }
    .menu-btn i {
      display: block;
      width: 1rem;
      height: 1.5px;
      background: currentColor;
      border-radius: 2px;
      box-shadow: 0 -5px 0 currentColor, 0 5px 0 currentColor;
    }

    /* —— Search + filters（手機：同一排） —— */
    .filters {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      min-width: 0;
      animation: riseIn 0.75s var(--ease) 0.06s both;
    }
    .search {
      position: relative;
      display: flex;
      align-items: center;
      flex: 1 1 auto;
      min-width: 0;
    }
    .search i {
      position: absolute;
      left: 0.75rem;
      color: rgba(58, 47, 104, 0.55);
      font-size: 0.78rem;
      pointer-events: none;
    }
    .search input {
      width: 100%;
      height: 2.15rem;
      padding: 0 0.75rem 0 2.15rem;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.48);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--ink);
      font: inherit;
      font-size: 0.8rem;
      outline: none;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.55) inset,
        0 8px 20px rgba(80, 50, 140, 0.08);
      transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }
    .search input::placeholder { color: rgba(58, 47, 104, 0.45); }
    .search input:focus {
      border-color: rgba(123, 92, 255, 0.55);
      background: rgba(255, 255, 255, 0.7);
      box-shadow:
        0 0 0 3px rgba(123, 92, 255, 0.18),
        0 8px 20px rgba(80, 50, 140, 0.1);
    }
    .chip-row {
      display: flex;
      flex: 0 1 auto;
      gap: 0.32rem;
      max-width: 58%;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 0;
      min-width: 0;
    }
    .chip-row::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 0.28rem;
      height: 2.15rem;
      padding: 0 0.62rem;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 999px;
      background: var(--chip);
      color: var(--chip-ink);
      font: inherit;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
    }
    .chip .chip-label-full { display: none; }
    .chip .chip-label-short { display: inline; }
    .chip i { font-size: 0.72rem; opacity: 0.85; }
    .chip .chev { font-size: 0.58rem; opacity: 0.65; margin-left: 0.05rem; }
    .chip:hover { background: rgba(255, 255, 255, 0.62); }
    .chip:active { transform: scale(0.97); }
    .chip.is-active {
      background: linear-gradient(135deg, #8b6cff 0%, #5f7dff 100%);
      border-color: transparent;
      color: #fff;
      box-shadow:
        0 6px 16px rgba(95, 90, 220, 0.35),
        0 1px 0 rgba(255, 255, 255, 0.28) inset;
    }
    .chip.is-active i,
    .chip.is-active .chev { opacity: 1; }
    .chip.is-desk-only { display: none; }

    /* —— Carousel —— */
    .carousel-wrap {
      position: relative;
      z-index: 0;
      isolation: isolate;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      align-content: stretch;
      gap: 0.5rem;
      min-height: 0;
      animation: riseIn 0.8s var(--ease) 0.12s both;
    }
    .carousel {
      position: relative;
      height: 100%;
      min-height: 0;
      /* 較緊的透視讓圓柱弧面更明顯 */
      perspective: 820px;
      perspective-origin: 50% 45%;
      touch-action: pan-y;
      user-select: none;
      /* 留給 active scale／底部光暈，避免壓到圓點與資訊卡 */
      padding: 0.15rem 0 0.5rem;
      box-sizing: border-box;
    }
    .carousel.is-dragging { cursor: grabbing; }
    .carousel.is-dragging .deck-slide {
      transition: none;
    }
    .carousel-track {
      position: absolute;
      inset: 0.1rem 0 0.45rem;
      transform-style: preserve-3d;
      transform: translateZ(0);
      cursor: grab;
    }
    .carousel-track:active { cursor: grabbing; }
    .deck-slide {
      position: absolute;
      top: 50%;
      left: 50%;
      /* 依輪播區高度放大，對齊附圖卡面比例 */
      height: 90%;
      width: auto;
      max-width: min(64%, 250px);
      aspect-ratio: 63 / 88;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      transform-origin: center center;
      transform-style: preserve-3d;
      transition: transform 0.55s var(--ease), opacity 0.45s ease, filter 0.45s ease;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      will-change: transform, opacity;
      backface-visibility: hidden;
    }
    .deck-slide-inner {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 14px;
      overflow: hidden;
      background: #1a1430;
      box-shadow:
        0 18px 36px rgba(40, 20, 80, 0.28),
        0 2px 0 rgba(255, 255, 255, 0.25) inset;
      transition: box-shadow 0.45s ease;
      backface-visibility: hidden;
      transform: translateZ(0.1px);
    }
    .deck-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 8%;
      display: block;
      pointer-events: none;
      transform: scale(1.04);
      transition: transform 0.6s var(--ease);
    }
    .deck-slide.is-near .deck-slide-inner {
      box-shadow:
        0 0 0 2px rgba(255, 255, 255, 0.55),
        0 0 22px rgba(160, 150, 255, 0.32),
        0 14px 28px rgba(40, 20, 80, 0.24);
    }
    .deck-slide.is-active .deck-slide-inner {
      box-shadow:
        0 0 0 3px #fff,
        0 0 0 6px rgba(190, 170, 255, 0.75),
        0 0 36px rgba(160, 140, 255, 0.7),
        0 0 60px rgba(120, 160, 255, 0.35),
        0 24px 44px rgba(40, 20, 80, 0.38);
    }
    .deck-slide.is-active img { transform: scale(1.08); }
    .deck-slide.is-active::after {
      content: '';
      position: absolute;
      left: 10%;
      right: 10%;
      bottom: -12px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(140, 150, 255, 0.5), transparent 72%);
      filter: blur(5px);
      pointer-events: none;
      z-index: -1;
    }
    .deck-fav {
      position: absolute;
      top: 0.45rem;
      right: 0.45rem;
      width: 1.45rem;
      height: 1.45rem;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(20, 14, 40, 0.35);
      backdrop-filter: blur(6px);
      color: var(--gold);
      font-size: 0.72rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .deck-slide.is-active .deck-fav.is-on,
    .deck-slide.is-fav .deck-fav {
      opacity: 1;
      transform: scale(1);
    }
    .carousel-nav {
      position: absolute;
      top: 50%;
      z-index: 20;
      width: 2.75rem;
      height: 2.75rem;
      margin-top: -1.35rem;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.38);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: rgba(42, 33, 80, 0.82);
      font-size: 1.2rem;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: 0 6px 16px rgba(40, 20, 80, 0.16);
      transition: background 0.2s ease, transform 0.2s ease, color 0.2s ease;
      pointer-events: auto;
    }
    .carousel-nav:hover {
      background: rgba(255, 255, 255, 0.62);
      color: #2a2150;
    }
    .carousel-nav:active { transform: scale(0.94); }
    .carousel-nav.prev { left: 0; }
    .carousel-nav.next { right: 0; }

    .dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.4rem;
      margin: 0;
      flex-shrink: 0;
    }
    .dots-compact {
      font-size: 0.78rem;
      font-weight: 700;
      color: rgba(42, 33, 80, 0.62);
      letter-spacing: 0.04em;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.42);
      backdrop-filter: blur(8px);
    }
    .dot {
      width: 0.42rem;
      height: 0.42rem;
      border: 0;
      border-radius: 999px;
      padding: 0;
      background: rgba(60, 50, 110, 0.28);
      cursor: pointer;
      transition: width 0.35s var(--ease), background 0.3s ease, box-shadow 0.3s ease;
    }
    .dot.is-active {
      width: 1.05rem;
      background: linear-gradient(90deg, #8b6cff, #6a8cff);
      box-shadow: 0 0 10px rgba(123, 92, 255, 0.55);
    }

    /* —— Info panel —— */
    .info-panel {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 3.55rem minmax(0, 1fr);
      gap: 0.5rem 0.65rem;
      padding: 0.62rem 0.7rem 0.68rem;
      border-radius: 16px;
      background: linear-gradient(160deg, rgba(32, 26, 58, 0.72) 0%, rgba(22, 18, 44, 0.78) 100%);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(18px) saturate(1.2);
      -webkit-backdrop-filter: blur(18px) saturate(1.2);
      color: #f4f1fb;
      box-shadow:
        0 16px 36px rgba(20, 10, 50, 0.28),
        0 1px 0 rgba(255, 255, 255, 0.12) inset;
      animation: riseIn 0.85s var(--ease) 0.18s both;
      overflow: hidden;
    }
    .info-panel::before {
      content: '';
      position: absolute;
      top: -40%;
      right: -20%;
      width: 55%;
      height: 80%;
      background: radial-gradient(circle, rgba(123, 92, 255, 0.22), transparent 70%);
      pointer-events: none;
    }
    .info-body {
      display: grid;
      gap: 0.3rem;
      min-width: 0;
      align-content: start;
    }
    .info-thumb {
      position: relative;
      border-radius: 9px;
      overflow: hidden;
      aspect-ratio: 63 / 88;
      background: #120c24;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.35);
      align-self: start;
    }
    .info-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 12%;
      display: block;
    }
    .info-badge {
      position: absolute;
      left: 0.2rem;
      right: 0.2rem;
      bottom: 0.25rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.2rem;
      padding: 0.18rem 0.25rem;
      border-radius: 5px;
      background: linear-gradient(135deg, #f0c14b, #e09220);
      color: #2a1800;
      font-family: var(--font-display);
      font-size: 0.48rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }
    .info-badge i { font-size: 0.45rem; }
    .info-identity {
      position: relative;
      min-width: 0;
      display: grid;
      gap: 0.28rem;
      align-content: start;
    }
    .info-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.3rem;
      align-items: start;
    }
    .info-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 800;
      font-style: italic;
      letter-spacing: 0.01em;
      line-height: 1.1;
      color: #fff;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
    }
    .info-sub {
      margin: 0.08rem 0 0;
      font-size: 0.7rem;
      color: rgba(244, 241, 251, 0.7);
      font-weight: 500;
    }
    .fav-toggle {
      width: 1.55rem;
      height: 1.55rem;
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      background: transparent;
      color: rgba(255, 255, 255, 0.55);
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 0.78rem;
      transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }
    .fav-toggle:hover { border-color: var(--gold); color: var(--gold); }
    .fav-toggle.is-on {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(240, 193, 75, 0.12);
    }
    .fav-toggle:active { transform: scale(0.92); }
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.28rem;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 0.22rem;
      padding: 0.14rem 0.42rem;
      border-radius: 999px;
      font-size: 0.62rem;
      font-weight: 700;
      line-height: 1.2;
    }
    .tag.is-comp {
      background: linear-gradient(135deg, #f0a040, #e87820);
      color: #2a1400;
    }
    .tag.is-muted {
      background: rgba(255, 255, 255, 0.12);
      color: rgba(244, 241, 251, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .info-desc {
      margin: 0;
      font-size: 0.64rem;
      line-height: 1.4;
      color: rgba(244, 241, 251, 0.62);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .info-stats {
      display: grid;
      gap: 0.1rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .info-stats li {
      display: grid;
      grid-template-columns: 0.8rem minmax(0, 1fr);
      gap: 0.35rem;
      align-items: baseline;

    /* —— Empty / loading / guest —— */

    .deck-status-tile-icon {
      width: 2.4rem;
      height: 2.4rem;
      border-radius: 12px;

      place-items: center;

    .deck-status-tile-copy {
      display: grid;

      min-width: 0;
    }
    .deck-status-tile-title {
      font-size: 0.95rem;
      font-weight: 800;

    }
    .deck-status-tile-desc {
      font-size: 0.75rem;
      line-height: 1.35;
      opacity: 0.72;
    }
    .deck-status-tile.is-primary {
      background: linear-gradient(135deg, #8b6cff, #5f7dff);

      box-shadow: 0 10px 22px rgba(95, 90, 220, 0.28);

    .deck-status-tile.is-primary .deck-status-tile-icon {
      background: rgba(255, 255, 255, 0.18);
    }
    .deck-status-tile.is-primary .deck-status-tile-desc { opacity: 0.85; }
    .deck-status-tile.is-secondary {
      background: rgba(42, 33, 80, 0.06);
      border-color: rgba(42, 33, 80, 0.1);
      color: #2a2150;
    }
    .deck-status-tile.is-secondary .deck-status-tile-icon {
      background: rgba(123, 92, 255, 0.12);
      color: #5a3fd4;
    }
    .deck-status-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      margin-top: 0.15rem;
      padding: 0.35rem;
      border: 0;
      background: transparent;
      color: rgba(42, 33, 80, 0.62);
      font: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;

    .deck-status-link:hover { color: #2a2150; }
    .deck-status-tile[hidden],
    .deck-status-link[hidden] { display: none !important; }
    .deck-status.is-loading .deck-status-actions,
    .deck-status.is-loading .deck-status-link { display: none; }
    .deck-status-spinner {
      display: none;
      width: 1.6rem;
      height: 1.6rem;
      margin: 0 auto 0.85rem;
      border: 2.5px solid rgba(90, 70, 200, 0.2);

      border-radius: 50%;

    .deck-status.is-loading .deck-status-spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;

      .deck-slide { transition: none; }

    @media (max-height: 700px) {

      .btn-skew { min-height: 2.4rem; }
      .app { gap: 0.35rem; }
      .carousel-wrap { gap: 0.28rem; }
      .chip-row { max-width: 54%; }
      .bottom-nav { padding-top: 0.15rem; }

    /* =========================================================
       Desktop layout (≥900px) — match design mockup

    @media (min-width: 900px) {
      body {
        display: block;
        padding: 0;

          radial-gradient(circle 6px at 28% 40%, rgba(255, 210, 230, 0.45), transparent 70%),
          radial-gradient(circle 8px at 82% 30%, rgba(255, 255, 255, 0.5), transparent 70%),
          radial-gradient(circle 5px at 64% 18%, rgba(220, 180, 255, 0.4), transparent 70%),
          radial-gradient(circle 7px at 90% 72%, rgba(180, 200, 255, 0.4), transparent 70%),
          /* soft castle / skyline silhouette hint */
          radial-gradient(ellipse 42% 28% at 78% 92%, rgba(160, 170, 200, 0.22), transparent 70%),
          radial-gradient(ellipse 28% 18% at 22% 94%, rgba(150, 165, 200, 0.16), transparent 70%);
      }

      .app {
        /* 輪播吃剩餘高度；info-panel 隨視窗自動量高，二者比例跟著視窗變 */
        grid-template-rows: auto minmax(0, 1fr) auto auto;
        gap: clamp(0.45rem, 1.1vh, 0.85rem);

          clamp(0.7rem, 1.8vh, 1.35rem)

      .brand-cluster { gap: 0.85rem; }
      .ws-logo-mark { width: 3rem; height: 3rem; }
      .page-title {

      .filters {

      .chip-row {

      .chip {

      }
      .chip .chip-label-full { display: inline; }
      .chip .chip-label-short { display: none; }
      .chip {
        height: 2.4rem;
        padding: 0 0.9rem;

      .chip.is-desk-only { display: inline-flex; }

      .carousel-wrap {
        align-content: stretch;
        grid-template-rows: minmax(0, 1fr) auto;

        height: 100%;

        padding: 1.1rem 1.6rem 6rem;
        max-width: 1100px;
        margin: 0 auto;
        width: 100%;
      }
      .deck-sheet-hero {
        grid-template-columns: 7rem minmax(0, 1fr);
        gap: 1.15rem;
      }
      .deck-sheet-cover { width: 7rem; }
      .deck-sheet-meta h3 { font-size: 1.55rem; }
      .deck-sheet-cards {
        grid-template-columns: repeat(auto-fill, minmax(5.6rem, 1fr));
        gap: 0.65rem;
      }
      .deck-sheet-analyze {
        gap: 0.75rem;
      }
      .deck-sheet-chart {
        padding: 0.85rem 0.75rem 0.9rem;
      }
      .deck-sheet-pie-wrap {
        width: min(100%, 8.5rem);
      }
      .deck-sheet-vbars {
        min-height: 8.5rem;
      }
      .deck-sheet-vbar-track {
        max-width: 1.85rem;
        min-height: 5.4rem;
      }
      .deck-sheet-dock {
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        width: min(640px, calc(100% - 2rem));
        padding-bottom: 0.85rem;
        border-radius: 16px 16px 0 0;
      }
    }

    @media (min-width: 900px) and (max-width: 1100px) {
      .app { padding-inline: 1.25rem; }
      .desk-footer { margin-inline: -1.25rem; padding-inline: 1.25rem; }
      .info-panel {
        grid-template-columns:
          clamp(4.2rem, 6.8vh, 5rem)
          minmax(0, 1.2fr)
          minmax(0, 1fr)
          minmax(9rem, 0.8fr);
        gap: clamp(0.5rem, 1.2vh, 0.85rem);
      }
      .search { width: min(13rem, 22vw); }
      .page-title { font-size: clamp(1.15rem, 2.2vh, 1.35rem); }
    }

    /* 矮視窗：壓 info-panel，把高度讓給輪播 */
    @media (min-width: 900px) and (max-height: 820px) {
      .info-panel {
        max-height: min(30vh, 11.5rem);
      }
      .info-desc { -webkit-line-clamp: 1; }
      .deck-slide {
        width: min(20vw, 220px, calc(86cqh * 63 / 88));
        max-width: min(20vw, 220px, calc(86cqh * 63 / 88));
        max-height: 86%;
      }
    }

    @media (min-width: 900px) and (max-height: 700px) {
      .app { gap: 0.35rem; }

      .deck-slide {
        width: min(18vw, 200px, calc(88cqh * 63 / 88));

      .carousel-nav {
        width: 2.6rem;

        margin-top: -1.3rem;

    /* 高視窗：輪播與資訊卡都放大一點 */
    @media (min-width: 900px) and (min-height: 960px) {
      .info-panel {

        max-width: min(18vw, 248px, calc(80cqh * 63 / 88));

      }

  <script>
    (function () {
      var Store = window.WsCollectionStore || {};
      var DECKS_KEY = Store.DECKS_KEY || 'wsCardsDecks';
      var FAV_KEY = 'wsDeckSelectFavorites';
      var CAROUSEL_POS_KEY = 'wsDeckSelectCarouselId';
      var fb = window.WsFirebase || null;
      var carouselPosRestored = false;

      var allDecks = [];
      var deckCloudUser = null;
      var deckAuthResolved = false;
      var deckSyncing = false;
      var favoriteIds = Object.create(null);

      var state = {
        index: 0,
        filter: 'all',
        sort: 'newest',
        query: '',
        list: []
      };

      var track = document.getElementById('carouselTrack');
      var carouselEl = document.getElementById('carousel');
      var atmosphereEl = document.getElementById('stageAtmosphere');
      var dotsEl = document.getElementById('dots');
      var toastEl = document.getElementById('toast');
      var toastTimer = null;
      var mqDesk = window.matchMedia('(min-width: 900px)');
      var dragFrac = 0;
      var dragActive = false;
      var dragMoved = false;
      var dragStartX = 0;
      var dragStartY = 0;
      var dragPointerId = null;
      var dragLastX = 0;
      var dragLastT = 0;
      var dragVelocity = 0;
      var DOTS_COMPACT_AT = 18;

      var appEl = document.querySelector('.app');
      var statusEl = document.getElementById('deckStatus');
      var statusTitle = document.getElementById('deckStatusTitle');
      var statusText = document.getElementById('deckStatusText');
      var statusPrimary = document.getElementById('deckStatusPrimary');
      var statusPrimaryLabel = document.getElementById('deckStatusPrimaryLabel');
      var statusPrimaryDesc = document.getElementById('deckStatusPrimaryDesc');
      var statusPrimaryIcon = document.getElementById('deckStatusPrimaryIcon');
      var statusSecondary = document.getElementById('deckStatusSecondary');
      var statusSecondaryLabel = document.getElementById('deckStatusSecondaryLabel');
      var statusSecondaryDesc = document.getElementById('deckStatusSecondaryDesc');
      var statusSecondaryIcon = document.getElementById('deckStatusSecondaryIcon');
      var statusLink = document.getElementById('deckStatusLink');
      var statusMode = 'loading';

      function showToast(msg) {
        if (!toastEl) return;
        toastEl.textContent = msg;
        toastEl.classList.add('is-on');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toastEl.classList.remove('is-on');
        }, 1800);
      }

      function readFavoriteIds() {
        try {
          var raw = localStorage.getItem(FAV_KEY);
          var list = raw ? JSON.parse(raw) : [];
          if (!Array.isArray(list)) return {};
          var map = Object.create(null);
          list.forEach(function (id) {
            id = String(id || '').trim();
            if (id) map[id] = true;
          });
          return map;
        } catch (e) {
          return {};
        }
      }

      function writeFavoriteIds() {
        try {
          localStorage.setItem(FAV_KEY, JSON.stringify(Object.keys(favoriteIds)));
        } catch (e) { /* ignore */ }
      }

      function readSavedCarouselDeckId() {
        try {
          return String(localStorage.getItem(CAROUSEL_POS_KEY) || '').trim();
        } catch (e) {
          return '';
        }
      }

      function persistCarouselPosition() {
        var deck = currentDeck();
        if (!deck || !deck.id) return;
        try {
          localStorage.setItem(CAROUSEL_POS_KEY, String(deck.id));
        } catch (e) { /* ignore */ }
      }

      /** 首次有可見牌組時，依上次選中的 deck id 還原輪播位置 */
      function restoreCarouselPositionIfNeeded() {
        if (carouselPosRestored) return;
        if (!state.list.length) return;
        carouselPosRestored = true;
        var id = readSavedCarouselDeckId();
        if (!id) return;
        for (var i = 0; i < state.list.length; i++) {
          if (state.list[i] && state.list[i].id === id) {
            state.index = i;
            return;
          }
        }
      }

      function normalizeText(v) {
        return String(v == null ? '' : v).trim();
      }

      function decksFirebaseReady() {
        return !!(fb && fb.ready && fb.firestoreReady && typeof fb.loadUserDecks === 'function');
      }

      function readLocalDecks() {
        try {
          var raw = localStorage.getItem(DECKS_KEY);
          var list = raw ? JSON.parse(raw) : [];
          return Array.isArray(list) ? list : [];
        } catch (e) {
          return [];
        }
      }

      function writeLocalDecks(list) {
        try {
          localStorage.setItem(DECKS_KEY, JSON.stringify(list || []));
        } catch (e) {
          console.error(e);
        }
      }

      function deckTotalCards(deck) {
        return ((deck && deck.cards) || []).reduce(function (sum, c) {
          var q = parseInt(c && c.qty, 10);
          return sum + (isNaN(q) || q < 1 ? 0 : q);
        }, 0);
      }

      function deckKindCount(deck) {
        return ((deck && deck.cards) || []).length;
      }

      function formatDotDate(ts) {
        if (!ts) return '—';
        var d = new Date(ts);
        if (isNaN(d.getTime())) return '—';
        var m = String(d.getMonth() + 1).padStart(2, '0');
        var day = String(d.getDate()).padStart(2, '0');
        return d.getFullYear() + '.' + m + '.' + day;
      }

      function buildCardImageUrls(cardNumberDisplay) {
        var cardNum = String(cardNumberDisplay || '').trim();
        if (cardNum.indexOf(' ') >= 0) cardNum = cardNum.substr(0, cardNum.indexOf(' '));
        if (!cardNum || cardNum.indexOf('-') < 0) return { primary: '', fallback: '' };
        var cardFirst = cardNum.substr(0, 1);
        var cardSecond = cardNum.substr(0, cardNum.indexOf('-')).replace('/', '_');
        var cardThird = cardNum.replace('/', '_').replace('-', '_');
        return {
          primary: 'https://imgs.devilfox.net/ws/' + cardSecond.toLowerCase() + '/' + cardThird.toLowerCase() + '.png',
          fallback: 'https://ws-tcg.com/wordpress/wp-content/images/cardlist/' +
            cardFirst.toLowerCase() + '/' + cardSecond.toLowerCase() + '/' + cardThird.toLowerCase() + '.png'
        };
      }

      function pickDeckCoverCard(deck) {
        var cards = (deck && deck.cards) || [];
        if (!cards.length) return null;
        var preferred = normalizeText(deck && deck.coverCardNumber).replace(/\\/g, '/');
        if (preferred) {
          for (var p = 0; p < cards.length; p++) {
            if (cards[p] && cards[p].cardNumber === preferred) return cards[p];
          }
        }
        var best = cards[0];
        var bestQty = best && best.qty ? best.qty : 0;
        for (var i = 1; i < cards.length; i++) {
          var q = cards[i] && cards[i].qty ? cards[i].qty : 0;
          if (q > bestQty) {
            best = cards[i];
            bestQty = q;
          }
        }
        return best && best.cardNumber ? best : cards[0];
      }

      function coverUrlsForDeck(deck) {
        var cover = pickDeckCoverCard(deck);
        if (!cover || !cover.cardNumber) return { primary: '', fallback: '' };
        return buildCardImageUrls(cover.cardNumber);
      }

      function inferBuild(tags) {
        for (var i = 0; i < tags.length; i++) {
          if (/扉|門|軸|控|速攻|燃燒|墓地|倒數/.test(tags[i])) return tags[i];
        }
        return '—';
      }

      function inferCompetitive(tags) {
        return tags.some(function (t) { return /競技|對戰|比賽|競技向け/.test(t); });
      }

      function inferTagLabel(tags, competitive) {
        for (var i = 0; i < tags.length; i++) {
          if (/競技|休閒|娛樂|對戰/.test(tags[i])) return tags[i];
        }
        return competitive ? '競技向け' : (tags[0] || '一般');
      }

      function seriesCodeFromDeck(deck) {
        var cover = pickDeckCoverCard(deck);
        var no = cover && cover.cardNumber ? String(cover.cardNumber) : '';
        if (!no) return '';
        var slash = no.indexOf('/');
        var dash = no.indexOf('-');
        if (slash < 0 || dash < 0) return '';
        return no.slice(0, dash);
      }

      /** 雲端尚無專用欄位時，以 tcg／gameType／標籤推斷；預設 WS */
      function inferDeckTcg(deck) {
        var raw = normalizeText(
          (deck && (deck.tcg || deck.gameType || deck.game)) || ''
        ).toLowerCase();
        if (raw === 'wsr' || raw === 'revue' || raw === 'weiss schwarz revue') return 'wsr';
        if (raw === 'ws' || raw === 'weiss' || raw === 'weiss schwarz') return 'ws';
        var tags = Array.isArray(deck && deck.tags) ? deck.tags : [];
        for (var i = 0; i < tags.length; i++) {
          var t = normalizeText(tags[i]).toLowerCase();
          if (!t) continue;
          if (/(^|[^a-z])wsr([^a-z]|$)|revue|レヴュー/.test(t)) return 'wsr';
        }
        return 'ws';
      }

      function deckSearchHaystack(deck) {
        if (!deck) return '';
        var tags = Array.isArray(deck.tags) ? deck.tags : [];
        var cards = Array.isArray(deck.cards) ? deck.cards : [];
        var meta = deck.createMeta || {};
        var parts = [
          deck.name,
          deck.deckDescription,
          deck.decklogCode,
          deck.coverCardNumber,
          deck.source,
          tags.join(' '),
          cards.map(function (c) {
            if (!c) return '';
            return [c.cardNumber, c.cardName].filter(Boolean).join(' ');
          }).join(' '),
          meta.seriesName,
          meta.seriesPrefix,
          seriesCodeFromDeck(deck),
          inferDeckTcg(deck)
        ];
        return parts.filter(Boolean).join(' ').toLowerCase();
      }

      function deckMatchesQuery(deck, query) {
        var q = normalizeText(query).toLowerCase();
        if (!q) return true;
        return deckSearchHaystack(deck).indexOf(q) >= 0;
      }

      function toViewModel(deck) {
        var tags = Array.isArray(deck.tags) ? deck.tags.map(normalizeText).filter(Boolean) : [];
        var total = deckTotalCards(deck);
        var kinds = deckKindCount(deck);
        var competitive = inferCompetitive(tags);
        var urls = coverUrlsForDeck(deck);
        var series = seriesCodeFromDeck(deck);
        var build = inferBuild(tags);
        var tcg = inferDeckTcg(deck);
        var subtitleParts = [];
        if (tags[0] && tags[0] !== build) subtitleParts.push(tags[0]);
        if (build !== '—') subtitleParts.push(build + ( /扉|門/.test(build) ? '' : '' ));
        if (!subtitleParts.length) subtitleParts.push(kinds + ' 種 · ' + total + ' 張');
        return {
          id: deck.id,
          title: normalizeText(deck.name) || '未命名牌組',
          subtitle: subtitleParts.join(' / '),
          work: tags.find(function (t) { return !/競技|休閒|扉|門|軸/.test(t); }) || series || '—',
          build: build,
          created: formatDotDate(deck.createdAt),
          winRate: '—',
          winNote: '尚無對戰資料',
          cards: total,
          kinds: kinds,
          competitive: competitive,
          favorite: !!favoriteIds[deck.id],
          tag: inferTagLabel(tags, competitive),
          game: tcg === 'wsr' ? 'WSR' : 'WS',
          tcg: tcg,
          searchText: deckSearchHaystack(deck),
          desc: normalizeText(deck.deckDescription) || '尚未填寫牌組說明。',
          cover: urls.primary,
          coverFallback: urls.fallback,
          createdAt: deck.createdAt || 0,
          updatedAt: deck.updatedAt || deck.createdAt || 0,
          raw: deck
        };
      }

      function bindImgFallback(img, fallback) {
        if (!img) return;
        img.onerror = function () {
          if (fallback && img.getAttribute('data-tried-fallback') !== '1') {
            img.setAttribute('data-tried-fallback', '1');
            img.src = fallback;
            return;
          }
          img.style.opacity = '0.35';
          img.onerror = null;
        };
      }

      function setTile(btn, opts) {
        if (!btn) return;

        if (opts.hidden) {
          btn.removeAttribute('data-empty-action');

        if (opts.labelEl) opts.labelEl.textContent = opts.label || '';
        if (opts.descEl) {
          opts.descEl.textContent = opts.desc || '';
          opts.descEl.hidden = !opts.desc;
        }
        if (opts.iconEl) {
          opts.iconEl.className = 'fas ' + (opts.icon || 'fa-circle') + (opts.spin ? ' fa-spin' : '');
        }
      }

          });
          setTile(statusSecondary, {

        if (mode === 'filtered') {

          statusText.textContent = '試著調整關鍵字，或清除搜尋／篩選後再看全部牌組。';
          setTile(statusPrimary, {
            action: 'clear',
            label: '清除搜尋與篩選',
            desc: '回到完整牌組列表。',
            icon: 'fa-times',
            labelEl: statusPrimaryLabel,
            descEl: statusPrimaryDesc,
            iconEl: statusPrimaryIcon
          });
          setTile(statusSecondary, { hidden: true });
          if (statusLink) statusLink.hidden = true;
          return;
        }

        if (mode === 'error') {
          statusTitle.textContent = '無法載入牌組';
          statusText.textContent = '雲端同步失敗，請稍後再試，或改用完整牌組頁。';
          setTile(statusPrimary, {
            action: 'retry',
            label: '重新載入',
            desc: '再次同步雲端牌組。',
            icon: 'fa-sync-alt',
            labelEl: statusPrimaryLabel,
            descEl: statusPrimaryDesc,
            iconEl: statusPrimaryIcon
          });
          setTile(statusSecondary, {
            action: 'decks',
            label: '前往完整牌組頁',
            desc: '用原有介面管理牌組。',
            icon: 'fa-external-link-alt',
            labelEl: statusSecondaryLabel,
            descEl: statusSecondaryDesc,
            iconEl: statusSecondaryIcon
          });
          if (statusLink) statusLink.hidden = true;
