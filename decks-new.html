<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DECK SELECT｜我的牌組｜WS-Cards 卡片雲</title>
  <meta name="description" content="選擇並使用你的 Weiss Schwarz 牌組。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#d4c8ef">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="plugins/fontawesome-free/css/all.min.css">
  <style>
    :root {
      --ink: #1a1430;
      --ink-soft: rgba(26, 20, 48, 0.72);
      --glass: rgba(28, 22, 52, 0.55);
      --glass-border: rgba(255, 255, 255, 0.22);
      --violet: #7b5cff;
      --gold: #f0c14b;
      --chip: rgba(255, 255, 255, 0.42);
      --chip-ink: #3a2f68;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --font-ui: 'Zen Kaku Gothic New', 'Noto Sans TC', sans-serif;
      --font-display: 'Outfit', 'Zen Kaku Gothic New', sans-serif;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --phone-w: min(430px, 100vw);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: #1a1230;
      color: var(--ink);
      font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .stage {
      position: relative;
      width: var(--phone-w);
      height: min(932px, 100dvh);
      max-height: 100dvh;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(ellipse 80% 50% at 15% 18%, rgba(255, 255, 255, 0.55), transparent 55%),
        radial-gradient(ellipse 60% 40% at 85% 12%, rgba(180, 150, 255, 0.45), transparent 50%),
        radial-gradient(ellipse 70% 55% at 70% 75%, rgba(140, 170, 255, 0.35), transparent 55%),
        radial-gradient(ellipse 50% 40% at 20% 80%, rgba(200, 170, 255, 0.3), transparent 50%),
        linear-gradient(165deg, #e8dff8 0%, #d5c8f0 38%, #c8d4f5 72%, #d2c4ee 100%);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.18),
        0 28px 80px rgba(20, 10, 50, 0.45);
    }

    @media (min-width: 480px) and (max-width: 899.98px) {
      .stage { border-radius: 28px; }
      body {
        background:
          radial-gradient(ellipse at 30% 20%, #3a2a68, transparent 50%),
          radial-gradient(ellipse at 80% 80%, #1e2a58, transparent 45%),
          #120c24;
        padding: 12px;
      }
    }

    .stage-fx {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .stage-fx::before {
      content: '';
      position: absolute;
      inset: -20%;
      background-image:
        linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, 0.07) 50%, transparent 60%),
        repeating-linear-gradient(-28deg, transparent 0 28px, rgba(123, 92, 255, 0.035) 28px 29px);
      animation: drift 18s linear infinite;
    }
    .stage-fx::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle 7px at 18% 32%, rgba(255, 255, 255, 0.55), transparent 70%),
        radial-gradient(circle 5px at 72% 28%, rgba(255, 255, 255, 0.4), transparent 70%),
        radial-gradient(circle 9px at 88% 58%, rgba(180, 160, 255, 0.45), transparent 70%),
        radial-gradient(circle 4px at 32% 68%, rgba(255, 255, 255, 0.35), transparent 70%),
        radial-gradient(circle 6px at 58% 82%, rgba(200, 180, 255, 0.4), transparent 70%);
      animation: floatBokeh 9s ease-in-out infinite alternate;
    }
    @keyframes drift {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(-4%, 3%, 0); }
    }
    @keyframes floatBokeh {
      from { transform: translateY(0) scale(1); opacity: 0.85; }
      to { transform: translateY(-12px) scale(1.04); opacity: 1; }
    }

    .app {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-rows: auto 1fr auto auto auto;
      height: 100%;
      padding:
        max(0.7rem, env(safe-area-inset-top, 0px))
        0.9rem
        calc(0.35rem + var(--safe-b))
        0.9rem;
      gap: 0.7rem;
    }

    /* —— Header —— */
    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "brand menu"
        "filters filters";
      align-items: center;
      gap: 0.55rem 0.7rem;
      animation: riseIn 0.7s var(--ease) both;
    }
    .brand-cluster { grid-area: brand; }
    .menu-btn { grid-area: menu; }
    .filters { grid-area: filters; }
    .brand-cluster {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      min-width: 0;
      /* grid-area set above */
    }
    .ws-logo {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      color: inherit;
      flex-shrink: 0;
    }
    .ws-logo-mark {
      width: 2.35rem;
      height: 2.35rem;
      filter: drop-shadow(0 2px 8px rgba(40, 20, 80, 0.28));
    }
    .brand-copy { min-width: 0; }
    .page-title {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(0.95rem, 4.2vw, 1.12rem);
      letter-spacing: 0.16em;
      color: #2a2150;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.45);
      white-space: nowrap;
    }
    .page-lede {
      display: none;
      margin: 0.15rem 0 0;
      font-size: 0.78rem;
      color: rgba(42, 33, 80, 0.55);
      letter-spacing: 0.04em;
    }
    .menu-btn {
      width: 2.35rem;
      height: 2.35rem;
      border: 0;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.42);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #2a2150;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.4) inset;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .menu-btn:hover { background: rgba(255, 255, 255, 0.55); }
    .menu-btn:active { transform: scale(0.96); }
    .menu-btn i {
      display: block;
      width: 1rem;
      height: 1.5px;
      background: currentColor;
      border-radius: 2px;
      box-shadow: 0 -5px 0 currentColor, 0 5px 0 currentColor;
    }

    /* —— Search + filters —— */
    .filters {
      display: grid;
      gap: 0.55rem;
      animation: riseIn 0.75s var(--ease) 0.06s both;
    }
    .search {
      position: relative;
      display: flex;
      align-items: center;
    }
    .search i {
      position: absolute;
      left: 0.9rem;
      color: rgba(58, 47, 104, 0.55);
      font-size: 0.85rem;
      pointer-events: none;
    }
    .search input {
      width: 100%;
      height: 2.55rem;
      padding: 0 1rem 0 2.45rem;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.48);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--ink);
      font: inherit;
      font-size: 0.88rem;
      outline: none;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.55) inset,
        0 8px 20px rgba(80, 50, 140, 0.08);
      transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }
    .search input::placeholder { color: rgba(58, 47, 104, 0.45); }
    .search input:focus {
      border-color: rgba(123, 92, 255, 0.55);
      background: rgba(255, 255, 255, 0.7);
      box-shadow:
        0 0 0 3px rgba(123, 92, 255, 0.18),
        0 8px 20px rgba(80, 50, 140, 0.1);
    }
    .chip-row {
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 0.1rem;
    }
    .chip-row::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      height: 2.05rem;
      padding: 0 0.78rem;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 999px;
      background: var(--chip);
      color: var(--chip-ink);
      font: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
    }
    .chip i { font-size: 0.72rem; opacity: 0.85; }
    .chip .chev { font-size: 0.58rem; opacity: 0.65; margin-left: 0.05rem; }
    .chip:hover { background: rgba(255, 255, 255, 0.62); }
    .chip:active { transform: scale(0.97); }
    .chip.is-active {
      background: linear-gradient(135deg, #8b6cff 0%, #5f7dff 100%);
      border-color: transparent;
      color: #fff;
      box-shadow:
        0 6px 16px rgba(95, 90, 220, 0.35),
        0 1px 0 rgba(255, 255, 255, 0.28) inset;
    }
    .chip.is-active i,
    .chip.is-active .chev { opacity: 1; }
    .chip.is-desk-only { display: none; }

    /* —— Carousel —— */
    .carousel-wrap {
      position: relative;
      display: grid;
      align-content: center;
      min-height: 0;
      animation: riseIn 0.8s var(--ease) 0.12s both;
    }
    .carousel {
      position: relative;
      height: min(44vh, 360px);
      min-height: 240px;
      perspective: 1400px;
      touch-action: pan-y;
      user-select: none;
    }
    .carousel-track {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      cursor: grab;
    }
    .carousel-track:active { cursor: grabbing; }
    .deck-slide {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(46%, 176px);
      aspect-ratio: 63 / 88;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      transform-origin: center center;
      transform-style: preserve-3d;
      transition: transform 0.55s var(--ease), opacity 0.45s ease, filter 0.45s ease;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }
    .deck-slide-inner {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 14px;
      overflow: hidden;
      background: #1a1430;
      box-shadow:
        0 18px 36px rgba(40, 20, 80, 0.28),
        0 2px 0 rgba(255, 255, 255, 0.25) inset;
      transition: box-shadow 0.45s ease;
    }
    .deck-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 8%;
      display: block;
      pointer-events: none;
      transform: scale(1.04);
      transition: transform 0.6s var(--ease);
    }
    .deck-slide.is-active .deck-slide-inner {
      box-shadow:
        0 0 0 3px #fff,
        0 0 0 6px rgba(190, 170, 255, 0.75),
        0 0 36px rgba(160, 140, 255, 0.7),
        0 0 60px rgba(120, 160, 255, 0.35),
        0 24px 44px rgba(40, 20, 80, 0.38);
    }
    .deck-slide.is-active img { transform: scale(1.08); }
    .deck-slide.is-active::after {
      content: '';
      position: absolute;
      left: 12%;
      right: 12%;
      bottom: -14px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(120, 100, 220, 0.35), transparent 70%);
      filter: blur(4px);
      pointer-events: none;
      z-index: -1;
    }
    .deck-fav {
      position: absolute;
      top: 0.45rem;
      right: 0.45rem;
      width: 1.45rem;
      height: 1.45rem;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(20, 14, 40, 0.35);
      backdrop-filter: blur(6px);
      color: var(--gold);
      font-size: 0.72rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .deck-slide.is-active .deck-fav.is-on,
    .deck-slide.is-fav .deck-fav {
      opacity: 1;
      transform: scale(1);
    }
    .carousel-nav {
      position: absolute;
      top: 50%;
      z-index: 20;
      width: 2.75rem;
      height: 2.75rem;
      margin-top: -1.35rem;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.38);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: rgba(42, 33, 80, 0.82);
      font-size: 1.2rem;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: 0 6px 16px rgba(40, 20, 80, 0.16);
      transition: background 0.2s ease, transform 0.2s ease, color 0.2s ease;
      pointer-events: auto;
    }
    .carousel-nav:hover {
      background: rgba(255, 255, 255, 0.62);
      color: #2a2150;
    }
    .carousel-nav:active { transform: scale(0.94); }
    .carousel-nav.prev { left: 0; }
    .carousel-nav.next { right: 0; }

    .dots {
      display: flex;
      justify-content: center;
      gap: 0.4rem;
      margin-top: 0.55rem;
    }
    .dot {
      width: 0.42rem;
      height: 0.42rem;
      border: 0;
      border-radius: 999px;
      padding: 0;
      background: rgba(60, 50, 110, 0.28);
      cursor: pointer;
      transition: width 0.35s var(--ease), background 0.3s ease, box-shadow 0.3s ease;
    }
    .dot.is-active {
      width: 1.05rem;
      background: linear-gradient(90deg, #8b6cff, #6a8cff);
      box-shadow: 0 0 10px rgba(123, 92, 255, 0.55);
    }

    /* —— Info panel —— */
    .info-panel {
      position: relative;
      display: grid;
      grid-template-columns: 4.6rem minmax(0, 1fr);
      gap: 0.75rem 0.85rem;
      padding: 0.85rem 0.9rem 0.95rem;
      border-radius: 18px;
      background: linear-gradient(160deg, rgba(32, 26, 58, 0.72) 0%, rgba(22, 18, 44, 0.78) 100%);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(18px) saturate(1.2);
      -webkit-backdrop-filter: blur(18px) saturate(1.2);
      color: #f4f1fb;
      box-shadow:
        0 16px 36px rgba(20, 10, 50, 0.28),
        0 1px 0 rgba(255, 255, 255, 0.12) inset;
      animation: riseIn 0.85s var(--ease) 0.18s both;
      overflow: hidden;
    }
    .info-panel::before {
      content: '';
      position: absolute;
      top: -40%;
      right: -20%;
      width: 55%;
      height: 80%;
      background: radial-gradient(circle, rgba(123, 92, 255, 0.22), transparent 70%);
      pointer-events: none;
    }
    .info-thumb {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 63 / 88;
      background: #120c24;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.35);
      align-self: start;
      grid-row: 1 / span 2;
    }
    .info-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 12%;
      display: block;
    }
    .info-badge {
      position: absolute;
      left: 0.2rem;
      right: 0.2rem;
      bottom: 0.25rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.2rem;
      padding: 0.18rem 0.25rem;
      border-radius: 5px;
      background: linear-gradient(135deg, #f0c14b, #e09220);
      color: #2a1800;
      font-family: var(--font-display);
      font-size: 0.48rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }
    .info-badge i { font-size: 0.45rem; }
    .info-identity {
      position: relative;
      min-width: 0;
      display: grid;
      gap: 0.4rem;
      align-content: start;
    }
    .info-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.35rem;
      align-items: start;
    }
    .info-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.28rem;
      font-weight: 800;
      font-style: italic;
      letter-spacing: 0.01em;
      line-height: 1.1;
      color: #fff;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
    }
    .info-sub {
      margin: 0.15rem 0 0;
      font-size: 0.78rem;
      color: rgba(244, 241, 251, 0.7);
      font-weight: 500;
    }
    .fav-toggle {
      width: 1.85rem;
      height: 1.85rem;
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      background: transparent;
      color: rgba(255, 255, 255, 0.55);
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 0.78rem;
      transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }
    .fav-toggle:hover { border-color: var(--gold); color: var(--gold); }
    .fav-toggle.is-on {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(240, 193, 75, 0.12);
    }
    .fav-toggle:active { transform: scale(0.92); }
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 0.28rem;
      padding: 0.22rem 0.55rem;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
      line-height: 1.2;
    }
    .tag.is-comp {
      background: linear-gradient(135deg, #f0a040, #e87820);
      color: #2a1400;
    }
    .tag.is-muted {
      background: rgba(255, 255, 255, 0.12);
      color: rgba(244, 241, 251, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .info-desc {
      margin: 0.1rem 0 0;
      font-size: 0.7rem;
      line-height: 1.45;
      color: rgba(244, 241, 251, 0.62);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .info-stats {
      display: grid;
      gap: 0.22rem;
      margin: 0;
      padding: 0;
      list-style: none;
      grid-column: 2;
    }
    .info-stats li {
      display: grid;
      grid-template-columns: 0.9rem minmax(0, 1fr);
      gap: 0.45rem;
      align-items: baseline;
      font-size: 0.72rem;
      color: rgba(244, 241, 251, 0.78);
      line-height: 1.35;
    }
    .info-stats i {
      font-size: 0.68rem;
      color: rgba(180, 170, 230, 0.85);
      text-align: center;
    }
    .info-stats .stat-label { opacity: 0.78; }
    .info-stats .stat-kicker::after { content: ' : '; }
    .info-stats strong {
      font-weight: 700;
      color: #fff;
    }
    .info-actions {
      display: none;
      gap: 0.55rem;
      align-content: center;
    }
    .info-more {
      position: absolute;
      right: 0.7rem;
      bottom: 0.55rem;
      width: 1.5rem;
      height: 1.5rem;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.7);
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 0.7rem;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .info-more:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    /* —— Action buttons (mobile) —— */
    .actions-mobile {
      display: grid;
      grid-template-columns: 0.85fr 1.15fr;
      gap: 0.55rem;
      padding: 0 0.15rem;
      animation: riseIn 0.9s var(--ease) 0.24s both;
    }
    .btn-skew {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      min-height: 3.15rem;
      padding: 0.55rem 1rem;
      border: 0;
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transform: skewX(-12deg);
      border-radius: 6px;
      overflow: hidden;
      transition: transform 0.2s ease, filter 0.2s ease, box-shadow 0.25s ease;
    }
    .btn-skew > * { transform: skewX(12deg); }
    .btn-skew:active { transform: skewX(-12deg) scale(0.97); }
    .btn-edit {
      background: linear-gradient(135deg, #3a3568 0%, #2a3a78 55%, #354088 100%);
      box-shadow:
        0 8px 18px rgba(40, 40, 100, 0.35),
        0 1px 0 rgba(255, 255, 255, 0.18) inset;
      font-size: 0.92rem;
      letter-spacing: 0.02em;
    }
    .btn-edit:hover { filter: brightness(1.08); }
    .btn-start {
      background: linear-gradient(135deg, #ffe58a 0%, #f5c040 40%, #ef8f1c 100%);
      color: #2a1600;
      box-shadow:
        0 12px 28px rgba(232, 160, 40, 0.5),
        0 0 28px rgba(240, 193, 75, 0.48),
        0 0 0 1px rgba(255, 220, 140, 0.55),
        0 1px 0 rgba(255, 255, 255, 0.5) inset;
      flex-direction: column;
      gap: 0.05rem;
      padding-block: 0.4rem;
      animation: startPulse 2.8s ease-in-out infinite;
    }
    @keyframes startPulse {
      0%, 100% { box-shadow: 0 12px 28px rgba(232, 160, 40, 0.5), 0 0 28px rgba(240, 193, 75, 0.42), 0 0 0 1px rgba(255, 220, 140, 0.55), 0 1px 0 rgba(255, 255, 255, 0.5) inset; }
      50% { box-shadow: 0 14px 32px rgba(232, 160, 40, 0.58), 0 0 40px rgba(240, 193, 75, 0.62), 0 0 0 1px rgba(255, 230, 160, 0.7), 0 1px 0 rgba(255, 255, 255, 0.55) inset; }
    }
    .btn-start:hover {
      filter: brightness(1.05);
      animation: none;
      box-shadow:
        0 14px 32px rgba(232, 160, 40, 0.6),
        0 0 40px rgba(240, 193, 75, 0.55),
        0 0 0 1px rgba(255, 230, 160, 0.7),
        0 1px 0 rgba(255, 255, 255, 0.55) inset;
    }
    .btn-start-main {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
    }
    .btn-start-sub {
      font-family: var(--font-display);
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      opacity: 0.72;
    }
    .btn-start .arrows {
      font-size: 0.85rem;
      letter-spacing: -0.08em;
      opacity: 0.85;
    }

    /* —— Bottom nav (mobile) —— */
    .bottom-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: end;
      gap: 0.15rem;
      margin: 0.15rem -0.9rem calc(-0.35rem - var(--safe-b));
      padding: 0.45rem 0.4rem calc(0.55rem + var(--safe-b));
      background: linear-gradient(180deg, #241a48 0%, #1a1335 100%);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 -10px 28px rgba(20, 10, 40, 0.28);
      animation: riseIn 0.95s var(--ease) 0.28s both;
    }
    .nav-item {
      position: relative;
      display: grid;
      justify-items: center;
      gap: 0.22rem;
      padding: 0.45rem 0.2rem 0.35rem;
      border: 0;
      background: transparent;
      color: rgba(220, 210, 245, 0.55);
      font: inherit;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s ease;
    }
    .nav-item i { font-size: 1.05rem; line-height: 1; }
    .nav-item.is-active { color: #fff; }
    .nav-item.is-active::before {
      content: '';
      position: absolute;
      top: 0.05rem;
      left: 50%;
      width: 78%;
      height: 2.55rem;
      transform: translateX(-50%) skewX(-16deg);
      border-radius: 10px;
      background: linear-gradient(160deg, rgba(140, 110, 255, 0.95), rgba(90, 70, 210, 0.65));
      box-shadow:
        0 0 22px rgba(123, 92, 255, 0.6),
        0 0 40px rgba(123, 92, 255, 0.28),
        0 1px 0 rgba(255, 255, 255, 0.3) inset;
      z-index: -1;
    }
    .nav-item.is-active i {
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.45));
    }
    .nav-item:not(.is-active):hover { color: rgba(244, 241, 251, 0.85); }

    .desk-footer { display: none; }

    .toast {
      position: absolute;
      left: 50%;
      bottom: calc(4.8rem + var(--safe-b));
      z-index: 20;
      transform: translateX(-50%) translateY(12px);
      padding: 0.55rem 1rem;
      border-radius: 999px;
      background: rgba(22, 16, 42, 0.9);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease, transform 0.28s var(--ease);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
    }
    .toast.is-on {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* —— Empty / loading / guest —— */
    .deck-status {
      display: none;
      position: absolute;
      left: 50%;
      top: 46%;
      z-index: 8;
      transform: translate(-50%, -50%);
      width: min(22rem, calc(100% - 2rem));
      padding: 1.4rem 1.25rem;
      border-radius: 18px;
      text-align: center;
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 14px 32px rgba(40, 20, 80, 0.12);
      color: #2a2150;
    }
    .app.is-empty .deck-status { display: block; }
    .app.is-empty .carousel-wrap,
    .app.is-empty .info-panel,
    .app.is-empty .actions-mobile {
      visibility: hidden;
      pointer-events: none;
    }
    .deck-status-kicker {
      margin: 0 0 0.35rem;
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      opacity: 0.55;
    }
    .deck-status-title {
      margin: 0 0 0.45rem;
      font-size: 1.2rem;
      font-weight: 800;
    }
    .deck-status-text {
      margin: 0 0 1rem;
      font-size: 0.86rem;
      line-height: 1.5;
      opacity: 0.72;
    }
    .deck-status-actions {
      display: grid;
      gap: 0.5rem;
    }
    .deck-status-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      min-height: 2.6rem;
      padding: 0.55rem 1rem;
      border: 0;
      border-radius: 999px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      transition: filter 0.2s ease, transform 0.2s ease;
    }
    .deck-status-btn:active { transform: scale(0.98); }
    .deck-status-btn.is-primary {
      background: linear-gradient(135deg, #8b6cff, #5f7dff);
      color: #fff;
      box-shadow: 0 8px 18px rgba(95, 90, 220, 0.3);
    }
    .deck-status-btn.is-secondary {
      background: rgba(42, 33, 80, 0.08);
      color: #2a2150;
    }
    .deck-status-btn:hover { filter: brightness(1.05); }
    .deck-status.is-loading .deck-status-actions { display: none; }
    .deck-status-spinner {
      display: none;
      width: 1.6rem;
      height: 1.6rem;
      margin: 0 auto 0.85rem;
      border: 2.5px solid rgba(90, 70, 200, 0.2);
      border-top-color: #7b5cff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .deck-status.is-loading .deck-status-spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .deck-slide { transition: none; }
    }

    @media (max-height: 700px) {
      .carousel { height: min(36vh, 260px); min-height: 190px; }
      .info-panel { padding: 0.7rem 0.75rem 0.8rem; gap: 0.6rem; }
      .info-title { font-size: 1.1rem; }
      .btn-skew { min-height: 2.85rem; }
      .app { gap: 0.55rem; }
    }

    /* =========================================================
       Desktop layout (≥900px) — match design mockup
       ========================================================= */
    @media (min-width: 900px) {
      body {
        display: block;
        padding: 0;
        background: #d8e2f4;
        overflow: hidden;
      }

      .stage {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        max-height: none;
        border-radius: 0;
        box-shadow: none;
        background:
          radial-gradient(ellipse 55% 45% at 12% 18%, rgba(255, 255, 255, 0.72), transparent 60%),
          radial-gradient(ellipse 40% 35% at 88% 12%, rgba(190, 170, 255, 0.35), transparent 55%),
          radial-gradient(ellipse 50% 40% at 78% 88%, rgba(160, 190, 255, 0.28), transparent 55%),
          linear-gradient(165deg, #eef2fb 0%, #e3e8f8 35%, #d7dff5 68%, #e6e4f6 100%);
      }

      .stage-fx::before {
        background-image:
          radial-gradient(ellipse 70% 50% at 70% 100%, rgba(180, 190, 220, 0.35), transparent 60%),
          linear-gradient(115deg, transparent 42%, rgba(255, 255, 255, 0.12) 50%, transparent 58%),
          repeating-linear-gradient(-24deg, transparent 0 36px, rgba(120, 140, 200, 0.04) 36px 37px);
        opacity: 0.9;
      }
      .stage-fx::after {
        background:
          radial-gradient(circle 10px at 14% 22%, rgba(255, 255, 255, 0.7), transparent 70%),
          radial-gradient(circle 6px at 28% 40%, rgba(255, 210, 230, 0.45), transparent 70%),
          radial-gradient(circle 8px at 82% 30%, rgba(255, 255, 255, 0.5), transparent 70%),
          radial-gradient(circle 5px at 64% 18%, rgba(220, 180, 255, 0.4), transparent 70%),
          radial-gradient(circle 7px at 90% 72%, rgba(180, 200, 255, 0.4), transparent 70%),
          /* soft castle silhouette hint */
          radial-gradient(ellipse 42% 28% at 78% 92%, rgba(160, 170, 200, 0.22), transparent 70%);
      }

      .app {
        grid-template-rows: auto 1fr auto auto;
        gap: 0.85rem;
        padding: 1.35rem 2.4rem 0;
        max-width: 1440px;
        margin: 0 auto;
        height: 100%;
      }

      .topbar {
        grid-template-columns: auto minmax(0, 1fr);
        grid-template-areas: "brand filters";
        gap: 1.25rem;
        align-items: center;
      }
      .brand-cluster { gap: 0.85rem; }
      .ws-logo-mark { width: 3rem; height: 3rem; }
      .page-title {
        font-size: 1.65rem;
        font-style: italic;
        letter-spacing: 0.12em;
      }
      .page-lede { display: block; }
      .menu-btn { display: none; }

      .filters {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 0.55rem;
        min-width: 0;
        animation: riseIn 0.7s var(--ease) 0.05s both;
      }
      .search { width: min(16.5rem, 28vw); flex: 0 1 auto; }
      .search input {
        height: 2.4rem;
        font-size: 0.84rem;
        background: rgba(255, 255, 255, 0.62);
      }
      .chip-row {
        overflow: visible;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .chip {
        height: 2.4rem;
        padding: 0 0.9rem;
        font-size: 0.8rem;
        background: rgba(255, 255, 255, 0.55);
      }
      .chip.is-desk-only { display: inline-flex; }

      .carousel-wrap {
        align-content: end;
        padding-bottom: 0.4rem;
      }
      .carousel {
        height: min(52vh, 460px);
        min-height: 320px;
        perspective: 1800px;
      }
      .deck-slide {
        width: min(18vw, 220px);
      }
      .carousel-nav {
        width: 3.2rem;
        height: 3.2rem;
        margin-top: -1.6rem;
        font-size: 1.35rem;
        background: rgba(255, 255, 255, 0.45);
      }
      .carousel-nav.prev { left: 1.5rem; }
      .carousel-nav.next { right: 1.5rem; }
      .dots { margin-top: 0.85rem; gap: 0.5rem; }
      .dot { width: 0.48rem; height: 0.48rem; }
      .dot.is-active { width: 1.25rem; }

      .info-panel {
        grid-template-columns:
          5.6rem
          minmax(14rem, 1.35fr)
          minmax(12rem, 0.95fr)
          minmax(11rem, 0.85fr);
        grid-template-rows: auto;
        gap: 1.1rem 1.35rem;
        align-items: center;
        padding: 1.15rem 1.35rem 1.2rem;
        border-radius: 22px;
        margin: 0;
      }
      .info-thumb {
        grid-row: auto;
        width: 5.6rem;
        aspect-ratio: 1;
        border-radius: 12px;
      }
      .info-thumb img { object-position: center 18%; }
      .info-badge {
        font-size: 0.52rem;
        padding: 0.22rem 0.3rem;
      }
      .info-identity { gap: 0.5rem; }
      .info-title { font-size: 1.7rem; }
      .info-sub { font-size: 0.9rem; }
      .info-desc {
        -webkit-line-clamp: 2;
        font-size: 0.78rem;
        max-width: 28rem;
      }
      .fav-toggle { display: none; }
      .info-stats {
        grid-column: auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.55rem 1.1rem;
        padding: 0.2rem 0.4rem;
        border-left: 1px solid rgba(255, 255, 255, 0.12);
        border-right: 1px solid rgba(255, 255, 255, 0.12);
      }
      .info-stats li {
        grid-template-columns: 1.1rem minmax(0, 1fr);
        gap: 0.5rem;
        font-size: 0.78rem;
      }
      .info-stats i { font-size: 0.78rem; }
      .info-stats .stat-kicker {
        display: block;
        font-size: 0.68rem;
        opacity: 0.65;
        margin-bottom: 0.08rem;
      }
      .info-stats .stat-kicker::after { content: none; }
      .info-actions {
        display: grid;
        gap: 0.55rem;
      }
      .info-actions .btn-skew {
        width: 100%;
        min-height: 3.35rem;
        transform: none;
        border-radius: 12px;
      }
      .info-actions .btn-skew > * { transform: none; }
      .info-actions .btn-skew:active { transform: scale(0.98); }
      .info-actions .btn-start {
        flex-direction: row;
        justify-content: space-between;
        padding: 0.7rem 1.1rem;
        gap: 0.5rem;
      }
      .info-actions .btn-start-main {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.1rem;
        font-size: 1rem;
      }
      .info-actions .btn-start-sub {
        font-size: 0.62rem;
        letter-spacing: 0.14em;
      }
      .info-actions .btn-edit {
        min-height: 2.55rem;
        font-size: 0.88rem;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow: none;
      }
      .info-more { display: none; }

      .actions-mobile { display: none; }
      .bottom-nav { display: none; }

      .desk-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin: 0 -2.4rem;
        padding: 0.7rem 2.4rem;
        background: linear-gradient(180deg, #2a2150 0%, #1c1638 100%);
        color: rgba(235, 230, 255, 0.78);
        font-size: 0.78rem;
        font-weight: 600;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 -8px 24px rgba(20, 10, 40, 0.18);
      }
      .desk-footer-help,
      .desk-footer-keys {
        display: inline-flex;
        align-items: center;
        gap: 0.85rem;
        flex-wrap: wrap;
      }
      .desk-footer-help {
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        gap: 0.45rem;
        padding: 0.2rem 0.35rem;
        border-radius: 8px;
        transition: background 0.2s ease, color 0.2s ease;
      }
      .desk-footer-help:hover {
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
      }
      .desk-footer-help i {
        width: 1.35rem;
        height: 1.35rem;
        border-radius: 50%;
        border: 1.5px solid rgba(255, 255, 255, 0.35);
        display: grid;
        place-items: center;
        font-size: 0.72rem;
      }
      .kbd {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
      }
      .kbd kbd {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 1.55rem;
        height: 1.45rem;
        padding: 0 0.4rem;
        border-radius: 5px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        background: rgba(255, 255, 255, 0.08);
        font-family: var(--font-display);
        font-size: 0.72rem;
        font-weight: 700;
        color: #fff;
      }

      .toast { bottom: 4.2rem; }
    }

    @media (min-width: 900px) and (max-width: 1100px) {
      .app { padding-inline: 1.25rem; }
      .desk-footer { margin-inline: -1.25rem; padding-inline: 1.25rem; }
      .info-panel {
        grid-template-columns: 5rem minmax(0, 1.2fr) minmax(0, 1fr) minmax(10rem, 0.8fr);
        gap: 0.85rem;
      }
      .search { width: min(13rem, 22vw); }
      .page-title { font-size: 1.35rem; }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="stage-fx" aria-hidden="true"></div>
    <div class="app">
      <header class="topbar">
        <div class="brand-cluster">
          <a class="ws-logo" href="deck-select.html" aria-label="Weiss Schwarz">
            <svg class="ws-logo-mark" viewBox="0 0 64 64" aria-hidden="true">
              <defs>
                <linearGradient id="wsGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#2e2e2e"/>
                  <stop offset="100%" stop-color="#0e0e0e"/>
                </linearGradient>
              </defs>
              <path fill="url(#wsGrad)" stroke="#fff" stroke-width="2.4" d="M32 3.5 L55 14.2 V34.5 C55 49 42.5 56.5 32 60.5 C21.5 56.5 9 49 9 34.5 V14.2 Z"/>
              <text x="32" y="27" text-anchor="middle" fill="#fff" font-family="Outfit,sans-serif" font-size="8.5" font-weight="800" letter-spacing="0.8">WEISS</text>
              <text x="32" y="39" text-anchor="middle" fill="#fff" font-family="Outfit,sans-serif" font-size="7.5" font-weight="700" letter-spacing="0.3">SCHWARZ</text>
              <path fill="#ff5fad" d="M17 10.5l1.1 2.2 2.4.35-1.75 1.7.42 2.35-2.17-1.15-2.17 1.15.42-2.35-1.75-1.7 2.4-.35z"/>
              <path fill="#ff5fad" d="M47 10.5l1.1 2.2 2.4.35-1.75 1.7.42 2.35-2.17-1.15-2.17 1.15.42-2.35-1.75-1.7 2.4-.35z"/>
            </svg>
          </a>
          <div class="brand-copy">
            <h1 class="page-title">DECK SELECT</h1>
            <p class="page-lede">Choose your deck.</p>
          </div>
        </div>
        <button type="button" class="menu-btn" id="menuBtn" aria-label="選單">
          <i aria-hidden="true"></i>
        </button>
        <section class="filters" aria-label="搜尋與篩選">
          <label class="search">
            <i class="fas fa-search" aria-hidden="true"></i>
            <input id="searchInput" type="search" placeholder="搜尋牌組名稱..." autocomplete="off" aria-label="搜尋牌組名稱">
          </label>
          <div class="chip-row" role="toolbar" aria-label="篩選與排序">
            <button type="button" class="chip is-active" data-filter="all" aria-pressed="true">
              全部
              <i class="fas fa-caret-down chev" aria-hidden="true"></i>
            </button>
            <button type="button" class="chip is-desk-only" data-filter="ws" aria-pressed="false">WS</button>
            <button type="button" class="chip is-desk-only" data-filter="wsr" aria-pressed="false">WSR</button>
            <button type="button" class="chip" data-filter="fav" aria-pressed="false">
              <i class="fas fa-star" aria-hidden="true"></i>
              我的最愛
            </button>
            <button type="button" class="chip" data-sort="newest" aria-pressed="false">
              <i class="fas fa-sort" aria-hidden="true"></i>
              最新建立
            </button>
          </div>
        </section>
      </header>

      <aside class="deck-status is-loading" id="deckStatus" hidden>
        <div class="deck-status-spinner" aria-hidden="true"></div>
        <p class="deck-status-kicker" id="deckStatusKicker">DECKS</p>
        <h2 class="deck-status-title" id="deckStatusTitle">正在載入牌組</h2>
        <p class="deck-status-text" id="deckStatusText">同步雲端資料中，請稍候…</p>
        <div class="deck-status-actions">
          <button type="button" class="deck-status-btn is-primary" id="deckStatusPrimary">
            <i class="fas fa-sign-in-alt" aria-hidden="true"></i>
            <span id="deckStatusPrimaryLabel">登入我的牌組</span>
          </button>
          <a class="deck-status-btn is-secondary" id="deckStatusSecondary" href="decks.html">
            前往完整牌組頁
          </a>
        </div>
      </aside>

      <section class="carousel-wrap" aria-label="牌組輪播">
        <div class="carousel" id="carousel">
          <div class="carousel-track" id="carouselTrack"></div>
          <button type="button" class="carousel-nav prev" id="prevBtn" aria-label="上一副">
            <i class="fas fa-chevron-left" aria-hidden="true"></i>
          </button>
          <button type="button" class="carousel-nav next" id="nextBtn" aria-label="下一副">
            <i class="fas fa-chevron-right" aria-hidden="true"></i>
          </button>
        </div>
        <div class="dots" id="dots" role="tablist" aria-label="牌組位置"></div>
      </section>

      <article class="info-panel" id="infoPanel" aria-live="polite">
        <div class="info-thumb">
          <img id="infoThumb" src="" alt="">
          <span class="info-badge" id="infoBadge" hidden><i class="fas fa-trophy" aria-hidden="true"></i> COMPETITIVE</span>
        </div>
        <div class="info-identity">
          <div class="info-head">
            <div>
              <h2 class="info-title" id="infoTitle">—</h2>
              <p class="info-sub" id="infoSub"></p>
            </div>
            <button type="button" class="fav-toggle" id="favToggle" aria-label="加入最愛" aria-pressed="false">
              <i class="far fa-star" aria-hidden="true"></i>
            </button>
          </div>
          <div class="tag-row" id="infoTags"></div>
          <p class="info-desc" id="infoDesc"></p>
        </div>

          <span class="kbd"><kbd>←</kbd><kbd>→</kbd> 選擇牌組</span>

  <script src="assets/js/ws-collection-store.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/ws-firebase.js"></script>
  <script>
    (function () {
      var Store = window.WsCollectionStore || {};
      var DECKS_KEY = Store.DECKS_KEY || 'wsCardsDecks';
      var FAV_KEY = 'wsDeckSelectFavorites';
      var fb = window.WsFirebase || null;

      var allDecks = [];
      var deckCloudUser = null;
      var deckAuthResolved = false;
      var deckSyncing = false;
      var favoriteIds = Object.create(null);

      var state = {
        index: 0,
        filter: 'all',
        sort: 'newest',
        query: '',
        list: []
      };

      var track = document.getElementById('carouselTrack');
      var dotsEl = document.getElementById('dots');
      var toastEl = document.getElementById('toast');
      var toastTimer = null;
      var mqDesk = window.matchMedia('(min-width: 900px)');

      var appEl = document.querySelector('.app');
      var statusEl = document.getElementById('deckStatus');
      var statusTitle = document.getElementById('deckStatusTitle');
      var statusText = document.getElementById('deckStatusText');
      var statusPrimary = document.getElementById('deckStatusPrimary');
      var statusPrimaryLabel = document.getElementById('deckStatusPrimaryLabel');
      var statusSecondary = document.getElementById('deckStatusSecondary');

      function showToast(msg) {
        if (!toastEl) return;
        toastEl.textContent = msg;
        toastEl.classList.add('is-on');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toastEl.classList.remove('is-on');
        }, 1800);
      }

      function readFavoriteIds() {
        try {
          var raw = localStorage.getItem(FAV_KEY);
          var list = raw ? JSON.parse(raw) : [];
          if (!Array.isArray(list)) return {};
          var map = Object.create(null);
          list.forEach(function (id) {
            id = String(id || '').trim();
            if (id) map[id] = true;
          });
          return map;
        } catch (e) {
          return {};
        }
      }

      function writeFavoriteIds() {
        try {
          localStorage.setItem(FAV_KEY, JSON.stringify(Object.keys(favoriteIds)));
        } catch (e) { /* ignore */ }
      }

      function normalizeText(v) {
        return String(v == null ? '' : v).trim();
      }

      function decksFirebaseReady() {
        return !!(fb && fb.ready && fb.firestoreReady && typeof fb.loadUserDecks === 'function');
      }

      function readLocalDecks() {
        try {
          var raw = localStorage.getItem(DECKS_KEY);
          var list = raw ? JSON.parse(raw) : [];
          return Array.isArray(list) ? list : [];
        } catch (e) {
          return [];
        }
      }

      function writeLocalDecks(list) {
        try {
          localStorage.setItem(DECKS_KEY, JSON.stringify(list || []));
        } catch (e) {
          console.error(e);
        }
      }

      function deckTotalCards(deck) {
        return ((deck && deck.cards) || []).reduce(function (sum, c) {
          var q = parseInt(c && c.qty, 10);
          return sum + (isNaN(q) || q < 1 ? 0 : q);
        }, 0);
      }

      function deckKindCount(deck) {
        return ((deck && deck.cards) || []).length;
      }

      function formatDotDate(ts) {
        if (!ts) return '—';
        var d = new Date(ts);
        if (isNaN(d.getTime())) return '—';
        var m = String(d.getMonth() + 1).padStart(2, '0');
        var day = String(d.getDate()).padStart(2, '0');
        return d.getFullYear() + '.' + m + '.' + day;
      }

      function buildCardImageUrls(cardNumberDisplay) {
        var cardNum = String(cardNumberDisplay || '').trim();
        if (cardNum.indexOf(' ') >= 0) cardNum = cardNum.substr(0, cardNum.indexOf(' '));
        if (!cardNum || cardNum.indexOf('-') < 0) return { primary: '', fallback: '' };
        var cardFirst = cardNum.substr(0, 1);
        var cardSecond = cardNum.substr(0, cardNum.indexOf('-')).replace('/', '_');
        var cardThird = cardNum.replace('/', '_').replace('-', '_');
        return {
          primary: 'https://imgs.devilfox.net/ws/' + cardSecond.toLowerCase() + '/' + cardThird.toLowerCase() + '.png',
          fallback: 'https://ws-tcg.com/wordpress/wp-content/images/cardlist/' +
            cardFirst.toLowerCase() + '/' + cardSecond.toLowerCase() + '/' + cardThird.toLowerCase() + '.png'
        };
      }

      function pickDeckCoverCard(deck) {
        var cards = (deck && deck.cards) || [];
        if (!cards.length) return null;
        var preferred = normalizeText(deck && deck.coverCardNumber).replace(/\\/g, '/');
        if (preferred) {
          for (var p = 0; p < cards.length; p++) {
            if (cards[p] && cards[p].cardNumber === preferred) return cards[p];
          }
        }
        var best = cards[0];
        var bestQty = best && best.qty ? best.qty : 0;
        for (var i = 1; i < cards.length; i++) {
          var q = cards[i] && cards[i].qty ? cards[i].qty : 0;
          if (q > bestQty) {
            best = cards[i];
            bestQty = q;
          }
        }
        return best && best.cardNumber ? best : cards[0];
      }

      function coverUrlsForDeck(deck) {
        var cover = pickDeckCoverCard(deck);
        if (!cover || !cover.cardNumber) return { primary: '', fallback: '' };
        return buildCardImageUrls(cover.cardNumber);
      }

      function inferBuild(tags) {
        for (var i = 0; i < tags.length; i++) {
          if (/扉|門|軸|控|速攻|燃燒|墓地|倒數/.test(tags[i])) return tags[i];
        }
        return '—';
      }

      function inferCompetitive(tags) {
        return tags.some(function (t) { return /競技|對戰|比賽|競技向け/.test(t); });
      }

      function inferTagLabel(tags, competitive) {
        for (var i = 0; i < tags.length; i++) {
          if (/競技|休閒|娛樂|對戰/.test(tags[i])) return tags[i];
        }
        return competitive ? '競技向け' : (tags[0] || '一般');
      }

      function seriesCodeFromDeck(deck) {
        var cover = pickDeckCoverCard(deck);
        var no = cover && cover.cardNumber ? String(cover.cardNumber) : '';
        if (!no) return '';
        var slash = no.indexOf('/');
        var dash = no.indexOf('-');
        if (slash < 0 || dash < 0) return '';
        return no.slice(0, dash);
      }

      function toViewModel(deck) {
        var tags = Array.isArray(deck.tags) ? deck.tags.map(normalizeText).filter(Boolean) : [];
        var total = deckTotalCards(deck);
        var kinds = deckKindCount(deck);
        var competitive = inferCompetitive(tags);
        var urls = coverUrlsForDeck(deck);
        var series = seriesCodeFromDeck(deck);
        var build = inferBuild(tags);
        var subtitleParts = [];
        if (tags[0] && tags[0] !== build) subtitleParts.push(tags[0]);
        if (build !== '—') subtitleParts.push(build + ( /扉|門/.test(build) ? '' : '' ));
        if (!subtitleParts.length) subtitleParts.push(kinds + ' 種 · ' + total + ' 張');
        return {
          id: deck.id,
          title: normalizeText(deck.name) || '未命名牌組',
          subtitle: subtitleParts.join(' / '),
          work: tags.find(function (t) { return !/競技|休閒|扉|門|軸/.test(t); }) || series || '—',
          build: build,
          created: formatDotDate(deck.createdAt),
          winRate: '—',
          winNote: '尚無對戰資料',
          cards: total,
          kinds: kinds,
          competitive: competitive,
          favorite: !!favoriteIds[deck.id],
          tag: inferTagLabel(tags, competitive),
          game: 'WS',
          desc: normalizeText(deck.deckDescription) || '尚未填寫牌組說明。',
          cover: urls.primary,
          coverFallback: urls.fallback,
          createdAt: deck.createdAt || 0,
          updatedAt: deck.updatedAt || deck.createdAt || 0,
          raw: deck
        };
      }

      function bindImgFallback(img, fallback) {
        if (!img) return;
        img.onerror = function () {
          if (fallback && img.getAttribute('data-tried-fallback') !== '1') {
            img.setAttribute('data-tried-fallback', '1');
            img.src = fallback;
            return;
          }
          img.style.opacity = '0.35';
          img.onerror = null;
        };
      }

      function setStatusMode(mode) {
        if (!statusEl || !appEl) return;
        var isEmptyMode = mode === 'loading' || mode === 'guest' || mode === 'ready-empty' || mode === 'filtered' || mode === 'error';
        appEl.classList.toggle('is-empty', isEmptyMode);
        statusEl.hidden = !isEmptyMode;
        statusEl.classList.toggle('is-loading', mode === 'loading');
        if (mode === 'loading') {
          statusTitle.textContent = '正在載入牌組';
          statusText.textContent = '同步雲端資料中，請稍候…';
          statusPrimary.hidden = true;
          statusSecondary.hidden = true;
        } else if (mode === 'guest') {
          statusTitle.textContent = '登入後查看你的牌組';
          statusText.textContent = '牌組資料存放在雲端，登入後即可在此挑選並使用。';
          statusPrimary.hidden = false;
          statusPrimaryLabel.textContent = '登入我的牌組';
          statusSecondary.hidden = false;
          statusSecondary.textContent = '前往完整牌組頁';
          statusSecondary.setAttribute('href', 'decks.html');
        } else if (mode === 'ready-empty') {
          statusTitle.textContent = '尚未建立牌組';
          statusText.textContent = '先到完整牌組頁建立或匯入 DeckLog，再回來這裡選擇。';
          statusPrimary.hidden = true;
          statusSecondary.hidden = false;
          statusSecondary.textContent = '前往建立牌組';
          statusSecondary.setAttribute('href', 'decks.html');
        } else if (mode === 'filtered') {
          statusTitle.textContent = '沒有符合的牌組';
          statusText.textContent = '調整搜尋或篩選條件再試試。';
          statusPrimary.hidden = true;
          statusSecondary.hidden = true;
        } else if (mode === 'error') {
          statusTitle.textContent = '無法載入牌組';
          statusText.textContent = '雲端同步失敗，請稍後再試或改用完整牌組頁。';
          statusPrimary.hidden = false;
          statusPrimaryLabel.textContent = '重新載入';
          statusSecondary.hidden = false;
          statusSecondary.textContent = '前往完整牌組頁';
          statusSecondary.setAttribute('href', 'decks.html');
        } else {
          appEl.classList.remove('is-empty');
          statusEl.hidden = true;
        }
      }

      function getVisible() {
        var list = allDecks.map(toViewModel);
        if (state.filter === 'fav') {
          list = list.filter(function (d) { return d.favorite; });
        } else if (state.filter === 'ws') {
          list = list.filter(function (d) { return d.game === 'WS'; });
        } else if (state.filter === 'wsr') {
          list = list.filter(function () { return false; });
        }
        if (state.query) {
          var q = state.query.toLowerCase();
          list = list.filter(function (d) {
            return (d.title + ' ' + d.subtitle + ' ' + d.work + ' ' + d.tag + ' ' + d.desc + ' ' + d.game)
              .toLowerCase()
              .indexOf(q) >= 0;
          });
        }
        if (state.sort === 'newest') {
          list.sort(function (a, b) {
            return (b.updatedAt || b.createdAt) - (a.updatedAt || a.createdAt);
          });
        } else if (state.sort === 'name') {
          list.sort(function (a, b) { return a.title.localeCompare(b.title, 'zh-Hant'); });
        }
        return list;
      }

      function clampIndex() {
        if (!state.list.length) {
          state.index = 0;
          return;
        }
        if (state.index >= state.list.length) state.index = state.list.length - 1;
        if (state.index < 0) state.index = 0;
      }

      function currentDeck() {
        return state.list[state.index] || null;
      }

      function wrapOffset(offset, len) {
        if (len <= 1) return offset;
        var half = Math.floor(len / 2);
        var o = ((offset % len) + len) % len;
        if (o > half) o -= len;
        return o;
      }

      function slideTransform(offset) {
        var abs = Math.abs(offset);
        var desk = mqDesk.matches;
        var maxSide = desk ? 3 : 2;
        if (abs > maxSide) {
          return { transform: 'translate(-50%, -50%) scale(0.3)', opacity: 0, z: 0, filter: 'blur(2px)' };
        }
        var x = offset * (desk ? 58 : 78);
        var z = -Math.abs(offset) * (desk ? 175 : 155);
        var rot = offset * (desk ? -34 : -42);
        var scale = offset === 0
          ? (desk ? 1.14 : 1.08)
          : (desk ? (0.9 - (abs - 1) * 0.07) : (0.84 - (abs - 1) * 0.08));
        var opacity = offset === 0 ? 1 : (0.92 - abs * 0.12);
        var blur = abs === 0 ? 'none' : ('blur(' + (abs * 0.28) + 'px)');
        return {
          transform: 'translate(-50%, -50%) translateX(' + x + '%) translateZ(' + z + 'px) rotateY(' + rot + 'deg) scale(' + scale + ')',
          opacity: Math.max(0.28, opacity),
          z: 10 - abs,
          filter: blur
        };
      }

      function renderCarousel() {
        state.list = getVisible();
        clampIndex();
        var html = '';
        state.list.forEach(function (deck, i) {
          html += '<button type="button" class="deck-slide' +
            (i === state.index ? ' is-active' : '') +
            (deck.favorite ? ' is-fav' : '') +
            '" data-index="' + i + '" aria-label="' + deck.title + '"' +
            (i === state.index ? ' aria-current="true"' : '') + '>';
          html += '<span class="deck-slide-inner">';
          html += '<img src="' + (deck.cover || '') + '" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer"' +
            (deck.coverFallback ? ' data-fallback="' + deck.coverFallback.replace(/"/g, '&quot;') + '"' : '') + '>';
          html += '<span class="deck-fav' + (deck.favorite ? ' is-on' : '') + '" aria-hidden="true"><i class="fas fa-star"></i></span>';
          html += '</span></button>';
        });
        track.innerHTML = html || '';

        Array.prototype.forEach.call(track.querySelectorAll('.deck-slide'), function (el) {
          var i = Number(el.getAttribute('data-index'));
          var offset = wrapOffset(i - state.index, state.list.length);
          var t = slideTransform(offset);
          el.style.transform = t.transform;
          el.style.opacity = String(t.opacity);
          el.style.zIndex = String(t.z);
          el.style.filter = t.filter;
          var img = el.querySelector('img');
          if (img) bindImgFallback(img, img.getAttribute('data-fallback') || '');
          el.addEventListener('click', function () {
            if (i === state.index) return;
            state.index = i;
            renderAll();
          });
        });

        var dotsHtml = '';
        state.list.forEach(function (_, i) {
          dotsHtml += '<button type="button" class="dot' + (i === state.index ? ' is-active' : '') +
            '" data-index="' + i + '" aria-label="第 ' + (i + 1) + ' 副"' +
            (i === state.index ? ' aria-current="true"' : '') + '></button>';
        });
        dotsEl.innerHTML = dotsHtml;
        Array.prototype.forEach.call(dotsEl.querySelectorAll('.dot'), function (dot) {
          dot.addEventListener('click', function () {
            state.index = Number(dot.getAttribute('data-index'));
            renderAll();
          });
        });
      }

      function renderInfo() {
        var deck = currentDeck();
        var thumb = document.getElementById('infoThumb');
        var badge = document.getElementById('infoBadge');
        var title = document.getElementById('infoTitle');
        var sub = document.getElementById('infoSub');
        var tags = document.getElementById('infoTags');
        var stats = document.getElementById('infoStats');
        var desc = document.getElementById('infoDesc');
        var fav = document.getElementById('favToggle');

        if (!deck) {
          title.textContent = '沒有牌組';
          sub.textContent = '調整搜尋或篩選條件試試';
          thumb.removeAttribute('src');
          badge.hidden = true;
          tags.innerHTML = '';
          stats.innerHTML = '';
          desc.textContent = '';
          return;
        }

        thumb.removeAttribute('data-tried-fallback');
        if (deck.cover) {
          thumb.src = deck.cover;
          bindImgFallback(thumb, deck.coverFallback || '');
        } else {
          thumb.removeAttribute('src');
        }
        thumb.alt = deck.title;
        badge.hidden = !deck.competitive;
        title.textContent = deck.title;
        sub.textContent = deck.subtitle;
        tags.innerHTML =
          '<span class="tag ' + (deck.competitive ? 'is-comp' : 'is-muted') + '">' +
            (deck.competitive ? '<i class="fas fa-trophy" aria-hidden="true"></i>' : '') +
            deck.tag + '</span>' +
          '<span class="tag is-muted"><i class="fas fa-users" aria-hidden="true"></i>' + deck.cards + ' 張</span>' +
          '<span class="tag is-muted">' + deck.game + '</span>';
        stats.innerHTML =
          '<li><i class="fas fa-crown" aria-hidden="true"></i><span><span class="stat-kicker">勝率</span><strong>' + deck.winRate + '</strong> <span class="stat-label">(' + deck.winNote + ')</span></span></li>' +
          '<li><i class="far fa-calendar" aria-hidden="true"></i><span><span class="stat-kicker">建立日期</span><strong>' + deck.created + '</strong></span></li>' +
          '<li><i class="fas fa-book" aria-hidden="true"></i><span><span class="stat-kicker">作品</span><strong>' + deck.work + '</strong></span></li>' +
          '<li><i class="fas fa-layer-group" aria-hidden="true"></i><span><span class="stat-kicker">構築類型</span><strong>' + deck.build + '</strong></span></li>';
        desc.textContent = deck.desc;
        fav.classList.toggle('is-on', !!deck.favorite);
        fav.setAttribute('aria-pressed', deck.favorite ? 'true' : 'false');
        fav.innerHTML = deck.favorite
          ? '<i class="fas fa-star" aria-hidden="true"></i>'
          : '<i class="far fa-star" aria-hidden="true"></i>';
      }

      function renderAll() {
        state.list = getVisible();
        if (!deckAuthResolved) {
          setStatusMode('loading');
          renderCarousel();
          renderInfo();
          return;
        }
        if (!deckCloudUser) {
          setStatusMode('guest');
          renderCarousel();
          renderInfo();
          return;
        }
        if (!allDecks.length) {
          setStatusMode('ready-empty');
          renderCarousel();
          renderInfo();
          return;
        }
        if (!state.list.length) {
          setStatusMode('filtered');
          renderCarousel();
          renderInfo();
          return;
        }
        setStatusMode('ready');
        clampIndex();
        renderCarousel();
        renderInfo();
      }

      function go(delta) {
        if (!state.list.length) return;
        state.index = (state.index + delta + state.list.length) % state.list.length;
        renderAll();
      }

      function syncFilterChips() {
        Array.prototype.forEach.call(document.querySelectorAll('[data-filter]'), function (c) {
          var f = c.getAttribute('data-filter');
          var on = f === state.filter;
          c.classList.toggle('is-active', on);
          c.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
      }

      function onEdit() {
        var deck = currentDeck();
        if (!deck) {
          showToast('沒有可編輯的牌組');
          return;
        }
        window.location.href = 'decks.html?deck=' + encodeURIComponent(deck.id);
      }
      function onStart() {
        var deck = currentDeck();
        showToast(deck ? ('準備使用「' + deck.title + '」開始對戰') : '請先選擇牌組');
      }

      function applyCloudDecks(list) {
        allDecks = Array.isArray(list) ? list.filter(function (d) { return d && d.id; }) : [];
        writeLocalDecks(allDecks);
        renderAll();
      }

      function migrateLocalDecksIfCloudEmpty(cloudList) {
        var cloud = Array.isArray(cloudList) ? cloudList : [];
        if (cloud.length) return Promise.resolve(cloud);
        var local = readLocalDecks();
        if (!local.length || !decksFirebaseReady()) return Promise.resolve([]);
        showToast('正在將本機牌組上傳到雲端…');
        return Promise.all(local.map(function (d) {
          return fb.saveUserDeck(d);
        })).then(function () {
          return fb.loadUserDecks();
        });
      }

      function refreshDecksFromCloud() {
        if (!decksFirebaseReady() || !deckCloudUser) {
          allDecks = [];
          renderAll();
          return Promise.resolve([]);
        }
        if (deckSyncing) return Promise.resolve(allDecks);
        deckSyncing = true;
        return fb.loadUserDecks()
          .then(function (cloud) {
            return migrateLocalDecksIfCloudEmpty(cloud);
          })
          .then(function (list) {
            applyCloudDecks(list);
            return allDecks;
          })
          .catch(function (err) {
            console.error(err);
            setStatusMode('error');
            showToast((err && err.message) || '牌組雲端同步失敗');
            return allDecks;
          })
          .then(function (list) {
            deckSyncing = false;
            return list;
          });
      }

      function waitFirebaseAuthReady() {
        if (fb && fb.auth && typeof fb.auth.authStateReady === 'function') {
          return fb.auth.authStateReady();
        }
        return new Promise(function (resolve) {
          if (!(fb && typeof fb.onAuth === 'function')) {
            resolve();
            return;
          }
          var settled = false;
          var unsub = fb.onAuth(function () {
            if (settled) return;
            settled = true;
            if (typeof unsub === 'function') {
              try { unsub(); } catch (e) { /* ignore */ }
            }
            resolve();
          });
        });
      }

      function signInAndLoad() {
        if (!decksFirebaseReady()) {
          showToast((fb && fb.reason) || 'Firebase 尚未就緒');
          return;
        }
        var user = fb.currentUser && fb.currentUser();
        var p = user
          ? Promise.resolve(user)
          : fb.signInWithGoogle().then(function (cred) {
              return (cred && cred.user) || (fb.currentUser && fb.currentUser());
            });
        setStatusMode('loading');
        p.then(function (signed) {
          if (!signed) throw new Error('登入失敗');
          deckCloudUser = signed;
          var profileP = typeof fb.ensureUserProfile === 'function'
            ? fb.ensureUserProfile()
            : Promise.resolve(null);
          return profileP.then(function () {
            return refreshDecksFromCloud();
          });
        }).catch(function (err) {
          console.error(err);
          showToast((err && err.message) || '登入失敗');
          deckAuthResolved = true;
          renderAll();
        });
      }

      function bootstrapDecks() {
        favoriteIds = readFavoriteIds();
        setStatusMode('loading');
        if (!(fb && typeof fb.onAuth === 'function')) {
          deckAuthResolved = true;
          deckCloudUser = null;
          allDecks = [];
          setStatusMode('error');
          statusText.textContent = (fb && fb.reason) || 'Firebase 未載入，請改用完整牌組頁。';
          return;
        }
        waitFirebaseAuthReady().then(function () {
          var user = fb.currentUser && fb.currentUser();
          deckCloudUser = user || null;
          deckAuthResolved = true;
          if (!user) {
            allDecks = [];
            renderAll();
            return null;
          }
          setStatusMode('loading');
          return refreshDecksFromCloud().then(function (list) {
            if (list && list.length) {
              showToast('已同步雲端牌組 ' + list.length + ' 副');
            }
          });
        }).catch(function (err) {
          console.error(err);
          deckAuthResolved = true;
          deckCloudUser = null;
          allDecks = [];
          setStatusMode('error');
        });

        fb.onAuth(function (user) {
          if (!deckAuthResolved) return;
          deckCloudUser = user || null;
          if (!user) {
            allDecks = [];
            renderAll();
            return;
          }
          refreshDecksFromCloud().then(function (list) {
            if (list && list.length) {
              showToast('已同步雲端牌組 ' + list.length + ' 副');
            }
          });
        });
      }

      document.getElementById('prevBtn').addEventListener('click', function () { go(-1); });
      document.getElementById('nextBtn').addEventListener('click', function () { go(1); });
      document.getElementById('editBtn').addEventListener('click', onEdit);
      document.getElementById('startBtn').addEventListener('click', onStart);
      document.getElementById('editBtnDesk').addEventListener('click', onEdit);
      document.getElementById('startBtnDesk').addEventListener('click', onStart);

      document.getElementById('favToggle').addEventListener('click', function () {
        var deck = currentDeck();
        if (!deck) return;
        if (favoriteIds[deck.id]) delete favoriteIds[deck.id];
        else favoriteIds[deck.id] = true;
        writeFavoriteIds();
        showToast(favoriteIds[deck.id] ? '已加入我的最愛' : '已從最愛移除');
        renderAll();
      });

      document.getElementById('infoMore').addEventListener('click', function () {
        var deck = currentDeck();
        if (!deck) return;
        window.location.href = 'decks.html?deck=' + encodeURIComponent(deck.id);
      });
      document.getElementById('menuBtn').addEventListener('click', function () {
        window.location.href = 'decks.html';
      });
      document.getElementById('helpBtn').addEventListener('click', function () {
        showToast('← → 選牌組 · Enter 使用 · Esc 返回');
      });
      statusPrimary.addEventListener('click', function () {
        if (!deckCloudUser) signInAndLoad();
        else refreshDecksFromCloud();
      });

      Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (chip) {
        chip.addEventListener('click', function () {
          if (chip.hasAttribute('data-filter')) {
            var f = chip.getAttribute('data-filter');
            if (f === 'fav' && state.filter === 'fav') state.filter = 'all';
            else state.filter = f;
            syncFilterChips();
            state.index = 0;
            renderAll();
            return;
          }
          if (chip.hasAttribute('data-sort')) {
            state.sort = state.sort === 'newest' ? 'name' : 'newest';
            chip.innerHTML = state.sort === 'newest'
              ? '<i class="fas fa-sort" aria-hidden="true"></i>最新建立'
              : '<i class="fas fa-sort-alpha-down" aria-hidden="true"></i>名稱 A→Z';
            state.index = 0;
            renderAll();
          }
        });
      });

      var searchInput = document.getElementById('searchInput');
      var searchTimer = null;
      searchInput.addEventListener('input', function () {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(function () {
          state.query = searchInput.value.trim();
          state.index = 0;
          renderAll();
        }, 160);
      });

      var startX = 0;
      var startY = 0;
      var dragging = false;
      var activePointer = null;
      track.addEventListener('pointerdown', function (e) {
        if (e.button && e.button !== 0) return;
        dragging = true;
        activePointer = e.pointerId;
        startX = e.clientX;
        startY = e.clientY;
        try { track.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      });
      track.addEventListener('pointerup', function (e) {
        if (!dragging || activePointer !== e.pointerId) return;
        dragging = false;
        activePointer = null;
        var dx = e.clientX - startX;
        var dy = e.clientY - startY;
        if (Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy) * 1.2) {
          go(dx < 0 ? 1 : -1);
        }
      });
      track.addEventListener('pointercancel', function () {
        dragging = false;
        activePointer = null;
      });

      document.addEventListener('keydown', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
        if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
        if (e.key === 'Enter') { e.preventDefault(); onStart(); }
        if (e.key === 'Escape') {
          showToast('返回（示意）');
        }
      });

      if (mqDesk.addEventListener) {
        mqDesk.addEventListener('change', function () { renderCarousel(); });
      } else if (mqDesk.addListener) {
        mqDesk.addListener(function () { renderCarousel(); });
      }

      bootstrapDecks();
    })();
  </script>
</body>
</html>
