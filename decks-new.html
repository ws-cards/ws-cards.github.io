      }

      function sortChipLabel(mode) {
        if (mode === 'name') {
          return '<i class="fas fa-sort-alpha-down" aria-hidden="true"></i>' +
            '<span class="chip-label-short">名稱</span>' +
            '<span class="chip-label-full">名稱 A→Z</span>';
        }
        if (mode === 'cardsDesc') {
          return '<i class="fas fa-layer-group" aria-hidden="true"></i>' +
            '<span class="chip-label-short">張數</span>' +
            '<span class="chip-label-full">張數多→少</span>';
        }
        return '<i class="fas fa-sort" aria-hidden="true"></i>' +
          '<span class="chip-label-short">更新</span>' +
          '<span class="chip-label-full">最近更新</span>';
      }

      function syncSortChip() {
        var sortChip = document.getElementById('sortChip') || document.querySelector('[data-sort]');
        if (!sortChip) return;
        sortChip.setAttribute('data-sort', state.sort);
        sortChip.setAttribute('aria-pressed', state.sort !== 'newest' ? 'true' : 'false');
        sortChip.classList.toggle('is-active', state.sort !== 'newest');
        sortChip.innerHTML = sortChipLabel(state.sort);
      }

      function nextSortMode(mode) {
        if (mode === 'newest') return 'name';
        if (mode === 'name') return 'cardsDesc';
        return 'newest';
      }

      function clearFiltersAndSearch() {
        state.filter = 'all';
        state.sort = 'newest';
        state.query = '';
        state.index = 0;
        var input = document.getElementById('searchInput');
        if (input) input.value = '';
        syncFilterChips();
        syncSortChip();
        showToast('已清除搜尋與篩選');
        renderAll();
      }

      function goDecksWithIntent(intent) {
        var url = 'decks.html';
        if (intent === 'decklog') url += '?open=decklog';
        else if (intent === 'create') url += '?open=create';
        window.location.href = url;
      }

      function getVisible() {
        var list = allDecks.map(toViewModel);
        if (state.filter === 'fav') {
          list = list.filter(function (d) { return d.favorite; });
        } else if (state.filter === 'ws') {
          list = list.filter(function (d) { return d.tcg === 'ws'; });
        } else if (state.filter === 'wsr') {
          list = list.filter(function (d) { return d.tcg === 'wsr'; });
        }
        if (state.query) {
          list = list.filter(function (d) {
            return deckMatchesQuery(d.raw, state.query);
          });
        }
        if (state.sort === 'name') {
          list.sort(function (a, b) { return a.title.localeCompare(b.title, 'zh-Hant'); });
        } else if (state.sort === 'cardsDesc') {
          list.sort(function (a, b) {
            return (b.cards - a.cards) || a.title.localeCompare(b.title, 'zh-Hant');
          });
        } else {
          list.sort(function (a, b) {
            return (b.updatedAt || 0) - (a.updatedAt || 0) ||
              (b.createdAt || 0) - (a.createdAt || 0);
          });
        }
        return list;
      }

      function clampIndex() {
        if (!state.list.length) {
          state.index = 0;
          return;
        }
        if (state.index >= state.list.length) state.index = state.list.length - 1;
        if (state.index < 0) state.index = 0;
      }

      function currentDeck() {
        return state.list[state.index] || null;
      }

      function wrapOffset(offset, len) {
        if (len <= 1) return offset;
        var half = Math.floor(len / 2);
        var o = ((offset % len) + len) % len;
        if (o > half) o -= len;
        return o;
      }

      function carouselMaxSide() {
        // 圓環可見弧：中心 + 左右各 2
        return mqDesk.matches ? 2 : 2;
      }

      /** 圓柱半徑（px）：依軌道寬度，讓側卡圍成圓環 */
      function ringRadiusPx() {
        var w = (track && track.getBoundingClientRect().width) || 320;
        return mqDesk.matches ? Math.max(320, w * 0.42) : Math.max(220, w * 0.62);
      }

      /** 每格對應圓心角（度）：約 36–38° 可見牌面又有明顯弧度 */
      function ringStepDeg() {
        return mqDesk.matches ? 34 : 38;
      }

      function slideTransform(offset) {
        var abs = Math.abs(offset);
        var desk = mqDesk.matches;
        var maxSide = carouselMaxSide();
        if (abs > maxSide + 0.02) {
          return {
            transform: 'translate(-50%, -50%) translate3d(0,0,-520px) scale(0.18)',
            opacity: 0,
            z: 0,
            filter: 'blur(2px)',
            near: false,
            active: false
          };
        }

        // 圓柱座標：正前方 offset=0，左右沿圓環後退並朝向圓心
        var step = ringStepDeg();
        var radius = ringRadiusPx();
        var angleDeg = offset * step;
        var angleRad = angleDeg * Math.PI / 180;
        var x = Math.sin(angleRad) * radius;
        var z = (Math.cos(angleRad) - 1) * radius;
        // 整圈略向前推，讓中心卡更貼近鏡頭、側卡弧面更明顯
        var pop = desk ? 48 : 36;
        z += pop;
        var rot = -angleDeg;
        // 尺寸主要交給透視；只微調中心卡強調感
        var scale = abs < 0.001
          ? (desk ? 1.08 : 1.04)
          : Math.max(desk ? 0.82 : 0.78, 1 - abs * (desk ? 0.08 : 0.07));
        var opacity = abs < 0.001
          ? 1
          : Math.max(0.28, 1 - abs * (desk ? 0.22 : 0.28));
        var blur = abs < 0.35
          ? 'none'
          : ('blur(' + (Math.min(1.4, (abs - 0.35) * 0.55)) + 'px)');

        return {
          transform:
            'translate(-50%, -50%)' +
            ' translate3d(' + x.toFixed(2) + 'px, 0, ' + z.toFixed(2) + 'px)' +
            ' rotateY(' + rot.toFixed(2) + 'deg)' +
            ' scale(' + scale.toFixed(3) + ')',
          opacity: opacity,
          z: 40 + Math.round(z),
          filter: blur,
          near: abs > 0.35 && abs < 1.45,
          active: abs < 0.45
        };
      }

      function updateAtmosphere(deck) {
        if (!atmosphereEl) return;
        var url = deck && deck.cover ? deck.cover : '';
        if (!url) {
          atmosphereEl.classList.remove('is-on');
          atmosphereEl.style.backgroundImage = '';
          return;
        }
        atmosphereEl.style.backgroundImage = 'url(' + JSON.stringify(String(url)) + ')';
        atmosphereEl.classList.add('is-on');
      }

      function createSlideEl(deck, index) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'deck-slide' + (deck.favorite ? ' is-fav' : '');
        btn.setAttribute('data-index', String(index));
        btn.setAttribute('data-deck-id', deck.id);
        btn.setAttribute('aria-label', deck.title);
        var inner = document.createElement('span');
        inner.className = 'deck-slide-inner';
        var img = document.createElement('img');
        img.alt = '';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.referrerPolicy = 'no-referrer';
        if (deck.cover) img.src = deck.cover;
        if (deck.coverFallback) img.setAttribute('data-fallback', deck.coverFallback);
        bindImgFallback(img, deck.coverFallback || '');
        var fav = document.createElement('span');
        fav.className = 'deck-fav' + (deck.favorite ? ' is-on' : '');
        fav.setAttribute('aria-hidden', 'true');
        fav.innerHTML = '<i class="fas fa-star"></i>';
        inner.appendChild(img);
        inner.appendChild(fav);
        btn.appendChild(inner);
        btn.addEventListener('click', function () {
          if (dragMoved) return;
          var i = Number(btn.getAttribute('data-index'));
          if (i === state.index) {
            openDeckSheet('view');
            return;
          }
          dragFrac = 0;
          state.index = i;
          persistCarouselPosition();
          renderCarousel({ skipListRefresh: true });
          renderInfo();
        });
        return btn;
      }

      function applySlideTransforms() {
        var len = state.list.length;
        Array.prototype.forEach.call(track.querySelectorAll('.deck-slide'), function (el) {
          var i = Number(el.getAttribute('data-index'));
          if (!len || i < 0 || i >= len) return;
          var offset = wrapOffset(i - state.index, len) + dragFrac;
          var t = slideTransform(offset);
          el.style.transform = t.transform;
          el.style.opacity = String(t.opacity);
          el.style.zIndex = String(t.z);
          el.style.filter = t.filter;
          el.classList.toggle('is-active', !!t.active);
          el.classList.toggle('is-near', !!t.near);
          if (t.active) el.setAttribute('aria-current', 'true');
          else el.removeAttribute('aria-current');
        });
      }

      function renderDots() {
        var len = state.list.length;
        if (!len) {
          dotsEl.innerHTML = '';
          return;
        }
        if (len > DOTS_COMPACT_AT) {
          dotsEl.innerHTML = '<span class="dots-compact" aria-live="polite">' +
            (state.index + 1) + ' / ' + len + '</span>';
          return;
        }
        var html = '';
        for (var i = 0; i < len; i++) {
          html += '<button type="button" class="dot' + (i === state.index ? ' is-active' : '') +
            '" data-index="' + i + '" aria-label="第 ' + (i + 1) + ' 副"' +
            (i === state.index ? ' aria-current="true"' : '') + '></button>';
        }
        dotsEl.innerHTML = html;
        Array.prototype.forEach.call(dotsEl.querySelectorAll('.dot'), function (dot) {
          dot.addEventListener('click', function () {
            state.index = Number(dot.getAttribute('data-index'));
            dragFrac = 0;
            persistCarouselPosition();
            renderCarousel({ skipListRefresh: true });
            renderInfo();
          });
        });
      }

      function renderCarousel(opts) {
        opts = opts || {};
        if (!opts.skipListRefresh) {
          state.list = getVisible();
          restoreCarouselPositionIfNeeded();
        }
        clampIndex();
        var len = state.list.length;
        var maxSide = carouselMaxSide();
        var needed = Object.create(null);

        if (!len) {
          track.innerHTML = '';
          renderDots();
          updateAtmosphere(null);
          return;
        }

        for (var i = 0; i < len; i++) {
          var off = wrapOffset(i - state.index, len) + dragFrac;
          if (Math.abs(off) <= maxSide + 0.65) needed[i] = true;
        }

        Array.prototype.forEach.call(track.querySelectorAll('.deck-slide'), function (el) {
          var idx = Number(el.getAttribute('data-index'));
          var id = el.getAttribute('data-deck-id');
          var deck = state.list[idx];
          if (!needed[idx] || !deck || deck.id !== id) el.remove();
        });

        Object.keys(needed).forEach(function (key) {
          var idx = Number(key);
          var deck = state.list[idx];
          if (!deck) return;
          var existing = null;
          Array.prototype.forEach.call(track.querySelectorAll('.deck-slide'), function (el) {
            if (Number(el.getAttribute('data-index')) === idx &&
              el.getAttribute('data-deck-id') === deck.id) {
              existing = el;
            }
          });
          if (!existing) {
            track.appendChild(createSlideEl(deck, idx));
          } else {
            existing.classList.toggle('is-fav', !!deck.favorite);
            var favEl = existing.querySelector('.deck-fav');
            if (favEl) favEl.classList.toggle('is-on', !!deck.favorite);
          }
        });

        applySlideTransforms();
        if (!opts.transformsOnly) renderDots();
        if (!opts.transformsOnly) updateAtmosphere(currentDeck());
      }

      function renderInfo() {
        var deck = currentDeck();
        var thumb = document.getElementById('infoThumb');
        var badge = document.getElementById('infoBadge');
        var title = document.getElementById('infoTitle');
        var sub = document.getElementById('infoSub');
        var tags = document.getElementById('infoTags');
        var stats = document.getElementById('infoStats');
        var desc = document.getElementById('infoDesc');
        var fav = document.getElementById('favToggle');

        if (!deck) {
          title.textContent = '沒有牌組';
          sub.textContent = '調整搜尋或篩選條件試試';
          thumb.removeAttribute('src');
          badge.hidden = true;
          tags.innerHTML = '';
          stats.innerHTML = '';
          desc.textContent = '';
          return;
        }

        thumb.removeAttribute('data-tried-fallback');
        if (deck.cover) {
          thumb.src = deck.cover;
          bindImgFallback(thumb, deck.coverFallback || '');
        } else {
          thumb.removeAttribute('src');
        }
        thumb.alt = deck.title;
        badge.hidden = !deck.competitive;
        title.textContent = deck.title;
        sub.textContent = deck.subtitle;
        tags.innerHTML =
          '<span class="tag ' + (deck.competitive ? 'is-comp' : 'is-muted') + '">' +
            (deck.competitive ? '<i class="fas fa-trophy" aria-hidden="true"></i>' : '') +
            deck.tag + '</span>' +
          '<span class="tag is-muted"><i class="fas fa-users" aria-hidden="true"></i>' + deck.cards + ' 張</span>' +
          '<span class="tag is-muted">' + deck.game + '</span>';
        var winExtra = (deck.winRate && deck.winRate !== '—')
          ? ' <span class="stat-label">(' + deck.winNote + ')</span>'
          : '';
        // 手機對齊附圖：作品／建立日期／勝率；構築類型僅桌面顯示
        stats.innerHTML =
          '<li><i class="fas fa-book" aria-hidden="true"></i><span><span class="stat-kicker">作品</span><strong>' + deck.work + '</strong></span></li>' +
          '<li><i class="far fa-calendar" aria-hidden="true"></i><span><span class="stat-kicker">建立日期</span><strong>' + deck.created + '</strong></span></li>' +
          '<li><i class="fas fa-crown" aria-hidden="true"></i><span><span class="stat-kicker">勝率</span><strong>' + deck.winRate + '</strong>' + winExtra + '</span></li>' +
          '<li class="is-desk-stat"><i class="fas fa-layer-group" aria-hidden="true"></i><span><span class="stat-kicker">構築類型</span><strong>' + deck.build + '</strong></span></li>';
        desc.textContent = deck.desc;
        fav.classList.toggle('is-on', !!deck.favorite);
        fav.setAttribute('aria-pressed', deck.favorite ? 'true' : 'false');
        fav.innerHTML = deck.favorite
          ? '<i class="fas fa-star" aria-hidden="true"></i>'
          : '<i class="far fa-star" aria-hidden="true"></i>';
      }

      function renderAll() {
        state.list = getVisible();
        if (!deckAuthResolved) {
          setStatusMode('loading');
          renderCarousel();
          renderInfo();
          return;
        }
        if (!deckCloudUser) {
          setStatusMode('guest');
          renderCarousel();
          renderInfo();
          return;
        }
        if (!allDecks.length) {
          setStatusMode('ready-empty');
          renderCarousel();
          renderInfo();
          return;
        }
        if (!state.list.length) {
          setStatusMode('filtered');
          renderCarousel();
          renderInfo();
          return;
        }
        setStatusMode('ready');
        clampIndex();
        renderCarousel();
        renderInfo();
      }

      function go(delta) {
        if (!state.list.length) return;
        dragFrac = 0;
        if (carouselEl) carouselEl.classList.remove('is-dragging');
        state.index = (state.index + delta + state.list.length) % state.list.length;
        persistCarouselPosition();
        renderCarousel({ skipListRefresh: true });
        renderInfo();
      }

      function syncFilterChips() {
        Array.prototype.forEach.call(document.querySelectorAll('[data-filter]'), function (c) {
          var f = c.getAttribute('data-filter');
          var on = f === state.filter;
          c.classList.toggle('is-active', on);
          c.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
      }

      var sheetEl = document.getElementById('deckSheet');
      var sheetScrollEl = document.getElementById('deckSheetScroll');
      var SHEET_DRAFT_PREFIX = 'wsDeckSheetDraft:';
      var sheetState = {
        open: false,
        mode: 'view', /* view | edit */
        deckId: '',
        draftCards: null,
        draftMeta: null, /* { name, tags, deckDescription, baseUpdatedAt, savedAt } */
        levelFilter: null, /* null | 0 | 1 | 2 | 3 | 'cx' */
        metaCache: Object.create(null),
        saving: false,
        dirty: false,
        unsavedHintTimer: null,
        leavePromptOpen: false,
        suppressDraftPersist: false
      };

      function isSheetLevelFilter(value) {
        return value === 0 || value === 1 || value === 2 || value === 3 || value === 'cx';
      }

      function sheetLevelLabel(value) {
        return value === 'cx' ? 'CX' : ('Lv' + value);
      }

      function cardLevelBucket(meta) {
        if (!meta) return { isCx: false, level: null };
        var isCx = /cx/i.test(meta.kind || '');
        if (isCx) return { isCx: true, level: 'cx' };
        var lv = meta.level;
        if (lv == null || !isFinite(lv) || lv < 0) return { isCx: false, level: null };
        lv = Math.floor(lv);
        if (lv > 3) lv = 3;
        return { isCx: false, level: lv };
      }

      function cloneDeckCards(cards) {
        return (cards || []).map(function (c) {
          return {
            cardNumber: c && c.cardNumber,
            cardName: (c && (c.cardName || c.name)) || '',
            qty: (function () {
              var q = parseInt(c && c.qty, 10);
              return isNaN(q) || q < 1 ? 1 : q;
            })()
          };
        }).filter(function (c) { return c.cardNumber; });
      }

      function sheetDraftStorageKey(deckId) {
        return SHEET_DRAFT_PREFIX + String(deckId || '');
      }

      function readSheetDraft(deckId) {
        try {
          var raw = localStorage.getItem(sheetDraftStorageKey(deckId));
          if (!raw) return null;
          var data = JSON.parse(raw);
          if (!data || data.deckId !== deckId) return null;
          return data;
        } catch (e) {
          return null;
        }
      }

      function clearSheetDraft(deckId) {
        try { localStorage.removeItem(sheetDraftStorageKey(deckId)); } catch (e) { /* ignore */ }
      }

      function readSheetFormMeta() {
        var nameEl = document.getElementById('deckSheetNameInput');
        var tagsEl = document.getElementById('deckSheetTagsInput');
        var descEl = document.getElementById('deckSheetDescInput');
        var tagsRaw = (tagsEl && tagsEl.value) || '';
        return {
          name: normalizeText(nameEl && nameEl.value) || '未命名牌組',
          tags: tagsRaw.split(/[,，、]/).map(function (t) { return normalizeText(t); }).filter(Boolean),
          deckDescription: normalizeText(descEl && descEl.value)
        };
      }

      function buildSheetDraftPayload() {
        var meta = readSheetFormMeta();
        return {
          deckId: sheetState.deckId,
          name: meta.name,
          tags: meta.tags,
          deckDescription: meta.deckDescription,
          cards: cloneDeckCards(sheetState.draftCards || []),
          baseUpdatedAt: (sheetState.draftMeta && sheetState.draftMeta.baseUpdatedAt) || 0,
          savedAt: Date.now()
        };
      }

      function writeSheetDraftToStorage() {
        if (sheetState.suppressDraftPersist) return;
        if (sheetState.mode !== 'edit' || !sheetState.deckId) return;
        if (!Array.isArray(sheetState.draftCards)) return;
        try {
          localStorage.setItem(sheetDraftStorageKey(sheetState.deckId), JSON.stringify(buildSheetDraftPayload()));
        } catch (e) {
          console.error(e);
        }
      }

      function cardsSignature(cards) {
        return cloneDeckCards(cards).map(function (c) {
          return normalizeText(c.cardNumber).replace(/\\/g, '/') + ':' + (c.qty || 1);
        }).join('|');
      }

      function isSheetDraftDirty(rawDeck) {
        if (sheetState.mode !== 'edit' || !rawDeck) return false;
        var meta = readSheetFormMeta();
        var serverName = normalizeText(rawDeck.name) || '未命名牌組';
        var serverTags = (Array.isArray(rawDeck.tags) ? rawDeck.tags : []).map(function (t) {
          return normalizeText(t);
        }).filter(Boolean);
        var serverDesc = normalizeText(rawDeck.deckDescription);
        if (meta.name !== serverName) return true;
        if (meta.deckDescription !== serverDesc) return true;
        if (meta.tags.join('\u0001') !== serverTags.join('\u0001')) return true;
        return cardsSignature(sheetState.draftCards) !== cardsSignature(rawDeck.cards);
      }

      function syncSheetUnsavedUi() {
        var badge = document.getElementById('deckSheetUnsaved');
        var raw = findRawDeckById(sheetState.deckId);
        var dirty = sheetState.mode === 'edit' && isSheetDraftDirty(raw);
        sheetState.dirty = dirty;
        if (!badge) return;
        if (dirty) badge.classList.add('is-on');
        else badge.classList.remove('is-on');
      }

      function clearUnsavedHintTimer() {
        if (sheetState.unsavedHintTimer) {
          clearTimeout(sheetState.unsavedHintTimer);
          sheetState.unsavedHintTimer = null;
        }
      }

      function scheduleUnsavedHint() {
        clearUnsavedHintTimer();
        sheetState.unsavedHintTimer = setTimeout(function () {
          sheetState.unsavedHintTimer = null;
          if (sheetState.open && sheetState.mode === 'edit' && sheetState.dirty) {
            showToast('編成尚未儲存到伺服器');
          }
        }, 60000);
      }

      function markSheetDraftChanged() {
        if (sheetState.mode !== 'edit') return;
        writeSheetDraftToStorage();
        syncSheetUnsavedUi();
        if (sheetState.dirty) scheduleUnsavedHint();
        else clearUnsavedHintTimer();
      }

      function sheetCardsForRender(rawDeck) {
        if (sheetState.mode === 'edit' && Array.isArray(sheetState.draftCards)) {
          return sheetState.draftCards;
        }
        return (rawDeck && rawDeck.cards) || [];
      }

      function beginSheetDraft(rawDeck, stored) {
        sheetState.suppressDraftPersist = true;
        if (stored && Array.isArray(stored.cards)) {
          sheetState.draftCards = cloneDeckCards(stored.cards);
          sheetState.draftMeta = {
            name: normalizeText(stored.name) || '未命名牌組',
            tags: Array.isArray(stored.tags) ? stored.tags.slice() : [],
            deckDescription: normalizeText(stored.deckDescription),
            baseUpdatedAt: stored.baseUpdatedAt || (rawDeck && rawDeck.updatedAt) || 0,
            savedAt: stored.savedAt || Date.now()
          };
        } else {
          sheetState.draftCards = cloneDeckCards(rawDeck && rawDeck.cards);
          sheetState.draftMeta = {
            name: normalizeText(rawDeck && rawDeck.name) || '未命名牌組',
            tags: Array.isArray(rawDeck && rawDeck.tags) ? rawDeck.tags.slice() : [],
            deckDescription: normalizeText(rawDeck && rawDeck.deckDescription),
            baseUpdatedAt: (rawDeck && rawDeck.updatedAt) || 0,
            savedAt: Date.now()
          };
        }
        sheetState.suppressDraftPersist = false;
      }

      function applyStoredDraftToForm(stored) {
        if (!stored) return;
        document.getElementById('deckSheetNameInput').value = normalizeText(stored.name) || '';
        document.getElementById('deckSheetTagsInput').value = (Array.isArray(stored.tags) ? stored.tags : []).join(', ');
        document.getElementById('deckSheetDescInput').value = normalizeText(stored.deckDescription);
      }

      function adjustSheetCardQty(cardNumber, delta) {
        if (!Array.isArray(sheetState.draftCards)) return;
        var key = normalizeText(cardNumber).replace(/\\/g, '/');
        for (var i = 0; i < sheetState.draftCards.length; i++) {
          var no = normalizeText(sheetState.draftCards[i].cardNumber).replace(/\\/g, '/');
          if (no !== key) continue;
          var prev = sheetState.draftCards[i].qty || 1;
          var next = prev + delta;
          if (next < 1) {
            sheetState.draftCards.splice(i, 1);
          } else {
            if (prev <= 4 && next > 4) showToast('已超過常見上限 4 張（仍可繼續）');
            sheetState.draftCards[i].qty = next;
          }
          markSheetDraftChanged();
          renderDeckSheet();
          return;
        }
      }

      function removeSheetCard(cardNumber) {
        if (!Array.isArray(sheetState.draftCards)) return;
        var key = normalizeText(cardNumber).replace(/\\/g, '/');
        sheetState.draftCards = sheetState.draftCards.filter(function (c) {
          return normalizeText(c.cardNumber).replace(/\\/g, '/') !== key;
        });
        markSheetDraftChanged();
        renderDeckSheet();
      }

      function closeSheetDialog() {
        var dialog = document.getElementById('deckSheetDialog');
        if (!dialog) return;
        dialog.hidden = true;
        dialog.setAttribute('aria-hidden', 'true');
        sheetState.leavePromptOpen = false;
      }

      function openSheetDialog(opts) {
        opts = opts || {};
        var dialog = document.getElementById('deckSheetDialog');
        var titleEl = document.getElementById('deckSheetDialogTitle');
        var textEl = document.getElementById('deckSheetDialogText');
        var actionsEl = document.getElementById('deckSheetDialogActions');
        if (!dialog || !actionsEl) return;
        titleEl.textContent = opts.title || '提示';
        textEl.textContent = opts.text || '';
        actionsEl.innerHTML = '';
        (opts.actions || []).forEach(function (action) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = action.label;
          btn.className = action.className || 'is-ghost';
          btn.addEventListener('click', function () {
            closeSheetDialog();
            if (typeof action.onClick === 'function') action.onClick();
          });
          actionsEl.appendChild(btn);
        });
        dialog.hidden = false;
        dialog.setAttribute('aria-hidden', 'false');
        sheetState.leavePromptOpen = true;
      }

      function discardSheetDraftAndView() {
        clearUnsavedHintTimer();
        clearSheetDraft(sheetState.deckId);
        sheetState.draftCards = null;
        sheetState.draftMeta = null;
        sheetState.dirty = false;
        sheetState.mode = 'view';
        syncSheetUnsavedUi();
        renderDeckSheet();
      }

      function requestLeaveEdit(opts) {
        opts = opts || {};
        var raw = findRawDeckById(sheetState.deckId);
        if (sheetState.mode !== 'edit') {
          if (typeof opts.onClean === 'function') opts.onClean();
          return;
        }
        markSheetDraftChanged();
        if (!isSheetDraftDirty(raw)) {
          clearSheetDraft(sheetState.deckId);
          sheetState.draftCards = null;
          sheetState.draftMeta = null;
          sheetState.dirty = false;
          clearUnsavedHintTimer();
          if (typeof opts.onClean === 'function') opts.onClean();
          else {
            sheetState.mode = 'view';
            renderDeckSheet();
          }
          return;
        }
        openSheetDialog({
          title: '尚未儲存',
          text: '編成變更只存在此裝置草稿。要儲存到伺服器，或丟棄草稿？',
          actions: [
            {
              label: '繼續編成',
              className: 'is-ghost',
              onClick: function () { /* stay */ }
            },
            {
              label: '丟棄',
              className: 'is-danger',
              onClick: function () {
                discardSheetDraftAndView();
                if (typeof opts.onDiscard === 'function') opts.onDiscard();
              }
            },
            {
              label: '儲存',
              className: 'is-primary',
              onClick: function () {
                saveSheetEdits({ after: opts.onSaved || null });
              }
            }
          ]
        });
      }

      function promptCloudDraftChoice(rawDeck, stored, onDone) {
        openSheetDialog({
          title: '發現未存草稿',
          text: '雲端牌組較新，同時此裝置也有未儲存草稿。要用哪一份？',
          actions: [
            {
              label: '用雲端',
              className: 'is-ghost',
              onClick: function () {
                clearSheetDraft(rawDeck.id);
                beginSheetDraft(rawDeck, null);
                fillSheetForm(rawDeck);
                writeSheetDraftToStorage();
                if (typeof onDone === 'function') onDone();
              }
            },
            {
              label: '用本地草稿',
              className: 'is-primary',
              onClick: function () {
                beginSheetDraft(rawDeck, stored);
                applyStoredDraftToForm(stored);
                writeSheetDraftToStorage();
                if (typeof onDone === 'function') onDone();
              }
            }
          ]
        });
      }

      function enterSheetEdit(rawDeck) {
        var stored = readSheetDraft(rawDeck.id);
        var serverUpdated = Number(rawDeck && rawDeck.updatedAt) || 0;
        var baseUpdated = stored ? (Number(stored.baseUpdatedAt) || 0) : 0;
        sheetState.mode = 'edit';
        if (stored && serverUpdated > baseUpdated) {
          beginSheetDraft(rawDeck, null);
          fillSheetForm(rawDeck);
          renderDeckSheet();
          promptCloudDraftChoice(rawDeck, stored, function () {
            markSheetDraftChanged();
            renderDeckSheet();
          });
          return;
        }
        if (stored) {
          beginSheetDraft(rawDeck, stored);
          applyStoredDraftToForm(stored);
          showToast('已恢復未儲存草稿');
        } else {
          beginSheetDraft(rawDeck, null);
          fillSheetForm(rawDeck);
          writeSheetDraftToStorage();
        }
        markSheetDraftChanged();
        renderDeckSheet();
      }

      function findRawDeckById(id) {
        id = String(id || '');
        for (var i = 0; i < allDecks.length; i++) {
          if (allDecks[i] && allDecks[i].id === id) return allDecks[i];
        }
        return null;
      }

      function colorKey(raw) {
        var c = normalizeText(raw).toLowerCase();
        if (/黄|yel|yellow|y/.test(c)) return 'y';
        if (/緑|綠|gre|green|g/.test(c)) return 'g';
        if (/赤|紅|red|r/.test(c)) return 'r';
        if (/青|blu|blue|b/.test(c)) return 'b';
        return '';
      }

      function enrichSheetCards(rawDeck, done) {
        var cards = (rawDeck && rawDeck.cards) || [];
        var need = [];
        var seen = Object.create(null);
        cards.forEach(function (c) {
          var key = normalizeText(c && c.cardNumber).replace(/\\/g, '/');
          if (!key || seen[key] || sheetState.metaCache[key]) return;
          seen[key] = true;
          need.push({ cardNo: key, name: c.cardName || key });
        });
        if (!need.length || !(window.WsDecklog && typeof window.WsDecklog.enrichCards === 'function')) {
          done(false);
          return;
        }
        window.WsDecklog.enrichCards(need).then(function (rows) {
          (rows || []).forEach(function (row) {
            var key = normalizeText(row && (row.cardNo || row.cardNumber)).replace(/\\/g, '/');
            if (!key) return;
            var lv = parseInt(row.level != null ? row.level : row.cardlevel, 10);
            sheetState.metaCache[key] = {
              level: isNaN(lv) ? null : lv,
              color: normalizeText(row.color || row.cardcolor || ''),
              name: normalizeText(row.name || row.cardName || ''),
              kind: normalizeText(row.kindLabel || row.kind || '')
            };
          });
          done(true);
        }).catch(function () { done(false); });
      }

      function computeSheetAnalyzeStats(rawDeck) {
        var cards = (rawDeck && rawDeck.cards) || [];
        var selectedLevel = sheetState.levelFilter;
        var hasSelection = isSheetLevelFilter(selectedLevel);
        var colorTotals = { y: 0, g: 0, r: 0, b: 0, other: 0 };
        var levelTotals = { 0: 0, 1: 0, 2: 0, 3: 0, cx: 0, other: 0 };
        var known = 0;
        cards.forEach(function (c) {
          var qty = parseInt(c && c.qty, 10);
          if (isNaN(qty) || qty < 1) qty = 1;
          var key = normalizeText(c && c.cardNumber).replace(/\\/g, '/');
          var meta = sheetState.metaCache[key];
          if (!meta) {
            levelTotals.other += qty;
            if (!hasSelection) colorTotals.other += qty;
            return;
          }
          known += qty;
          var bucket = cardLevelBucket(meta);
          if (bucket.isCx) levelTotals.cx += qty;
          else if (bucket.level != null) levelTotals[bucket.level] += qty;
          else levelTotals.other += qty;

          var includeColor = !hasSelection ||
            (selectedLevel === 'cx' ? bucket.isCx : (!bucket.isCx && bucket.level === selectedLevel));
          if (!includeColor) return;
          var ck = colorKey(meta.color);
          if (ck) colorTotals[ck] += qty;
          else colorTotals.other += qty;
        });
        return {
          cards: cards,
          known: known,
          colorTotals: colorTotals,
          levelTotals: levelTotals,
          selectedLevel: selectedLevel,
          hasSelection: hasSelection
        };
      }

      function sheetColorSegments(colorTotals) {
        /* 紅／綠採較高對比色，降低紅綠色弱混淆（對齊 decks.html） */
        var colorOrder = [
          { key: 'y', label: '黃', hex: '#f0c14b' },
          { key: 'g', label: '綠', hex: '#16a34a' },
          { key: 'r', label: '紅', hex: '#dc2626' },
          { key: 'b', label: '藍', hex: '#6aa8ff' }
        ];
        var colorSegs = [];
        var colorSum = 0;
        colorOrder.forEach(function (c) {
          var n = colorTotals[c.key] || 0;
          if (!n) return;
          colorSum += n;
          colorSegs.push({ label: c.label, hex: c.hex, value: n });
        });
        if (colorTotals.other) {
          colorSum += colorTotals.other;
          colorSegs.push({ label: '其他', hex: 'rgba(180,180,200,0.55)', value: colorTotals.other });
        }
        return { segs: colorSegs, sum: colorSum };
      }

      function applySheetDonutSegDraw(el, startPct, endPct) {
        if (!el) return;
        var start = Math.max(0, Math.min(1, Number(startPct) || 0));
        var end = Math.max(start, Math.min(1, Number(endPct) || 0));
        var len = Math.max(0, end - start);
        el.setAttribute('stroke-dasharray', len + ' 1');
        el.setAttribute('stroke-dashoffset', String(-start));
      }

      function buildSheetDonutBodyHtml(stats) {
        var colorPack = sheetColorSegments(stats.colorTotals);
        var colorSegs = colorPack.segs;
        var colorSum = colorPack.sum;
        var hasSelection = stats.hasSelection;
        var selectedLevel = stats.selectedLevel;

        var size = 120;
        var cx = size / 2;
        var cy = size / 2;
        var radius = 40;
        var stroke = 18;
        var gapPct = colorSegs.length > 1 ? 0.015 : 0;
        var usable = Math.max(0, 1 - gapPct * colorSegs.length);
        var cursor = 0;
        colorSegs.forEach(function (seg) {
          var span = colorSum > 0 ? (seg.value / colorSum) * usable : 0;
          seg.start = cursor;
          seg.end = cursor + span;
          cursor = seg.end + gapPct;
        });

        var svg = '<svg viewBox="0 0 ' + size + ' ' + size + '" aria-hidden="true">';
        svg += '<g transform="rotate(-90 ' + cx + ' ' + cy + ')">';
        svg += '<circle class="deck-sheet-donut-track" cx="' + cx + '" cy="' + cy + '" r="' + radius +
          '" fill="none" stroke="rgba(148,163,184,0.28)" stroke-width="' + stroke +
          '" pathLength="1"></circle>';
        colorSegs.forEach(function (seg) {
          svg += '<circle class="deck-sheet-donut-seg" data-donut-seg data-draw-start="' +
            seg.start.toFixed(5) + '" data-draw-end="' + seg.end.toFixed(5) +
            '" cx="' + cx + '" cy="' + cy + '" r="' + radius +
            '" fill="none" stroke="' + seg.hex + '" stroke-width="' + stroke +
            '" stroke-linecap="butt" pathLength="1" stroke-dasharray="0 1" stroke-dashoffset="' +
            (-seg.start).toFixed(5) + '"></circle>';
        });
        svg += '</g></svg>';

        var caption = hasSelection
          ? '<p class="deck-sheet-pie-caption">' + escapeHtml(sheetLevelLabel(selectedLevel)) + '</p>'
          : '<p class="deck-sheet-pie-caption"></p>';
        var center = '<div class="deck-sheet-pie-center">' +
          '<div class="deck-sheet-pie-total">' + colorSum + '<span>張</span></div>' +
          caption +
          '</div>';

        var legend = '<div class="deck-sheet-legend">';
        if (colorSegs.length) {
          colorSegs.forEach(function (seg) {
            legend += '<span class="deck-sheet-legend-pill">' +
              '<span class="deck-sheet-legend-dot" style="background:' + seg.hex + '"></span>' +
              escapeHtml(seg.label) + ' ' + seg.value + '</span>';
          });
        } else {
          legend += '<span class="deck-sheet-legend-pill">' +
            (hasSelection ? '此等級尚無顏色資料' : '尚無顏色資料') + '</span>';
        }
        legend += '</div>';

        return '<div class="deck-sheet-pie-wrap">' + svg + center + '</div>' + legend;
      }

      function buildSheetAnalyzeHtml(rawDeck) {
        var stats = computeSheetAnalyzeStats(rawDeck);
        if (!stats.cards.length) {
          return '<div class="deck-sheet-empty deck-sheet-analyze-empty">此牌組尚未加入卡片</div>';
        }
        if (!stats.known) {
          return '<div class="deck-sheet-empty deck-sheet-analyze-empty">尚無色別／等級資料（可稍後自動補齊）</div>';
        }

        var donut = '<div class="deck-sheet-chart" data-sheet-chart="color">' +
          '<p class="deck-sheet-chart-title">色別分布</p>' +
          '<div class="deck-sheet-pie">' + buildSheetDonutBodyHtml(stats) + '</div></div>';

        var levelOrder = [
          { key: 0, label: 'Lv0' },
          { key: 1, label: 'Lv1' },
          { key: 2, label: 'Lv2' },
          { key: 3, label: 'Lv3' },
          { key: 'cx', label: 'CX', cx: true }
        ];
        var levelMax = 1;
        levelOrder.forEach(function (lv) {
          levelMax = Math.max(levelMax, stats.levelTotals[lv.key] || 0);
        });
        var vbars = '<div class="deck-sheet-vbars' + (stats.hasSelection ? ' has-selection' : '') +
          '" role="group" aria-label="等級分布直條圖，點選可篩選色別">';
        levelOrder.forEach(function (lv) {
          var n = stats.levelTotals[lv.key] || 0;
          var pct = Math.round((n / levelMax) * 100);
          if (n > 0 && pct < 8) pct = 8;
          var selected = stats.hasSelection && stats.selectedLevel === lv.key;
          var title = selected
            ? '取消篩選色別分布'
            : ('依 ' + lv.label + ' 篩選色別分布');
          vbars += '<button type="button" class="deck-sheet-vbar-col' + (selected ? ' is-selected' : '') +
            '" data-sheet-chart-level="' + lv.key + '" aria-pressed="' + (selected ? 'true' : 'false') +
            '" title="' + title + '" aria-label="' + lv.label + '，' + n + ' 張' +
            (selected ? '，已選取' : '') + '">' +
            '<span class="deck-sheet-vbar-n">' + n + '</span>' +
            '<div class="deck-sheet-vbar-track"><div class="deck-sheet-vbar-fill' +
            (lv.cx ? ' is-cx' : '') + '" data-h="' + pct + '%" style="height:0"></div></div>' +
            '<span class="deck-sheet-vbar-label">' + lv.label + '</span></button>';
        });
        vbars += '</div>';
        var levelChart = '<div class="deck-sheet-chart" data-sheet-chart="level">' +
          '<p class="deck-sheet-chart-title">等級分布</p>' + vbars + '</div>';

        return donut + levelChart;
      }

      function prefersSheetChartMotionReduce() {
        try {
          return !!(window.matchMedia &&
            window.matchMedia('(prefers-reduced-motion: reduce)').matches);
        } catch (e) {
          return false;
        }
      }

      function playSheetDonutIntro(pie) {
        if (!pie) return;
        var segs = pie.querySelectorAll('[data-donut-seg]');
        var legendPills = pie.querySelectorAll('.deck-sheet-legend-pill');
        var center = pie.querySelector('.deck-sheet-pie-center');

        pie.classList.remove('is-in');
        Array.prototype.forEach.call(segs, function (seg) {
          var start = Number(seg.getAttribute('data-draw-start')) || 0;
          applySheetDonutSegDraw(seg, start, start);
        });
        Array.prototype.forEach.call(legendPills, function (el) {
          el.style.transitionDelay = '0s';
        });

        function applyFinal() {
          Array.prototype.forEach.call(segs, function (seg) {
            applySheetDonutSegDraw(
              seg,
              seg.getAttribute('data-draw-start'),
              seg.getAttribute('data-draw-end')
            );
          });
          pie.classList.add('is-in');
          Array.prototype.forEach.call(legendPills, function (el) {
            el.style.transitionDelay = '0s';
          });
        }

        if (prefersSheetChartMotionReduce()) {
          applyFinal();
          return;
        }

        Array.prototype.forEach.call(legendPills, function (el, i) {
          el.style.transitionDelay = (0.18 + i * 0.045) + 's';
        });

        void pie.offsetWidth;
        requestAnimationFrame(function () {
          pie.classList.add('is-in');
          if (center) {
            /* center fades via CSS is-in */
          }
          Array.prototype.forEach.call(segs, function (seg, i) {
            var start = Number(seg.getAttribute('data-draw-start')) || 0;
            var end = Number(seg.getAttribute('data-draw-end')) || 0;
            var delay = 40 + i * 70;
            var dur = 240;
            var t0 = null;
            function frame(now) {
              if (t0 == null) t0 = now;
              var p = Math.min(1, (now - t0) / dur);
              var ease = 1 - Math.pow(1 - p, 2);
              applySheetDonutSegDraw(seg, start, start + (end - start) * ease);
              if (p < 1) requestAnimationFrame(frame);
            }
            setTimeout(function () { requestAnimationFrame(frame); }, delay);
          });
        });
      }

      function playSheetAnalyzeIntro() {
        var host = document.getElementById('deckSheetAnalyze');
        if (!host) return;
        var pie = host.querySelector('.deck-sheet-pie');
        var vbars = host.querySelector('.deck-sheet-vbars');
        var fills = host.querySelectorAll('.deck-sheet-vbar-fill');
        var charts = host.querySelectorAll('.deck-sheet-chart');
        var cols = host.querySelectorAll('.deck-sheet-vbar-col');

        host.classList.remove('is-in');
        if (vbars) vbars.classList.remove('is-in');

        Array.prototype.forEach.call(fills, function (el) {
          el.style.height = '0';
        });

        function applyBarFinal() {
          host.classList.add('is-in');
          if (vbars) vbars.classList.add('is-in');
          Array.prototype.forEach.call(fills, function (el) {
            var h = el.getAttribute('data-h');
            if (h) el.style.height = h;
          });
          Array.prototype.forEach.call(charts, function (el) {
            el.style.transitionDelay = '0s';
          });
          Array.prototype.forEach.call(fills, function (el) {
            el.style.transitionDelay = '0s';
          });
          Array.prototype.forEach.call(cols, function (col) {
            var nEl = col.querySelector('.deck-sheet-vbar-n');
            var labelEl = col.querySelector('.deck-sheet-vbar-label');
            if (nEl) nEl.style.transitionDelay = '0s';
            if (labelEl) labelEl.style.transitionDelay = '0s';
          });
        }

        if (prefersSheetChartMotionReduce() || (!pie && !vbars)) {
          applyBarFinal();
          if (pie) playSheetDonutIntro(pie);
          return;
        }

        Array.prototype.forEach.call(charts, function (el, i) {
          el.style.transitionDelay = (i * 0.07) + 's';
        });
        Array.prototype.forEach.call(fills, function (el, i) {
          el.style.transitionDelay = (0.08 + i * 0.05) + 's';
        });
        Array.prototype.forEach.call(cols, function (col, i) {
          var delay = (0.12 + i * 0.05) + 's';
          var nEl = col.querySelector('.deck-sheet-vbar-n');
          var labelEl = col.querySelector('.deck-sheet-vbar-label');
          if (nEl) nEl.style.transitionDelay = delay;
          if (labelEl) labelEl.style.transitionDelay = delay;
        });

        void host.offsetWidth;
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            host.classList.add('is-in');
            if (vbars) vbars.classList.add('is-in');
            Array.prototype.forEach.call(fills, function (el) {
              var h = el.getAttribute('data-h');
              if (h) el.style.height = h;
            });
            if (pie) playSheetDonutIntro(pie);
          });
        });
      }

        var host = document.getElementById('deckSheetAnalyze');

      function renderSheetCards(rawDeck) {
        var host = document.getElementById('deckSheetCards');
        var countEl = document.getElementById('deckSheetCardCount');
        var cards = sheetCardsForRender(rawDeck);
        var total = cards.reduce(function (sum, c) {
          var q = parseInt(c && c.qty, 10);
          return sum + (isNaN(q) || q < 1 ? 0 : q);
        }, 0);
        var isEdit = sheetState.mode === 'edit';
        countEl.textContent = cards.length ? ('（' + cards.length + ' 種／' + total + ' 張）') : '';
        if (!cards.length) {
          host.innerHTML = '<div class="deck-sheet-empty" style="grid-column:1/-1">' +
            (isEdit ? '尚未加入卡片（可先儲存名稱，加卡功能之後會接上）' : '尚未加入卡片') +
            '</div>';
          return;
        }
        host.innerHTML = cards.map(function (c) {
          var no = normalizeText(c && c.cardNumber);
          var key = no.replace(/\\/g, '/');
          var urls = buildCardImageUrls(no);
          var qty = parseInt(c && c.qty, 10);
          if (isNaN(qty) || qty < 1) qty = 1;
          var meta = sheetState.metaCache[key];
          var label = (meta && meta.name) || c.cardName || no;
          if (!isEdit) {
            return '<div class="deck-sheet-card" title="' + escapeHtml(label) + '\\n' + escapeHtml(no) + '">' +
              '<img src="' + escapeHtml(urls.primary) + '" alt="" loading="lazy" decoding="async"' +
              (urls.fallback ? ' data-fallback="' + escapeHtml(urls.fallback) + '"' : '') + '>' +
              '<span class="deck-sheet-card-qty">×' + qty + '</span></div>';
          }
          return '<div class="deck-sheet-card" data-card-no="' + escapeHtml(no) + '" title="' +
            escapeHtml(label) + '\\n' + escapeHtml(no) + '">' +
            '<img src="' + escapeHtml(urls.primary) + '" alt="" loading="lazy" decoding="async"' +
            (urls.fallback ? ' data-fallback="' + escapeHtml(urls.fallback) + '"' : '') + '>' +
            '<button type="button" class="deck-sheet-card-remove" data-sheet-remove="' + escapeHtml(no) +
            '" aria-label="移除 ' + escapeHtml(label) + '"><i class="fas fa-times" aria-hidden="true"></i></button>' +
            '<div class="deck-sheet-card-tools">' +
            '<button type="button" data-sheet-qty="-1" data-card-no="' + escapeHtml(no) + '" aria-label="減少張數">−</button>' +
            '<button type="button" class="is-qty" tabindex="-1">×' + qty + '</button>' +
            '<button type="button" data-sheet-qty="1" data-card-no="' + escapeHtml(no) + '" aria-label="增加張數">+</button>' +
            '</div></div>';
        }).join('');
        Array.prototype.forEach.call(host.querySelectorAll('img'), function (img) {
          bindImgFallback(img, img.getAttribute('data-fallback') || '');
        });
        if (isEdit) {
          Array.prototype.forEach.call(host.querySelectorAll('[data-sheet-qty]'), function (btn) {
            btn.addEventListener('click', function (e) {
              e.preventDefault();
              adjustSheetCardQty(btn.getAttribute('data-card-no'), Number(btn.getAttribute('data-sheet-qty')));
            });
          });
          Array.prototype.forEach.call(host.querySelectorAll('[data-sheet-remove]'), function (btn) {
            btn.addEventListener('click', function (e) {
              e.preventDefault();
              removeSheetCard(btn.getAttribute('data-sheet-remove'));
            });

        }
      }

      function escapeHtml(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

        document.getElementById('deckSheetNameInput').value = normalizeText(rawDeck && rawDeck.name);
        document.getElementById('deckSheetTagsInput').value = (Array.isArray(rawDeck && rawDeck.tags) ? rawDeck.tags : []).join(', ');
        document.getElementById('deckSheetDescInput').value = normalizeText(rawDeck && rawDeck.deckDescription);

      var sheetImageExportBusy = false;
      var html2canvasLoadPromise = null;
      var HTML2CANVAS_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';

      function ensureHtml2Canvas() {
        if (typeof window.html2canvas === 'function') return Promise.resolve(window.html2canvas);
        if (html2canvasLoadPromise) return html2canvasLoadPromise;
        html2canvasLoadPromise = new Promise(function (resolve, reject) {
          var existing = document.querySelector('script[data-ws-html2canvas]');
          if (existing) {
            existing.addEventListener('load', function () {
              if (typeof window.html2canvas === 'function') resolve(window.html2canvas);
              else reject(new Error('html2canvas 載入失敗'));
            });
            existing.addEventListener('error', function () {
              reject(new Error('html2canvas 載入失敗'));
            });
            return;
          }
          var s = document.createElement('script');
          s.src = HTML2CANVAS_SRC;
          s.async = true;
          s.setAttribute('data-ws-html2canvas', '1');
          s.onload = function () {
            if (typeof window.html2canvas === 'function') resolve(window.html2canvas);
            else reject(new Error('html2canvas 載入失敗'));
          };
          s.onerror = function () {
            html2canvasLoadPromise = null;
            reject(new Error('html2canvas 載入失敗'));
          };
          document.head.appendChild(s);
        });
        return html2canvasLoadPromise;
      }

      function setSheetMoreOpen(open) {
        var wrap = document.getElementById('deckSheetMoreWrap');
        var btn = document.getElementById('deckSheetMoreBtn');
        var menu = document.getElementById('deckSheetMoreMenu');
        if (!wrap || !btn || !menu) return;
        var on = !!open && !wrap.hidden;
        menu.hidden = !on;
        btn.setAttribute('aria-expanded', on ? 'true' : 'false');

      function syncSheetMoreMenu(rawDeck) {
        var wrap = document.getElementById('deckSheetMoreWrap');
        var exportBtn = document.getElementById('deckSheetExportImageBtn');
        var simBtn = document.getElementById('deckSheetSimDrawBtn');
        if (!wrap) return;
        var isView = sheetState.mode !== 'edit';
        wrap.hidden = !isView;
        if (!isView) setSheetMoreOpen(false);
        var cards = (rawDeck && rawDeck.cards) || [];
        var hasCards = cards.some(function (c) {
          var q = parseInt(c && c.qty, 10);
          return !isNaN(q) && q > 0;
        });
        if (exportBtn) {
          exportBtn.disabled = !hasCards || sheetImageExportBusy;
          exportBtn.title = hasCards ? '輸出牌組圖片' : '牌組尚無卡片';
        }

          simBtn.disabled = !hasCards;

      function exportSheetDeckImage() {
        var raw = findRawDeckById(sheetState.deckId);
        if (!raw) {
          showToast('找不到這副牌組');
          return;
        }
        if (sheetState.mode === 'edit') {
          showToast('請先回到檢視再輸出圖片');
          return;
        }
        var cards = Array.isArray(raw.cards) ? raw.cards : [];
        if (!cards.length) {
          showToast('牌組尚無卡片，無法輸出圖片');
          return;
        }
        if (sheetImageExportBusy) {
          showToast('正在輸出圖片，請稍候…');
          return;
        }
        if (!(window.WsDeckImageExport && typeof window.WsDeckImageExport.exportDeckImage === 'function')) {
          showToast('牌組圖模組尚未載入');
          return;
        }
        sheetImageExportBusy = true;
        setSheetMoreOpen(false);
        syncSheetMoreMenu(raw);
        showToast('正在產生牌組圖片…');
        ensureHtml2Canvas()
          .then(function () {
            return window.WsDeckImageExport.exportDeckImage(raw, {
              pageSize: 50,
              width: 1920,
              height: 1080,
              preserveOrder: true,
              siteLabel: 'ws-cards',
              scale: 1,
              onProgress: function (msg) {
                if (msg) showToast(msg);
              }
            });
          })
          .then(function (result) {
            var names = (result && result.filenames) || [];
            var first = (result && result.filename) || names[0] || '牌組圖.png';
            var msg = names.length > 1
              ? ('已輸出 ' + names.length + ' 張圖片（' + first + ' …）')
              : ('已輸出「' + first + '」');
            if (result && result.partialImages) msg += '（部分圖片未載入）';
            showToast(msg);
          })
          .catch(function (err) {
            console.error(err);
            showToast((err && err.message) || '輸出圖片失敗');
          })
          .then(function () {
            sheetImageExportBusy = false;
            syncSheetMoreMenu(findRawDeckById(sheetState.deckId));
          });
      }

      function openDeckSheet(mode, deckId) {
        var deck = deckId ? { id: deckId, raw: findRawDeckById(deckId) } : currentDeck();
        var raw = deck && (deck.raw || findRawDeckById(deck.id));
        if (!raw) {
          showToast('請先選擇牌組');
          return;
        }
        sheetState.open = true;
        sheetState.deckId = raw.id;
        sheetState.levelFilter = null;
        sheetState.dirty = false;
        clearUnsavedHintTimer();
        closeSheetDialog();
        persistCarouselPosition();
        sheetEl.hidden = false;
        sheetEl.setAttribute('aria-hidden', 'false');
        requestAnimationFrame(function () {
          sheetEl.classList.add('is-open');
        });
        document.getElementById('stage').classList.add('is-sheet-open');
        if (sheetScrollEl) sheetScrollEl.scrollTop = 0;
        if (mode === 'edit') {
          enterSheetEdit(raw);
        } else {
          sheetState.mode = 'view';
          sheetState.draftCards = null;
          sheetState.draftMeta = null;
          renderDeckSheet();
        }
        enrichSheetCards(raw, function () {
          if (sheetState.open && sheetState.deckId === raw.id) renderDeckSheet();
        });
      }

      function forceCloseDeckSheet() {
        if (!sheetState.open) return;
        sheetState.open = false;
        sheetState.draftCards = null;

        sheetState.levelFilter = null;

      }

      function leaveEditToView() {
        clearUnsavedHintTimer();
        sheetState.mode = 'view';
        sheetState.draftCards = null;
        sheetState.draftMeta = null;
        sheetState.dirty = false;
        syncSheetUnsavedUi();
        renderDeckSheet();
      }

      function onSheetBack() {
        if (!sheetState.open) return;
        if (sheetState.leavePromptOpen) {
          closeSheetDialog();
          return;
        }
        if (sheetState.mode === 'edit') {
          requestLeaveEdit({
            onClean: leaveEditToView,
            onDiscard: function () { /* discardSheetDraftAndView already */ },
            onSaved: function () { /* saveSheetEdits already to view */ }
          });
          return;
        }
        forceCloseDeckSheet();
      }

      function closeDeckSheet() {
        if (!sheetState.open) return;
        if (sheetState.mode === 'edit') {
          onSheetBack();
          return;
        }
        forceCloseDeckSheet();
      }

      function setSheetMode(mode) {
        var next = mode === 'edit' ? 'edit' : 'view';
        var raw = findRawDeckById(sheetState.deckId);
        if (!raw) return;
        if (next === 'edit') {
          enterSheetEdit(raw);
          return;
        }
        requestLeaveEdit({
          onClean: leaveEditToView,
          onDiscard: function () { /* already view */ },
          onSaved: function () { /* saveSheetEdits switches to view */ }
        });
      }

      function saveSheetEdits(opts) {
        opts = opts || {};
        if (sheetState.saving) return;
        var raw = findRawDeckById(sheetState.deckId);
        if (!raw) return;
        var meta = readSheetFormMeta();
        var cards = Array.isArray(sheetState.draftCards)
          ? cloneDeckCards(sheetState.draftCards)
          : cloneDeckCards(raw.cards);
        var next = Object.assign({}, raw, {
          name: meta.name,
          tags: meta.tags,
          deckDescription: meta.deckDescription,
          cards: cards,
          updatedAt: Date.now()
        });
        sheetState.saving = true;
        writeSheetDraftToStorage();
        var saveP = (decksFirebaseReady() && deckCloudUser && typeof fb.saveUserDeck === 'function')
          ? fb.saveUserDeck(next)
          : Promise.resolve(true);
        saveP.then(function () {
          for (var i = 0; i < allDecks.length; i++) {
            if (allDecks[i] && allDecks[i].id === next.id) {
              allDecks[i] = next;
              break;
            }
          }
          writeLocalDecks(allDecks);
          sheetState.saving = false;
          clearSheetDraft(next.id);
          sheetState.draftCards = null;
          sheetState.draftMeta = null;
          sheetState.dirty = false;
          clearUnsavedHintTimer();
          showToast('已儲存牌組');
          sheetState.mode = 'view';
          renderDeckSheet();
          renderAll();
          if (typeof opts.after === 'function') opts.after(next);
        }).catch(function (err) {
          console.error(err);
          sheetState.saving = false;
          writeSheetDraftToStorage();
          showToast((err && err.message) || '儲存失敗，草稿仍保留可重試');
        });
      }

      function onEdit() {
        openDeckSheet('edit');
      }
      function onStart() {
        openDeckSheet('view');
      }

      function upsertLocalDeck(deck) {
        var found = false;
        for (var i = 0; i < allDecks.length; i++) {
          if (allDecks[i] && allDecks[i].id === deck.id) {
            allDecks[i] = deck;
            found = true;
            break;
          }
        }
        if (!found) allDecks.unshift(deck);
        writeLocalDecks(allDecks);
        state.index = 0;
        carouselPosRestored = true;
        try { localStorage.setItem(CAROUSEL_POS_KEY, String(deck.id)); } catch (e) { /* ignore */ }
        renderAll();
      }

      function persistNewDeck(deck) {
        var saveP = (decksFirebaseReady() && deckCloudUser && typeof fb.saveUserDeck === 'function')
          ? fb.saveUserDeck(deck).then(function (saved) {
              return (saved && saved.id) ? saved : deck;
            })
          : Promise.resolve(deck);
        return saveP.then(function (saved) {
          upsertLocalDeck(saved);
          return saved;
        });
      }

      function createBlankDeckInPage() {
        var now = Date.now();
        var deck = {
          id: 'local-' + now.toString(36),
          name: '新牌組',
          tags: [],
          cards: [],
          deckDescription: '',
          createdAt: now,
          updatedAt: now,
          source: 'manual'
        };
        showToast('建立空白牌組…');
        persistNewDeck(deck).then(function (saved) {
          openDeckSheet('edit', saved.id);
        }).catch(function (err) {
          console.error(err);
          showToast((err && err.message) || '建立失敗');
        });
      }

      function importDecklogInPage() {
        if (!(window.WsDecklog && typeof window.WsDecklog.fetchDecklogByCode === 'function')) {
          showToast('DeckLog 模組未載入');
          return;
        }
        var code = window.prompt('請輸入 DeckLog 代碼');
        if (code == null) return;
        code = normalizeText(code);
        if (!code) {
          showToast('請輸入代碼');
          return;
        }
        showToast('匯入 DeckLog 中…');
        window.WsDecklog.fetchDecklogByCode(code).then(function (payload) {
          var now = Date.now();
          var cards = (payload && payload.cards || []).map(function (c) {
            return {
              cardNumber: c.cardNo || c.cardNumber,
              cardName: c.name || c.cardName || '',
              qty: c.qty || 1
            };
          }).filter(function (c) { return c.cardNumber; });
          var deck = {
            id: 'decklog-' + now.toString(36),
            name: 'DeckLog ' + ((payload && payload.code) || code),
            tags: [],
            cards: cards,
            deckDescription: '',
            decklogCode: (payload && payload.code) || code,
            createdAt: now,
            updatedAt: now,
            source: 'decklog'
          };
          return persistNewDeck(deck);
        }).then(function (saved) {
          showToast('已匯入 ' + ((saved.cards || []).length) + ' 種卡');
          openDeckSheet('view', saved.id);
        }).catch(function (err) {
          console.error(err);
          showToast((err && err.message) || '匯入失敗');
        });
      }

      function applyCloudDecks(list) {
        allDecks = Array.isArray(list) ? list.filter(function (d) { return d && d.id; }) : [];
        writeLocalDecks(allDecks);
        renderAll();
      }

      function migrateLocalDecksIfCloudEmpty(cloudList) {
        var cloud = Array.isArray(cloudList) ? cloudList : [];
        if (cloud.length) return Promise.resolve(cloud);
        var local = readLocalDecks();
        if (!local.length || !decksFirebaseReady()) return Promise.resolve([]);
        showToast('正在將本機牌組上傳到雲端…');
        return Promise.all(local.map(function (d) {
          return fb.saveUserDeck(d);
        })).then(function () {
          return fb.loadUserDecks();
        });
      }

      function refreshDecksFromCloud() {
        if (!decksFirebaseReady() || !deckCloudUser) {
          allDecks = [];
          renderAll();
          return Promise.resolve([]);
        }
        if (deckSyncing) return Promise.resolve(allDecks);
        deckSyncing = true;
        return fb.loadUserDecks()
          .then(function (cloud) {
            return migrateLocalDecksIfCloudEmpty(cloud);
          })
          .then(function (list) {
            applyCloudDecks(list);
            return allDecks;
          })
          .catch(function (err) {
            console.error(err);
            setStatusMode('error');
            showToast((err && err.message) || '牌組雲端同步失敗');
            return allDecks;
          })
          .then(function (list) {
            deckSyncing = false;
            return list;
          });
      }

      function waitFirebaseAuthReady() {
        if (fb && fb.auth && typeof fb.auth.authStateReady === 'function') {
          return fb.auth.authStateReady();
        }
        return new Promise(function (resolve) {
          if (!(fb && typeof fb.onAuth === 'function')) {
            resolve();
            return;
          }
          var settled = false;
          var unsub = fb.onAuth(function () {
            if (settled) return;
            settled = true;
            if (typeof unsub === 'function') {
              try { unsub(); } catch (e) { /* ignore */ }
            }
            resolve();
          });
        });
      }

      function consumePendingOpenIntent() {
        var intent = '';
        try {
          intent = sessionStorage.getItem('wsDeckSelectOpen') || '';
          sessionStorage.removeItem('wsDeckSelectOpen');
        } catch (e) { /* ignore */ }
        if (intent === 'decklog') {
          setTimeout(function () { importDecklogInPage(); }, 60);
          return true;
        }
        if (intent === 'create') {
          setTimeout(function () { createBlankDeckInPage(); }, 60);
          return true;
        }
        return false;
      }

      function signInAndLoad() {
        if (!decksFirebaseReady()) {
          showToast((fb && fb.reason) || 'Firebase 尚未就緒');
          return;
        }
        var user = fb.currentUser && fb.currentUser();
        var p = user
          ? Promise.resolve(user)
          : fb.signInWithGoogle().then(function (cred) {
              return (cred && cred.user) || (fb.currentUser && fb.currentUser());
            });
        setStatusMode('loading');
        p.then(function (signed) {
          if (!signed) throw new Error('登入失敗');
          deckCloudUser = signed;
          var profileP = typeof fb.ensureUserProfile === 'function'
            ? fb.ensureUserProfile()
            : Promise.resolve(null);
          return profileP.then(function () {
            return refreshDecksFromCloud();
          }).then(function () {
            if (consumePendingOpenIntent()) return;
            if (!allDecks.length) showToast('已登入，可以建立或匯入牌組');
          });
        }).catch(function (err) {
          console.error(err);
          showToast((err && err.message) || '登入失敗');
          deckAuthResolved = true;
          renderAll();
        });
      }

      function bootstrapDecks() {
        favoriteIds = readFavoriteIds();
        setStatusMode('loading');
        if (!(fb && typeof fb.onAuth === 'function')) {
          deckAuthResolved = true;
          deckCloudUser = null;
          allDecks = [];
          setStatusMode('error');
          statusText.textContent = (fb && fb.reason) || 'Firebase 未載入，請改用完整牌組頁。';
          return;
        }
        waitFirebaseAuthReady().then(function () {
          var user = fb.currentUser && fb.currentUser();
          deckCloudUser = user || null;
          deckAuthResolved = true;
          if (!user) {
            allDecks = [];
            renderAll();
            return null;
          }
          setStatusMode('loading');
          return refreshDecksFromCloud().then(function (list) {
            if (list && list.length) {
              showToast('已同步雲端牌組 ' + list.length + ' 副');
            }
          });
        }).catch(function (err) {
          console.error(err);
          deckAuthResolved = true;
          deckCloudUser = null;
          allDecks = [];
          setStatusMode('error');
        });

        fb.onAuth(function (user) {
          if (!deckAuthResolved) return;
          deckCloudUser = user || null;
          if (!user) {
            allDecks = [];
            renderAll();
            return;
          }
          refreshDecksFromCloud().then(function (list) {
            if (list && list.length) {
              showToast('已同步雲端牌組 ' + list.length + ' 副');
            }
          });
        });
      }

      document.getElementById('prevBtn').addEventListener('click', function () { go(-1); });
      document.getElementById('nextBtn').addEventListener('click', function () { go(1); });
      document.getElementById('editBtn').addEventListener('click', onEdit);
      document.getElementById('startBtn').addEventListener('click', onStart);
      document.getElementById('editBtnDesk').addEventListener('click', onEdit);
      document.getElementById('startBtnDesk').addEventListener('click', onStart);

      document.getElementById('favToggle').addEventListener('click', function () {
        var deck = currentDeck();
        if (!deck) return;
        if (favoriteIds[deck.id]) delete favoriteIds[deck.id];
        else favoriteIds[deck.id] = true;
        writeFavoriteIds();
        showToast(favoriteIds[deck.id] ? '已加入我的最愛' : '已從最愛移除');
        renderAll();
      });

      document.getElementById('infoMore').addEventListener('click', function () {
        openDeckSheet('view');
      });
      document.getElementById('infoPanel').addEventListener('click', function (e) {
        if (e.target.closest('.fav-toggle, .info-actions, .info-more, a, button')) return;
        openDeckSheet('view');
      });
      document.getElementById('deckSheetBack').addEventListener('click', onSheetBack);
      document.getElementById('deckSheetModeBtn').addEventListener('click', function () {
        setSheetMode(sheetState.mode === 'edit' ? 'view' : 'edit');
      });
      document.getElementById('deckSheetMoreBtn').addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        var menu = document.getElementById('deckSheetMoreMenu');
        setSheetMoreOpen(!!(menu && menu.hidden));
      });
      document.getElementById('deckSheetExportImageBtn').addEventListener('pointerdown', function (e) {
        e.preventDefault();
        e.stopPropagation();
        exportSheetDeckImage();
      });
      document.getElementById('deckSheetSimDrawBtn').addEventListener('pointerdown', function (e) {
        e.preventDefault();
        e.stopPropagation();
        setSheetMoreOpen(false);
        showToast('模擬抽牌即將推出');
      });
      document.addEventListener('pointerdown', function (e) {
        var wrap = document.getElementById('deckSheetMoreWrap');
        if (!wrap || wrap.hidden) return;
        if (wrap.contains(e.target)) return;
        setSheetMoreOpen(false);
      }, true);
      ['deckSheetNameInput', 'deckSheetTagsInput', 'deckSheetDescInput'].forEach(function (id) {
        var el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('input', function () {
          markSheetDraftChanged();
        });
      });
      window.addEventListener('storage', function (e) {
        if (!e || !e.key || e.key.indexOf(SHEET_DRAFT_PREFIX) !== 0) return;
        if (!sheetState.open || sheetState.mode !== 'edit') return;
        if (e.key !== sheetDraftStorageKey(sheetState.deckId)) return;
        if (sheetState.leavePromptOpen) return;
        openSheetDialog({
          title: '草稿衝突',
          text: '另一分頁也在編這副牌組的草稿。要載入對方的草稿，或保留此分頁目前內容？',
          actions: [
            {
              label: '保留此分頁',
              className: 'is-ghost',
              onClick: function () { writeSheetDraftToStorage(); }
            },
            {
              label: '載入對方草稿',
              className: 'is-primary',
              onClick: function () {
                var stored = readSheetDraft(sheetState.deckId);
                var raw = findRawDeckById(sheetState.deckId);
                if (!stored || !raw) return;
                beginSheetDraft(raw, stored);
                applyStoredDraftToForm(stored);
                markSheetDraftChanged();
                renderDeckSheet();
              }
            }
          ]
        });
      });
      document.getElementById('deckSheetSecondary').addEventListener('click', function () {
        if (sheetState.mode === 'edit') {
          setSheetMoreOpen(false);
          showToast('選牌加卡即將推出');
          return;
        }
        setSheetMode('edit');
      });
      document.getElementById('deckSheetPrimary').addEventListener('click', function () {
        if (sheetState.mode === 'edit') saveSheetEdits();
        else forceCloseDeckSheet();
      });
      document.getElementById('menuBtn').addEventListener('click', function () {
        showToast('牌組功能已整合在本頁');
      });
      document.getElementById('helpBtn').addEventListener('click', function () {
        showToast('← → 選牌組 · Enter 檢視 · Esc 返回');
      });
      function handleEmptyAction(action) {
        if (action === 'login') {
          signInAndLoad();
          return;
        }
        if (action === 'retry') {
          if (!deckCloudUser) {
            signInAndLoad();
            return;
          }
          setStatusMode('loading');
          refreshDecksFromCloud();
          return;
        }
        if (action === 'clear') {
          clearFiltersAndSearch();
          return;
        }
        if (action === 'create') {
          createBlankDeckInPage();
          return;
        }
        if (action === 'decklog') {
          if (!deckCloudUser) {
            showToast('匯入 DeckLog 前請先登入');
            try { sessionStorage.setItem('wsDeckSelectOpen', 'decklog'); } catch (e) { /* ignore */ }
            signInAndLoad();
            return;
          }
          importDecklogInPage();
          return;
        }
        if (action === 'decks') {
          showToast('已在牌組頁');
        }
      }

      statusPrimary.addEventListener('click', function () {
        handleEmptyAction(statusPrimary.getAttribute('data-empty-action'));
      });
      statusSecondary.addEventListener('click', function () {
        handleEmptyAction(statusSecondary.getAttribute('data-empty-action'));
      });

      Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (chip) {
        chip.addEventListener('click', function () {
          if (chip.hasAttribute('data-filter')) {
            var f = chip.getAttribute('data-filter');
            if ((f === 'fav' || f === 'ws' || f === 'wsr') && state.filter === f) state.filter = 'all';
            else state.filter = f;
            syncFilterChips();
            state.index = 0;
            renderAll();
            if (f === 'wsr' && state.filter === 'wsr' && !state.list.length) {
              showToast('目前尚無 WSR 牌組');
            }
            return;
          }
          if (chip.hasAttribute('data-sort')) {
            state.sort = nextSortMode(state.sort);
            syncSortChip();
            state.index = 0;
            renderAll();
          }
        });
      });
      syncSortChip();

      var searchInput = document.getElementById('searchInput');
      var searchTimer = null;
      searchInput.addEventListener('input', function () {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(function () {
          state.query = searchInput.value.trim();
          state.index = 0;
          renderAll();
        }, 160);
      });

      function dragSwipeWidth() {
        var w = track.getBoundingClientRect().width || 320;
        return Math.max(160, Math.min(320, w * 0.34));
      }

      function endDrag(e) {
        if (!dragActive || (e && dragPointerId !== e.pointerId)) return;
        dragActive = false;
        dragPointerId = null;
        if (carouselEl) carouselEl.classList.remove('is-dragging');
        var step = 0;
        if (Math.abs(dragFrac) >= 0.32 || Math.abs(dragVelocity) > 0.55) {
          if (dragFrac > 0.18 || dragVelocity > 0.55) step = -1;
          else if (dragFrac < -0.18 || dragVelocity < -0.55) step = 1;
        }
        dragFrac = 0;
        dragVelocity = 0;
        if (step) {
          go(step);
        } else {
          renderCarousel({ skipListRefresh: true });
        }
        setTimeout(function () { dragMoved = false; }, 40);
      }

      track.addEventListener('pointerdown', function (e) {
        if (e.button && e.button !== 0) return;
        if (!state.list.length) return;
        dragActive = true;
        dragMoved = false;
        dragPointerId = e.pointerId;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        dragLastX = e.clientX;
        dragLastT = performance.now();
        dragVelocity = 0;
        dragFrac = 0;
        if (carouselEl) carouselEl.classList.add('is-dragging');
        try { track.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      });
      track.addEventListener('pointermove', function (e) {
        if (!dragActive || dragPointerId !== e.pointerId) return;
        var dx = e.clientX - dragStartX;
        var dy = e.clientY - dragStartY;
        if (!dragMoved && Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
        if (Math.abs(dy) > Math.abs(dx) * 1.35 && Math.abs(dragFrac) < 0.08) {
          // 垂直意圖：取消水平拖曳
          endDrag(e);
          return;
        }
        dragMoved = true;
        var now = performance.now();
        var dt = Math.max(1, now - dragLastT);
        dragVelocity = ((e.clientX - dragLastX) / dt) * 16;
        dragLastX = e.clientX;
        dragLastT = now;
        dragFrac = dx / dragSwipeWidth();
        if (dragFrac > 1.15) dragFrac = 1.15;
        if (dragFrac < -1.15) dragFrac = -1.15;
        renderCarousel({ skipListRefresh: true, transformsOnly: true });
      });
      track.addEventListener('pointerup', endDrag);
      track.addEventListener('pointercancel', endDrag);

      document.addEventListener('keydown', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) {
          if (e.key === 'Escape' && sheetState.open) {
            e.preventDefault();
            onSheetBack();
          }
          return;
        }
        if (sheetState.open) {
          if (e.key === 'Escape') {
            e.preventDefault();
            if (sheetState.leavePromptOpen) {
              closeSheetDialog();
              return;
            }
            var moreMenu = document.getElementById('deckSheetMoreMenu');
            if (moreMenu && !moreMenu.hidden) {
              setSheetMoreOpen(false);
              return;
            }
            onSheetBack();
          }
          return;
        }
        if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
        if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
        if (e.key === 'Enter') { e.preventDefault(); onStart(); }
        if (e.key === 'Escape') {
          showToast('已在牌組選擇');
        }
      });

      if (mqDesk.addEventListener) {
        mqDesk.addEventListener('change', function () { renderCarousel(); });
      } else if (mqDesk.addListener) {
        mqDesk.addListener(function () { renderCarousel(); });
      }

      var resizeTimer = null;
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
          renderCarousel({ skipListRefresh: true, transformsOnly: true });
        }, 120);
      });

      bootstrapDecks();
    })();
  </script>
</body>
</html>
