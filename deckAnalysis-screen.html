<!DOCTYPE html>
<html lang="zh-Hant-TW" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920">
  <meta name="description" content="Weiss Schwarz 牌組可視化分析平台：16:9 數位大屏展示規則、曲線、起手機率與虛擬牌桌。">
  <title>牌組可視化分析平台｜WS-Cards 卡片雲</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;700&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root {
      --bg0: #060b18;
      --bg1: #0a1630;
      --panel: rgba(8, 28, 58, 0.72);
      --panel-edge: rgba(56, 189, 248, 0.45);
      --glow: rgba(34, 211, 238, 0.55);
      --cyan: #22d3ee;
      --cyan-dim: #0891b2;
      --ink: #e8f4ff;
      --muted: #8fb3d1;
      --good: #34d399;
      --warn: #fbbf24;
      --bad: #fb7185;
      --accent: #38bdf8;
      --table: #0c2744;
      --table-edge: rgba(56, 189, 248, 0.35);
      --scan: rgba(34, 211, 238, 0.04);
      --font-ui: "Noto Sans TC", sans-serif;
      --font-display: "Orbitron", "Noto Sans TC", sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    [data-theme="light"] {
      --bg0: #dceaf8;
      --bg1: #f2f8ff;
      --panel: rgba(255, 255, 255, 0.78);
      --panel-edge: rgba(14, 116, 144, 0.35);
      --glow: rgba(8, 145, 178, 0.28);
      --cyan: #0e7490;
      --cyan-dim: #155e75;
      --ink: #0f2744;
      --muted: #4a6b86;
      --good: #059669;
      --warn: #b45309;
      --bad: #be123c;
      --accent: #0284c7;
      --table: #c5daf0;
      --table-edge: rgba(14, 116, 144, 0.4);
      --scan: rgba(14, 116, 144, 0.05);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg0);
      color: var(--ink);
      font-family: var(--font-ui);
    }

    .stage-wrap {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse 80% 60% at 50% 40%, var(--bg1), transparent 70%),
        linear-gradient(180deg, var(--bg0), #040814 100%);
    }
    [data-theme="light"] .stage-wrap {
      background:
        radial-gradient(ellipse 70% 50% at 50% 30%, #ffffff, transparent 65%),
        linear-gradient(180deg, #e8f2fc, #c9dceb);
    }

    /* 縮放後真實佔位，避免 transform 仍佔 1920×1080 造成偏移／裁切 */
    .scale-box {
      position: relative;
      width: 1920px;
      height: 1080px;
      flex: 0 0 auto;
      overflow: hidden;
    }

    .screen {
      width: 1920px; height: 1080px;
      position: absolute;
      left: 0; top: 0;
      display: grid;
      grid-template-rows: 88px 1fr 72px;
      padding: 12px 22px 10px;
      gap: 10px;
      transform-origin: 0 0;
      overflow: hidden;
    }
    .screen::before {
      content: "";
      position: absolute; inset: 0; pointer-events: none; z-index: 0;
      background:
        linear-gradient(var(--scan) 1px, transparent 1px) 0 0 / 100% 4px,
        radial-gradient(circle at 20% 10%, rgba(56,189,248,.12), transparent 35%),
        radial-gradient(circle at 85% 80%, rgba(34,211,238,.08), transparent 40%);
      animation: scan 8s linear infinite;
    }
    @keyframes scan {
      0% { background-position: 0 0, 0 0, 0 0; }
      100% { background-position: 0 80px, 0 0, 0 0; }
    }

    .hud { position: relative; z-index: 1; }

    /* ——— Header ——— */
    .header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
    }
    .header-left, .header-right {
      display: flex; align-items: center; gap: 12px;
    }
    .header-right { justify-content: flex-end; }
    .brand-chip {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 14px;
      border: 1px solid var(--panel-edge);
      background: var(--panel);
      box-shadow: 0 0 24px var(--glow);
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
      font-size: 13px; color: var(--muted); letter-spacing: 0.06em;
    }
    .brand-chip strong { color: var(--cyan); font-family: var(--font-mono); }
    .import-bar {
      display: flex; align-items: center; gap: 8px;
      min-width: 0;
    }
    .import-bar input {
      width: 168px;
      height: 38px;
      border: 1px solid var(--panel-edge);
      background: var(--panel);
      color: var(--ink);
      padding: 0 12px;
      font-family: var(--font-mono);
      font-size: 13px;
      outline: none;
    }
    .import-bar input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 14px var(--glow);
    }
    .import-bar input::placeholder { color: var(--muted); opacity: .7; }
    .hud-btn {
      appearance: none; height: 38px; padding: 0 12px;
      border: 1px solid var(--panel-edge);
      background: var(--panel); color: var(--ink);
      font-family: var(--font-ui); font-size: 12px; font-weight: 700;
      letter-spacing: 0.04em; cursor: pointer;
      white-space: nowrap;
      transition: box-shadow .2s, border-color .2s, background .2s;
    }
    .hud-btn:hover:not(:disabled) {
      border-color: var(--cyan);
      box-shadow: 0 0 14px var(--glow);
    }
    .hud-btn:disabled { opacity: .45; cursor: not-allowed; }
    .hud-btn.is-primary {
      background: rgba(34, 211, 238, 0.16);
      border-color: var(--cyan);
      color: var(--cyan);
    }
    .hud-btn.is-warn {
      background: rgba(251, 191, 36, 0.14);
      border-color: var(--warn);
      color: var(--warn);
    }
    .title-block { text-align: center; }
    .title-block .eyebrow {
      font-family: var(--font-display);
      font-size: 11px; letter-spacing: 0.35em;
      color: var(--cyan-dim); text-transform: uppercase;
      margin-bottom: 4px;
    }
    .title-block h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 34px; font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--ink);
      text-shadow: 0 0 18px var(--glow);
      background: linear-gradient(90deg, transparent, var(--panel-edge), transparent);
      background-size: 100% 2px;
      background-repeat: no-repeat;
      background-position: bottom;
      padding-bottom: 8px;
    }
    .clock {
      font-family: var(--font-mono);
      font-size: 22px; font-weight: 700;
      color: var(--cyan);
      text-shadow: 0 0 12px var(--glow);
      min-width: 110px; text-align: right;
    }
    .date-line { font-size: 12px; color: var(--muted); text-align: right; }
    .icon-btn {
      appearance: none; border: 1px solid var(--panel-edge);
      background: var(--panel); color: var(--ink);
      width: 40px; height: 40px; border-radius: 8px;
      cursor: pointer; display: grid; place-items: center;
      transition: box-shadow .2s, border-color .2s, transform .15s;
    }
    .icon-btn:hover {
      border-color: var(--cyan);
      box-shadow: 0 0 16px var(--glow);
      transform: translateY(-1px);
    }
    .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; }

    /* ——— Body ——— */
    .body {
      display: grid;
      grid-template-columns: 340px 1fr 360px;
      gap: 14px;
      min-height: 0;
    }

    .panel {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--panel-edge);
      box-shadow: inset 0 0 40px rgba(34, 211, 238, 0.05), 0 0 20px rgba(0,0,0,.25);
      backdrop-filter: blur(8px);
      padding: 14px 16px 16px;
      overflow: hidden;
    }
    .panel::before, .panel::after {
      content: ""; position: absolute; width: 14px; height: 14px;
      border: 2px solid var(--cyan); pointer-events: none;
    }
    .panel::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
    .panel::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
    .panel-title {
      display: flex; align-items: baseline; justify-content: space-between;
      margin: 0 0 12px;
      font-size: 15px; font-weight: 700; letter-spacing: 0.08em;
      color: var(--ink);
    }
    .panel-title span {
      font-family: var(--font-mono); font-size: 11px; color: var(--cyan);
      letter-spacing: 0.12em;
    }

    .col { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
    .col .panel { flex: 1; min-height: 0; }

    /* Rules */
    .rule-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .rule {
      padding: 12px 12px 10px;
      border: 1px solid rgba(56,189,248,.25);
      background: linear-gradient(160deg, rgba(34,211,238,.08), transparent 60%);
      position: relative;
    }
    .rule .label { font-size: 12px; color: var(--muted); letter-spacing: 0.06em; }
    .rule .value {
      font-family: var(--font-mono); font-size: 28px; font-weight: 700;
      margin: 4px 0 2px; color: var(--ink);
    }
    .rule .detail { font-size: 11px; color: var(--muted); }
    .rule.is-pass .value { color: var(--good); text-shadow: 0 0 10px rgba(52,211,153,.35); }
    .rule.is-fail .value { color: var(--bad); text-shadow: 0 0 10px rgba(251,113,133,.35); }
    .level-bars { margin-top: 12px; display: grid; gap: 7px; }
    .lv-row { display: grid; grid-template-columns: 64px 1fr 36px; align-items: center; gap: 8px; font-size: 12px; }
    .lv-row .tag { color: var(--muted); }
    .lv-row .num { font-family: var(--font-mono); text-align: right; font-weight: 700; }
    .lv-track { height: 8px; background: rgba(56,189,248,.12); border-radius: 999px; overflow: hidden; }
    .lv-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--cyan-dim), var(--cyan)); box-shadow: 0 0 8px var(--glow); transition: width .8s ease; }

    /* Price */
    .price-main {
      font-family: var(--font-display);
      font-size: 42px; font-weight: 700;
      color: var(--warn);
      text-shadow: 0 0 20px rgba(251,191,36,.35);
      letter-spacing: 0.04em;
    }
    .price-meta { margin-top: 6px; font-size: 12px; color: var(--muted); line-height: 1.5; }
    .kpi-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
    .kpi {
      padding: 10px; border: 1px solid rgba(56,189,248,.2);
      background: rgba(0,0,0,.12);
    }
    [data-theme="light"] .kpi { background: rgba(255,255,255,.5); }
    .kpi .k { font-size: 11px; color: var(--muted); }
    .kpi .v { font-family: var(--font-mono); font-size: 20px; font-weight: 700; margin-top: 2px; color: var(--cyan); }

    /* Odds */
    .odds-list { display: flex; flex-direction: column; gap: 8px; overflow: auto; max-height: 100%; }
    .odds-item {
      display: grid; grid-template-columns: 1fr 64px; gap: 8px; align-items: center;
      padding: 8px 10px;
      border-left: 2px solid var(--cyan);
      background: linear-gradient(90deg, rgba(34,211,238,.1), transparent);
    }
    .odds-item .name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .odds-item .meta { font-size: 11px; color: var(--muted); }
    .odds-item .pct {
      font-family: var(--font-mono); font-size: 16px; font-weight: 700;
      text-align: right; color: var(--accent);
    }

    /* Center table */
    .center {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      min-height: 0;
    }
    .deck-banner {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      border: 1px solid var(--panel-edge);
      background: var(--panel);
    }
    .deck-banner .name {
      font-size: 18px; font-weight: 700; letter-spacing: 0.06em;
    }
    .deck-banner .meta { font-size: 12px; color: var(--muted); }
    .deck-banner .badge {
      font-family: var(--font-mono); font-size: 11px;
      padding: 4px 10px; border: 1px solid var(--cyan);
      color: var(--cyan); letter-spacing: 0.1em;
      box-shadow: 0 0 12px var(--glow);
    }
    .sim-controls {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      justify-content: flex-end;
    }
    .sim-phase {
      font-family: var(--font-mono); font-size: 12px;
      color: var(--muted); min-width: 88px; text-align: right;
    }
    .sim-phase.is-mull { color: var(--warn); }
    .sim-phase.is-done { color: var(--good); }
    .sim-phase.is-ready { color: var(--cyan); }
    .sim-log {
      font-size: 12px; color: var(--muted); text-align: center;
      min-height: 1.2em;
    }

    .hand-overlay {
      position: absolute; inset: 0; z-index: 4;
      display: none;
      flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px;
      background: rgba(4, 10, 22, 0.72);
      backdrop-filter: blur(3px);
      padding: 24px;
    }
    .hand-overlay.is-open { display: flex; }
    [data-theme="light"] .hand-overlay { background: rgba(220, 234, 248, 0.78); }
    .hand-overlay .hand-title {
      font-family: var(--font-display); font-size: 12px;
      letter-spacing: 0.28em; color: var(--cyan);
    }
    .hand-row {
      display: flex; gap: 14px; justify-content: center; align-items: center;
      flex-wrap: wrap;
    }
    .hand-card {
      position: relative;
      width: 148px; height: 208px;
      flex: 0 0 auto;
      border-radius: 8px; overflow: hidden;
      border: 1px solid rgba(56,189,248,.5);
      background: #0a1528;
      box-shadow: 0 12px 28px rgba(0,0,0,.45), 0 0 18px rgba(34,211,238,.25);
      cursor: pointer;
      z-index: 1;
      transform: translateY(0) scale(1);
      transition: transform .22s cubic-bezier(.2,.8,.2,1), box-shadow .22s ease, border-color .2s ease;
    }
    .hand-card.is-entering {
      animation: cardIn .55s ease both;
    }
    /* CX／名場為橫向卡，起手時維持橫版 */
    .hand-card.is-cx {
      width: 228px; height: 162px;
    }
    .hand-card:hover {
      z-index: 8;
      transform: translateY(-22px) scale(1.08);
      border-color: var(--cyan);
      box-shadow: 0 22px 36px rgba(0,0,0,.55), 0 0 28px var(--glow);
    }
    .hand-card.is-selected {
      z-index: 5;
      border-color: var(--warn);
      box-shadow: 0 0 24px rgba(251,191,36,.45), 0 14px 28px rgba(0,0,0,.5);
      transform: translateY(-12px) scale(1.05);
    }
    .hand-card.is-selected:hover {
      z-index: 9;
      transform: translateY(-24px) scale(1.09);
      box-shadow: 0 24px 40px rgba(0,0,0,.55), 0 0 30px rgba(251,191,36,.5);
    }
    .hand-card.is-selected::after {
      content: "換";
      position: absolute; top: 8px; right: 8px; z-index: 3;
      font-family: var(--font-mono); font-size: 12px; font-weight: 700;
      color: #111; background: var(--warn); padding: 2px 6px;
      pointer-events: none;
    }
    .hand-card img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .hand-card.is-cx img { object-fit: cover; object-position: center; }
    .hand-card img.is-missing { display: none; }
    .hand-card .card-face { padding: 26px 10px 24px; }
    .hand-card.is-cx .card-face { padding: 22px 14px 22px 16px; }
    .hand-card.is-cx .fname { font-size: 14px; }
    .hand-card.has-art .card-face { display: none; }
    .hand-card .lv, .hand-card .qty { z-index: 2; }
    .hand-card .qty { display: none; }
    .hand-card .cx-tag {
      position: absolute; left: 6px; top: 6px; z-index: 2;
      font-family: var(--font-mono); font-size: 11px; font-weight: 700;
      background: rgba(6,12,24,.85); color: var(--warn);
      border: 1px solid var(--warn); padding: 2px 6px;
    }
    .waiting-strip {
      display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
      max-width: 90%;
    }
    .waiting-chip {
      font-size: 11px; padding: 4px 8px;
      border: 1px solid rgba(56,189,248,.35);
      background: rgba(0,0,0,.35); color: var(--muted);
      max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .table-arena {
      position: relative;
      border: 1px solid var(--table-edge);
      background:
        radial-gradient(ellipse 70% 55% at 50% 48%, rgba(34,211,238,.12), transparent 60%),
        linear-gradient(180deg, rgba(8,24,48,.9), var(--table));
      box-shadow: inset 0 0 60px rgba(34,211,238,.08), 0 0 30px rgba(0,0,0,.35);
      overflow: hidden;
      min-height: 0;
    }
    .table-arena::before {
      content: "";
      position: absolute; inset: 18px;
      border: 1px dashed rgba(56,189,248,.28);
      border-radius: 50% / 18%;
      pointer-events: none;
    }
    .table-glow {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(circle at 50% 100%, rgba(56,189,248,.18), transparent 45%);
      animation: pulse 4.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: .55; }
      50% { opacity: 1; }
    }

    .zones {
      position: absolute; inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 44px 56px 18px;
      gap: 14px;
    }
    .zone-label {
      position: absolute; left: 20px; top: 14px;
      font-family: var(--font-display); font-size: 10px;
      letter-spacing: 0.28em; color: var(--cyan-dim);
    }
    .stage-row, .back-row, .cx-row {
      display: flex; align-items: flex-end; justify-content: center;
      gap: 10px; position: relative; z-index: 1;
      flex-wrap: nowrap;
    }
    .back-row { align-items: center; gap: 8px; }
    .cx-row {
      padding-top: 10px;
      border-top: 1px solid rgba(56,189,248,.2);
      min-height: 0;
      gap: 18px;
      width: 100%;
    }

    .card-slot {
      position: relative;
      width: 138px; height: 214px;
      flex: 0 0 auto;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(56,189,248,.45);
      box-shadow: 0 10px 24px rgba(0,0,0,.45), 0 0 16px rgba(34,211,238,.28);
      background: #0a1528;
      transform: translateY(0);
      animation: cardIn .7s ease both;
      transition: transform .25s, box-shadow .25s;
    }
    .card-slot:hover {
      transform: translateY(-12px) scale(1.05);
      box-shadow: 0 18px 32px rgba(0,0,0,.5), 0 0 24px var(--glow);
      z-index: 5;
    }
    .card-slot img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      background: transparent;
    }
    .card-slot img.is-missing { display: none; }
    .card-face {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 28px 10px 26px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.08), transparent 35%),
        linear-gradient(160deg, #12263f, #0a1528 55%, #07101c);
    }
    .card-face::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px;
      background: var(--card-color, var(--cyan));
      box-shadow: 0 0 12px var(--card-color, var(--cyan));
    }
    .card-face .fname {
      font-size: 13px; font-weight: 700; line-height: 1.35;
      color: #f2f8ff; max-height: 4.5em; overflow: hidden;
      word-break: break-word;
    }
    .card-face .fmeta {
      font-family: var(--font-mono); font-size: 11px; color: var(--muted);
    }
    .card-slot.has-art .card-face { display: none; }
    .card-slot .qty {
      position: absolute; right: 6px; bottom: 6px; z-index: 2;
      font-family: var(--font-mono); font-size: 13px; font-weight: 700;
      background: rgba(6,12,24,.85); color: var(--cyan);
      border: 1px solid var(--cyan); padding: 2px 7px;
    }
    .card-slot .lv, .hand-card .lv {
      position: absolute; left: 6px; top: 6px; z-index: 2;
      font-family: var(--font-mono); font-size: 12px;
      background: rgba(6,12,24,.8); color: #fff; padding: 2px 6px;
      border-left: 2px solid var(--accent);
    }
    .card-slot.is-cx { width: 196px; height: 140px; }
    .card-slot.is-cx .card-face { padding: 24px 14px 24px 16px; }
    .card-slot.is-cx .fname { font-size: 15px; }
    .card-slot.is-cx img { object-fit: cover; }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(18px) scale(.94); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .pile {
      width: 58px; height: 80px;
      border-radius: 6px;
      border: 1px solid rgba(56,189,248,.4);
      background:
        repeating-linear-gradient(135deg, rgba(34,211,238,.15) 0 6px, transparent 6px 12px),
        #0b1c33;
      box-shadow: 0 6px 16px rgba(0,0,0,.4);
      display: grid; place-items: center;

    .screen.is-focus-rules .dim-odds,

  </style>
</head>

  <script src="assets/js/ws-decklog.js"></script>
  <script src="assets/js/ws-trigger-map.js?v=20261027c"></script>
  <script>
(function () {
  "use strict";

  const LATEST_BY_CARD_BASE = "https://storage.googleapis.com/divine-vehicle-292507.appspot.com/json/report/latestByCard_";
  const OPENING_HAND = 5;
  const GUIDE = { level0: [14, 18], level1: [10, 14], level2: [2, 8], level3: [8, 10] };

  const COLOR_MAP = {
    "黄": "#eab308", "黃": "#eab308", "yellow": "#eab308",
    "緑": "#22c55e", "綠": "#22c55e", "green": "#22c55e",
    "赤": "#ef4444", "red": "#ef4444",
    "青": "#3b82f6", "blue": "#3b82f6",
    "無": "#94a3b8", "未標": "#64748b"
  };

  /* 舊版曾把 B/C 對錯（B=門、C=書）；改由 WsTriggerMap 統一（B=磚、C=木門、D=書、F=寶袋） */
  let TRIGGER_LABEL = (window.WsTriggerMap && window.WsTriggerMap.codeToLabelMap()) || {
    "0": "無", "1": "魂+1", "2": "魂+2"
  };
  if (window.WsTriggerMap && typeof window.WsTriggerMap.ready === "function") {
    window.WsTriggerMap.ready().then(function () {
      TRIGGER_LABEL = window.WsTriggerMap.codeToLabelMap();
    });
  }

  const charts = {};
  let deckCards = [];
  let lastStats = null;
  let deckLabel = "BanG Dream! 示範牌組";
  let simUid = 0;
  let simAnimating = false;
  const simState = {
    deck: [],
    hand: [],
    waiting: [],
    selected: new Set(),
    phase: "idle",
    log: ""
  };

  function el(id) { return document.getElementById(id); }

  function normalizeColor(c) {
    if (c === "緑") return "綠";
    return c || "未標";
  }

  function wsImageUrlFromCardNo(cardNo) {
    if (window.WsDecklog && typeof WsDecklog.wsImageUrlFromCardNo === "function") {
      return WsDecklog.wsImageUrlFromCardNo(cardNo) || "";
    }
    return "";
  }

  function normalizeDeckCards(cards) {
    return (cards || []).map(function (c) {
      return {
        cardNo: c.cardNo || "",
        name: c.name || c.cardNo || "未命名",
        kindLabel: c.kindLabel || c.kindClass || "",
        color: normalizeColor(c.color),
        level: c.level,
        cost: c.cost,
        trigger: c.trigger != null ? String(c.trigger) : "",
        imageUrl: c.imageUrl || (c.cardNo ? wsImageUrlFromCardNo(c.cardNo) : ""),
        features: c.features || []
      };
    });
  }

  function aggregateByCard(cards) {
    const map = new Map();
    cards.forEach(function (c) {
      const key = c.cardNo || c.name;
      if (!map.has(key)) map.set(key, Object.assign({}, c, { qty: 0 }));
      map.get(key).qty += 1;
    });
    return Array.from(map.values()).sort(function (a, b) {
      const la = Number(a.level), lb = Number(b.level);
      if (!isNaN(la) && !isNaN(lb) && la !== lb) return la - lb;
      return String(a.cardNo).localeCompare(String(b.cardNo));
    });
  }

  function classifyKind(c) {
    if (window.WsDecklog && typeof WsDecklog.classifyKind === "function") {
      return WsDecklog.classifyKind(c);
    }
    const k = String(c.kindLabel || c.kindClass || "");
    if (/CX|名場|climax/i.test(k)) return "CX";
    if (/事件|event/i.test(k)) return "事件";
    if (/角色|character|chara/i.test(k)) return "角色";
    return "未知";
  }

  function analyze(cards) {
    const total = cards.length;
    const levelCount = { 0: 0, 1: 0, 2: 0, 3: 0, other: 0 };
    const colorCount = {};
    const kindCount = { "角色": 0, "事件": 0, "CX": 0, "未知": 0 };
    const costCount = {};
    const triggerCount = {};
    let cx = 0;
    cards.forEach(function (c) {
      const kind = classifyKind(c);
      kindCount[kind] = (kindCount[kind] || 0) + 1;
      if (kind === "CX") cx += 1;
      if (kind !== "CX") {
        const lv = Number(c.level);
        if (lv === 0 || lv === 1 || lv === 2 || lv === 3) levelCount[lv] += 1;
        else levelCount.other += 1;
        const cost = c.cost != null && !isNaN(Number(c.cost)) ? String(Number(c.cost)) : "?";
        costCount[cost] = (costCount[cost] || 0) + 1;
      }
      const color = c.color || "未標";
      colorCount[color] = (colorCount[color] || 0) + 1;
      const trigKey = String(c.trigger != null ? c.trigger : "?");
      triggerCount[trigKey] = (triggerCount[trigKey] || 0) + 1;
    });
    return { total: total, cx: cx, levelCount: levelCount, colorCount: colorCount, kindCount: kindCount, costCount: costCount, triggerCount: triggerCount };
  }

  function hyperAtLeastOne(K, N, n) {
    if (n <= 0 || N <= 0 || K <= 0) return 0;
    if (K >= N) return 1;
    if (N - K < n) return 1;
    let pNone = 1;
    for (let i = 0; i < n; i++) pNone *= (N - K - i) / (N - i);
    return Math.max(0, Math.min(1, 1 - pNone));
  }

  function formatPct(p) { return (Math.round(p * 1000) / 10).toFixed(1) + "%"; }
  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function inGuide(n, range) { return n >= range[0] && n <= range[1]; }

  function themeColors() {
    const dark = document.documentElement.getAttribute("data-theme") !== "light";
    return {
      dark: dark,
      text: dark ? "#8fb3d1" : "#4a6b86",
      ink: dark ? "#e8f4ff" : "#0f2744",
      line: dark ? "rgba(56,189,248,0.2)" : "rgba(14,116,144,0.2)",
      cyan: dark ? "#22d3ee" : "#0e7490",
      accent: dark ? "#38bdf8" : "#0284c7"
    };
  }

  function toast(msg) {
    const t = el("toast");
    t.textContent = msg;
    t.classList.add("is-show");
    clearTimeout(toast._timer);
    toast._timer = setTimeout(function () { t.classList.remove("is-show"); }, 2200);
  }

  const DESIGN_W = 1920;
  const DESIGN_H = 1080;

  function viewportSize() {
    // 用 client* 避開捲軸寬度誤差；visualViewport 再校正行動瀏覽器／縮放
    var w = document.documentElement.clientWidth || window.innerWidth || DESIGN_W;
    var h = document.documentElement.clientHeight || window.innerHeight || DESIGN_H;
    try {
      if (window.visualViewport) {
        w = window.visualViewport.width || w;
        h = window.visualViewport.height || h;
      }
    } catch (e) { /* ignore */ }
    return { w: Math.max(1, w), h: Math.max(1, h) };
  }

  function fitScreen() {
    var screen = el("screen");
    var box = el("scaleBox");
    if (!screen || !box) return;
    var vp = viewportSize();
    // 等比縮放（letterbox），不拉伸，避免畫面「歪掉」
    var s = Math.min(vp.w / DESIGN_W, vp.h / DESIGN_H);
    // 避免浮點造成 1px 縫隙
    s = Math.floor(s * 1000) / 1000;
    if (!isFinite(s) || s <= 0) s = 1;
    box.style.width = Math.round(DESIGN_W * s) + "px";
    box.style.height = Math.round(DESIGN_H * s) + "px";
    screen.style.transform = "scale(" + s + ")";
    screen.style.transformOrigin = "0 0";
    screen.dataset.scale = String(s);
  }

  function tickClock() {
    const now = new Date();
    const pad = function (n) { return String(n).padStart(2, "0"); };
    el("clock").textContent = pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
    const days = ["日", "一", "二", "三", "四", "五", "六"];
    el("dateLine").textContent = now.getFullYear() + "/" + pad(now.getMonth() + 1) + "/" + pad(now.getDate()) + " 週" + days[now.getDay()];
  }

  function renderRules(stats) {
    const items = [
      {
        label: "總張數",
        value: stats.total + " / 50",
        detail: stats.total === 50 ? "符合構築" : (stats.total < 50 ? "少 " + (50 - stats.total) + " 張" : "多 " + (stats.total - 50) + " 張"),
        state: stats.total === 50 ? "pass" : "fail"
      },
      {
        label: "Climax",
        value: stats.cx + " / 8",
        detail: stats.cx === 8 ? "CX 張數正確" : "標準應為正好 8 張",
        state: stats.cx === 8 ? "pass" : "fail"
      }
    ];
    el("ruleGrid").innerHTML = items.map(function (it) {
      return '<div class="rule is-' + it.state + '"><div class="label">' + it.label + '</div><div class="value">' + it.value + '</div><div class="detail">' + it.detail + "</div></div>";
    }).join("");

    const rows = [
      { tag: "Level 0", num: stats.levelCount[0], max: 20, ok: inGuide(stats.levelCount[0], GUIDE.level0) },
      { tag: "Level 1", num: stats.levelCount[1], max: 16, ok: inGuide(stats.levelCount[1], GUIDE.level1) },
      { tag: "Level 2", num: stats.levelCount[2], max: 12, ok: inGuide(stats.levelCount[2], GUIDE.level2) },
      { tag: "Level 3", num: stats.levelCount[3], max: 12, ok: inGuide(stats.levelCount[3], GUIDE.level3) }
    ];
    el("levelBars").innerHTML = rows.map(function (r) {
      const pct = Math.min(100, Math.round((r.num / r.max) * 100));
      return '<div class="lv-row"><span class="tag">' + r.tag + '</span><div class="lv-track"><div class="lv-fill" style="width:' + pct + '%;opacity:' + (r.ok ? 1 : 0.7) + '"></div></div><span class="num" style="color:' + (r.ok ? "var(--good)" : "var(--warn)") + '">' + r.num + "</span></div>";
    }).join("");
  }

  function renderOdds(cards, stats) {
    const N = cards.length || 50;
    const aggregated = aggregateByCard(cards);
    const chars = aggregated.filter(function (c) { return classifyKind(c) === "角色"; })
      .sort(function (a, b) { return b.qty - a.qty; }).slice(0, 4);
    const items = [
      { name: "任意 Climax", meta: "CX ×" + stats.cx, qty: stats.cx },
      { name: "任意 Level 0", meta: "Lv0 ×" + stats.levelCount[0], qty: stats.levelCount[0] }
    ].concat(chars.map(function (c) {
      return { name: c.name, meta: c.cardNo + " · ×" + c.qty, qty: c.qty };
    }));
    el("oddsList").innerHTML = items.map(function (it) {
      const p = hyperAtLeastOne(it.qty, N, OPENING_HAND);
      return '<div class="odds-item"><div><div class="name">' + escapeHtml(it.name) + '</div><div class="meta">' + escapeHtml(it.meta) + '</div></div><div class="pct">' + formatPct(p) + "</div></div>";
    }).join("");
  }

  function renderTable(cards) {
    const agg = aggregateByCard(cards);
    const chars = agg.filter(function (c) { return classifyKind(c) === "角色"; });
    const cxs = agg.filter(function (c) { return classifyKind(c) === "CX"; });
    const front = chars.filter(function (c) { return Number(c.level) >= 2; });
    const back = chars.filter(function (c) { return Number(c.level) < 2; });

    function slot(c, isCx, delay) {
      const img = c.imageUrl || "";
      const hex = COLOR_MAP[c.color] || "#64748b";
      const shortName = String(c.name || "").replace(/^["“]|["”]$/g, "");
      return '<div class="card-slot' + (isCx ? " is-cx" : "") + '" style="animation-delay:' + delay + 'ms;--card-color:' + hex + '" title="' + escapeHtml(c.name) + '">' +
        (isCx ? "" : '<span class="lv">Lv' + c.level + "</span>") +
        '<div class="card-face"><div class="fname">' + escapeHtml(shortName) + '</div><div class="fmeta">' + escapeHtml(c.cardNo) + "</div></div>" +
        '<img src="' + img + '" alt="" loading="lazy" referrerpolicy="no-referrer" onload="this.parentElement.classList.add(\'has-art\')" onerror="this.classList.add(\'is-missing\')">' +
        '<span class="qty">×' + c.qty + "</span></div>";
    }

    el("rowBack").innerHTML = back.map(function (c, i) { return slot(c, false, 40 + i * 50); }).join("");
    el("rowFront").innerHTML = front.map(function (c, i) { return slot(c, false, 80 + i * 55); }).join("");
    el("rowCx").innerHTML = cxs.map(function (c, i) { return slot(c, true, 120 + i * 60); }).join("");

  async function loadPrice(stats, cards) {
    el("priceMain").textContent = "—";
    el("priceMeta").textContent = "載入行情中…";
    el("kpiKinds").textContent = ["角色", "事件", "CX"].filter(function (k) { return stats.kindCount[k]; }).length + " 類";
    el("kpiAvg").textContent = "—";

    try {
      const titles = new Set();
      cards.forEach(function (c) {
        const m = String(c.cardNo).match(/^([A-Za-z0-9]+)\/([A-Za-z0-9]+)-/);
        if (m) titles.add(m[1] + "_" + m[2]);
      });
      const maps = {};
      await Promise.all(Array.from(titles).map(async function (tc) {
        try {
          const r = await fetch(LATEST_BY_CARD_BASE + encodeURIComponent(tc) + ".json", { cache: "no-store" });
          if (!r.ok) return;
          maps[tc] = await r.json();
        } catch (e) { /* ignore */ }
      }));

      let sum = 0, hit = 0, missing = 0;
      const seen = new Set();
      aggregateByCard(cards).forEach(function (c) {
        if (!c.cardNo || seen.has(c.cardNo)) return;
        seen.add(c.cardNo);
        const m = c.cardNo.match(/^([A-Za-z0-9]+)\/([A-Za-z0-9]+)-/);
        if (!m) { missing += c.qty; return; }
        const tc = m[1] + "_" + m[2];
        const pack = maps[tc];
        const row = pack && (pack[c.cardNo] || (pack.cards && pack.cards[c.cardNo]));
        const price = row && (typeof row.latestPrice === "number" ? row.latestPrice : Number(row.price));
        if (typeof price === "number" && !isNaN(price)) {
          sum += price * c.qty;
          hit += c.qty;
        } else {
          missing += c.qty;
        }
      });

      if (hit > 0) {
        el("priceMain").textContent = "¥" + Math.round(sum).toLocaleString("ja-JP");
        el("priceMeta").textContent = "已對應 " + hit + " 張" + (missing ? " · 缺 " + missing + " 張行情" : "") + " · 遊遊亭 latestByCard";
        el("kpiAvg").textContent = "¥" + Math.round(sum / hit).toLocaleString("ja-JP");
      } else {
        el("priceMain").textContent = "—";
        el("priceMeta").textContent = "行情來源暫時無法取得，結構數據仍完整。";
        el("kpiAvg").textContent = "—";
      }
    } catch (e) {
      el("priceMeta").textContent = "行情略過（" + (e && e.message ? e.message : "error") + "）";
    }
  }

  /* ——— Shuffle / Opening / Mulligan ——— */
  function cloneSimCard(c) {
    simUid += 1;
    return {
      simId: "s" + simUid,
      cardNo: c.cardNo || "",
      name: c.name || c.cardNo || "未命名",
      kindLabel: c.kindLabel || "",
      color: c.color || "",
      level: c.level,
      cost: c.cost,
      trigger: c.trigger,
      imageUrl: c.imageUrl || (c.cardNo ? wsImageUrlFromCardNo(c.cardNo) : ""),
      kind: classifyKind(c)
    };
  }

  function fisherYates(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i];
      arr[i] = arr[j];
      arr[j] = t;
    }
    return arr;
  }

  function buildShuffledDeck(cards) {
    return fisherYates(cards.map(cloneSimCard));
  }

  function drawFromDeck(n) {
    var out = [];
    for (var i = 0; i < n; i++) {
      if (!simState.deck.length) break;
      out.push(simState.deck.pop());
    }
    return out;
  }

  function setSimPhase(phase, label) {
    simState.phase = phase;
    var node = el("simPhase");
    if (!node) return;
    node.textContent = label;
    node.className = "sim-phase" + (
      phase === "opening" ? " is-mull" :
      phase === "done" ? " is-done" :
      phase === "idle" && label !== "尚未開始" ? " is-ready" : ""
    );
  }

  function updateSimButtons() {
    var hasDeck = deckCards.length > 0;
    var opening = simState.phase === "opening";
    var done = simState.phase === "done";
    var active = opening || done;
    var busy = simAnimating;
    var deal = el("btnSimDeal");
    var mull = el("btnSimMulligan");
    var endBtn = el("btnSimEnd");
    if (!deal || !mull) return;
    deal.disabled = !hasDeck || busy;
    deal.textContent = active ? "重新洗牌起手" : "洗牌並起手";
    mull.hidden = !opening;
    mull.disabled = !opening || simState.selected.size === 0 || busy;
    var n = simState.selected.size;
    mull.textContent = n ? ("確認調度（" + n + "）") : "確認調度";
    if (endBtn) {
      endBtn.hidden = !active;
      endBtn.disabled = busy;
    }
  }

  function handCardHtml(c, delay, entering) {
    var hex = COLOR_MAP[c.color] || "#64748b";
    var kind = c.kind || classifyKind(c);
    var isCx = kind === "CX";
    var selected = simState.selected.has(c.simId);
    var shortName = String(c.name || "").replace(/^["“]|["”]$/g, "");
    var badge = isCx
      ? '<span class="cx-tag">CX</span>'
      : ((c.level != null && !isNaN(c.level)) ? ('<span class="lv">Lv' + c.level + "</span>") : "");
    return '<button type="button" class="hand-card' + (isCx ? " is-cx" : "") +
      (selected ? " is-selected" : "") +
      (entering ? " is-entering" : "") +
      '" data-sim-id="' + escapeHtml(c.simId) + '"' +
      (entering ? (' style="animation-delay:' + delay + 'ms;--card-color:' + hex + '"') : (' style="--card-color:' + hex + '"')) +
      ' aria-pressed="' + (selected ? "true" : "false") + '"' +
      ' title="' + escapeHtml(c.name) + '">' +
      badge +
      '<div class="card-face"><div class="fname">' + escapeHtml(shortName) +
      '</div><div class="fmeta">' + escapeHtml(kind + (c.cardNo ? " · " + c.cardNo : "")) + "</div></div>" +
      (c.imageUrl
        ? ('<img src="' + escapeHtml(c.imageUrl) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onload="this.parentElement.classList.add(\'has-art\')" onerror="this.classList.add(\'is-missing\')">')
        : "") +
      "</button>";
  }

  function renderSimHand(opts) {
    opts = opts || {};
    var overlay = el("handOverlay");
    var row = el("handRow");
    if (!overlay || !row) return;
    if (!simState.hand.length || simState.phase === "idle") {
      overlay.classList.remove("is-open");
      row.innerHTML = "";
      return;
    }
    overlay.classList.add("is-open");
    var entering = !!opts.dealAnimate;
    row.innerHTML = simState.hand.map(function (c, i) {
      return handCardHtml(c, i * 60, entering);
    }).join("");
    if (entering) {
      // 進場動畫結束後移除，避免之後 hover／選取被動畫干擾
      window.setTimeout(function () {
        Array.prototype.forEach.call(row.querySelectorAll(".hand-card.is-entering"), function (node) {
          node.classList.remove("is-entering");
          node.style.animationDelay = "";
        });
      }, 700);
    }
  }

  function renderSimWaiting() {
    var strip = el("waitingStrip");
    if (!strip) return;
    if (!simState.waiting.length) {
      strip.innerHTML = "";
      return;
    }
    strip.innerHTML = simState.waiting.map(function (c) {
      return '<span class="waiting-chip" title="' + escapeHtml(c.cardNo || "") + '">' +
        escapeHtml(c.name) + "</span>";
    }).join("");
  }

  function renderSimPiles() {
    if (simState.phase === "idle") {
      el("pileDeck").textContent = String(deckCards.length || 0);
      el("pileWait").textContent = "0";
      return;
    }
    el("pileDeck").textContent = String(simState.deck.length);
    el("pileWait").textContent = String(simState.waiting.length);
  }

  function renderSimAll(opts) {
    renderSimHand(opts);
    renderSimWaiting();
    renderSimPiles();
    updateSimButtons();
    el("simLog").textContent = simState.log || "";
    el("modeBadge").textContent = simState.phase === "idle" ? "VIRTUAL TABLE" : "HAND SIM";
  }

  function resetSimUi(opts) {
    opts = opts || {};
    simAnimating = false;
    simState.deck = [];
    simState.hand = [];
    simState.waiting = [];
    simState.selected = new Set();
    simState.phase = "idle";
    simState.log = opts.log != null
      ? opts.log
      : (deckCards.length
        ? "點「洗牌並起手」抽 5 張 → 點選要換掉的牌 →「確認調度」。"
        : "請先匯入 DeckLog 或載入示範牌組。");
    setSimPhase("idle", deckCards.length ? "可開始模擬" : "尚未開始");
    renderSimAll();
    // 結束模擬時回到總覽，並刷新 DECK 張數
    if (opts.exitFocus) {
      document.querySelectorAll(".nav-item").forEach(function (b) { b.classList.remove("is-active"); });
      var allBtn = document.querySelector('.nav-item[data-focus="all"]');
      if (allBtn) allBtn.classList.add("is-active");
      var screen = el("screen");
      if (screen) {
        var loading = screen.classList.contains("is-loading");
        screen.className = "screen hud" + (loading ? " is-loading" : "");
      }
    }
    if (deckCards.length) {
      el("pileDeck").textContent = String(deckCards.length);
      el("pileWait").textContent = "0";
    }
  }

  function endSimSession() {
    if (simAnimating) return;
    if (simState.phase === "idle") return;
    resetSimUi({
      exitFocus: true,
      log: "已結束模擬，回到牌桌總覽。可再按「洗牌並起手」重來。"
    });
    toast("已結束模擬");
  }

  function simDealOpening() {
    if (!deckCards.length) {
      toast("請先匯入牌組");
      return;
    }
    if (simAnimating) return;
    simState.deck = buildShuffledDeck(deckCards);
    simState.hand = drawFromDeck(OPENING_HAND);
    simState.waiting = [];
    simState.selected = new Set();
    simState.phase = "opening";
    simState.log = "已洗牌並抽出起手 " + simState.hand.length + " 張。點選要換掉的牌，再按「確認調度」。";
    setSimPhase("opening", "可調度");
    // 切到底欄「模擬」焦點
    document.querySelectorAll(".nav-item").forEach(function (b) { b.classList.remove("is-active"); });
    var nav = el("navSim");
    if (nav) nav.classList.add("is-active");
    var screen = el("screen");
    screen.className = "screen hud is-focus-sim";
    renderSimAll({ dealAnimate: true });
  }

  function toggleSimSelect(simId, cardEl) {
    if (simState.phase !== "opening" || simAnimating) return;
    var card = cardEl || (el("handRow") && el("handRow").querySelector('[data-sim-id="' + simId + '"]'));
    if (simState.selected.has(simId)) {
      simState.selected.delete(simId);
      if (card) {
        card.classList.remove("is-selected");
        card.setAttribute("aria-pressed", "false");
      }
    } else {
      simState.selected.add(simId);
      if (card) {
        card.classList.add("is-selected");
        card.setAttribute("aria-pressed", "true");
      }
    }
    // 只更新按鈕文字，不重繪整排手牌（避免每張卡重新載入／閃爍）
    updateSimButtons();
  }

  function finishSimMulligan(dump, drawn) {
    simState.waiting = simState.waiting.concat(dump);
    simState.hand = simState.hand.filter(function (c) {
      return !simState.selected.has(c.simId);
    }).concat(drawn);
    var dumpN = dump.length;
    simState.selected = new Set();
    simState.phase = "done";
    simState.log = "調度完成：丟棄 " + dumpN + " 張至等待室，補抽 " + drawn.length + " 張。";
    setSimPhase("done", "調度完成");
    simAnimating = false;
    renderSimAll({ dealAnimate: true });
  }

  function applySimMulligan() {
    if (simState.phase !== "opening" || simAnimating) return;
    var ids = Array.from(simState.selected);
    if (!ids.length) return;
    if (simState.deck.length < ids.length) {
      simState.log = "牌庫剩餘不足，無法重抽 " + ids.length + " 張（剩 " + simState.deck.length + "）。";
      el("simLog").textContent = simState.log;
      return;
    }
    var dump = [];
    for (var i = 0; i < simState.hand.length; i++) {
      if (simState.selected.has(simState.hand[i].simId)) dump.push(simState.hand[i]);
    }
    var drawn = drawFromDeck(dump.length);
    simAnimating = true;
    updateSimButtons();
    window.setTimeout(function () {
      finishSimMulligan(dump, drawn);
    }, 280);
  }

  function setLoading(on) {
    var screen = el("screen");
    if (!screen) return;
    screen.classList.toggle("is-loading", !!on);
    el("btnImport").disabled = !!on;
    el("btnSample").disabled = !!on;
  }

  function applyDeck(cards, label) {
    deckCards = normalizeDeckCards(cards);
    deckLabel = label || "牌組";
    el("deckName").textContent = deckLabel;
    lastStats = analyze(deckCards);
    renderRules(lastStats);
    renderOdds(deckCards, lastStats);
    renderTable(deckCards);
    renderLegend(lastStats);
    renderCharts(lastStats);
    loadPrice(lastStats, deckCards);
    resetSimUi();
    resizeCharts();
  }

  async function importByCode(code) {
    if (!window.WsDecklog) throw new Error("WsDecklog 未載入");
    var trimmed = String(code || "").trim();
    if (!trimmed) throw new Error("請輸入 DeckLog 代碼");
    setLoading(true);
    toast("正在取得 DeckLog…");
    try {
      var result = await WsDecklog.fetchDecklogByCode(trimmed);
      applyDeck(result.cards, "DeckLog " + (result.code || trimmed));
      toast("已匯入 " + result.cards.length + " 張");
    } finally {
      setLoading(false);
    }
  }

  async function loadSampleDeck() {
    setLoading(true);
    toast("載入示範牌組…");
    try {
      if (window.WsDecklog && typeof WsDecklog.loadSampleBandDeck === "function") {
        var result = await WsDecklog.loadSampleBandDeck();
        applyDeck(result.cards, "BanG Dream! 示範牌組");
      } else {
        throw new Error("無法載入示範牌組");
      }
      toast("已載入示範牌組");
    } finally {
      setLoading(false);
    }
  }

  function bindImportAndSim() {
    el("importForm").addEventListener("submit", function (e) {
      e.preventDefault();
      importByCode(el("deckCode").value).catch(function (err) {
        toast(err && err.message ? err.message : String(err));
      });
    });
    el("btnSample").addEventListener("click", function () {
      loadSampleDeck().catch(function (err) {
        toast(err && err.message ? err.message : String(err));
      });
    });
    el("btnSimDeal").addEventListener("click", simDealOpening);
    el("btnSimMulligan").addEventListener("click", applySimMulligan);
    el("btnSimEnd").addEventListener("click", endSimSession);
    el("btnSimEndOverlay").addEventListener("click", endSimSession);
    el("handRow").addEventListener("click", function (e) {
      var btn = e.target.closest(".hand-card[data-sim-id]");
      if (!btn) return;
      toggleSimSelect(btn.getAttribute("data-sim-id"), btn);
    });
    // Esc 結束模擬
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && (simState.phase === "opening" || simState.phase === "done")) {
        endSimSession();
      }
    });
  }

  function bindTheme() {
    el("btnTheme").addEventListener("click", function () {
      const root = document.documentElement;
      const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("ws-screen-theme", next); } catch (e) { /* ignore */ }
      if (lastStats) renderCharts(lastStats);
      toast(next === "dark" ? "已切換深藍霓虹" : "已切換淺色科技風");
    });
    try {
      const saved = localStorage.getItem("ws-screen-theme");
      if (saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
    } catch (e) { /* ignore */ }
  }

  function bindFullscreen() {
    var btn = el("btnFullscreen");
    if (!btn) return;
    btn.addEventListener("click", function () {
      var root = document.documentElement;
      try {
        if (!document.fullscreenElement) {
          (root.requestFullscreen || root.webkitRequestFullscreen || root.msRequestFullscreen).call(root);
        } else {
          (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document);
        }
      } catch (e) {
        toast("此瀏覽器無法進入全螢幕");
      }
    });
  }

  function onViewportChange() {
    fitScreen();
    resizeCharts();
  }

  function boot() {
    fitScreen();
    tickClock();
    setInterval(tickClock, 1000);
    window.addEventListener("resize", onViewportChange);
    window.addEventListener("orientationchange", onViewportChange);
    document.addEventListener("fullscreenchange", onViewportChange);
    try {
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", onViewportChange);
        window.visualViewport.addEventListener("scroll", onViewportChange);
      }
    } catch (e) { /* ignore */ }
    bindNav();
    bindTheme();
    bindFullscreen();
    bindImportAndSim();

    requestAnimationFrame(function () {
      onViewportChange();
      setTimeout(onViewportChange, 120);
    });

    // URL ?code= 可直接帶 DeckLog；否則載入示範
    var params = new URLSearchParams(window.location.search || "");
    var code = params.get("code");
    if (code) {
      el("deckCode").value = code;
      importByCode(code).catch(function (err) {
        toast(err && err.message ? err.message : String(err));
        return loadSampleDeck();
      });
    } else {
      loadSampleDeck().catch(function (err) {
        toast(err && err.message ? err.message : String(err));
        resetSimUi();
      });
    }
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
  </script>
</body>
</html>
