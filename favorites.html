<script>
  function toggleCustomDrawer(e) {
    if (e) e.preventDefault();
    var drawer = document.getElementById('customDrawer');
    var overlay = document.getElementById('customDrawerOverlay');
    if (drawer && overlay) {
      drawer.classList.toggle('open');
      overlay.classList.toggle('active');
      var btn = document.getElementById('leftbar');
      if (btn) {
        var opened = drawer.classList.contains('open');
        btn.classList.toggle('is-open', opened);
        btn.setAttribute('aria-expanded', opened ? 'true' : 'false');
        btn.setAttribute('aria-label', opened ? '關閉選單' : '開啟選單');
      }
    }
  }

  function toggleSubmenu(element, e) {
    if (e) e.preventDefault();
    var parent = element.parentElement;
    if (!parent) return;
    parent.classList.toggle('open');
    var submenu = parent.querySelector('.submenu');
    if (submenu) {
      submenu.style.display = parent.classList.contains('open') ? 'block' : 'none';
    }
  }

  (function () {
    var STORAGE_KEY = 'wsCardsFavorites';
    var PRICE_CACHE_KEY = 'wsFavPriceCache';
    var PRICE_TTL_MS = 12 * 60 * 60 * 1000;
    var MAX_ITEMS = 100;
    var PRICE_BASE = 'https://storage.googleapis.com/divine-vehicle-292507.appspot.com/json/cardData/';
    var PRICE_LOCAL_FALLBACKS = ['scrapy/mercariData/', 'json/cardData/'];

    var fb = window.WsFirebase;
    var cloudUser = null;
    var allItems = [];
    var checkedSet = {};
    var filterQuery = '';
    var sortMode = 'newest';
    var priceCache = {};
    var setJsonCache = {};
    var priceLoadToken = 0;

    var listEl = document.getElementById('favList');
    var emptyEl = document.getElementById('favEmpty');
    var emptyTextEl = document.getElementById('favEmptyText');
    var countEl = document.getElementById('favCountLabel');
    var statusEl = document.getElementById('favStatus');
    var searchInput = document.getElementById('favSearchInput');
    var sortSelect = document.getElementById('favSortSelect');
    var totalValueEl = document.getElementById('favTotalValue');
    var totalSubEl = document.getElementById('favTotalSub');

    function setStatus(msg, kind) {
      statusEl.textContent = msg || '';
      statusEl.classList.remove('is-error', 'is-ok');
      if (kind) statusEl.classList.add(kind);
    }

    function normalizeText(value) {
      if (value === null || value === undefined) return '';
      var text = String(value).trim();
      return (text === '-' || text === '?') ? '' : text;
    }

    function readLocal() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        console.error(e);
        return [];
      }
    }

    function writeLocal(list) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list || []));
      } catch (e) {
        console.error(e);
      }
    }

    function readPriceCache() {
      try {
        var raw = localStorage.getItem(PRICE_CACHE_KEY);
        var data = raw ? JSON.parse(raw) : {};
        return data && typeof data === 'object' ? data : {};
      } catch (e) {
        return {};
      }
    }

    function writePriceCache() {
      try {
        localStorage.setItem(PRICE_CACHE_KEY, JSON.stringify(priceCache));
      } catch (e) {
        console.error(e);
      }
    }

    function canUseCloud() {
      return !!(fb && fb.ready && fb.firestoreReady && cloudUser);
    }

    function mergeLists(localList, remoteList) {
      var map = {};
      function upsert(item) {
        if (!item || !item.cardNumber) return;
        var key = String(item.cardNumber).trim();
        if (!key) return;
        var ts = typeof item.timestamp === 'number' ? item.timestamp : 0;
        var prev = map[key];
        if (!prev || ts >= (prev.timestamp || 0)) {
          map[key] = {
            cardNumber: key,
            cardName: normalizeText(item.cardName),
            cardRare: normalizeText(item.cardRare),
            cardTitle: normalizeText(item.cardTitle),
            source: normalizeText(item.source) || 'line',
            timestamp: ts || Date.now(),
            priceJPY: null,
            priceAsOf: '',
            priceStatus: 'idle'
          };
        }
      }
      (localList || []).forEach(upsert);
      (remoteList || []).forEach(upsert);
      return Object.keys(map)
        .map(function (k) { return map[k]; })
        .sort(function (a, b) { return (b.timestamp || 0) - (a.timestamp || 0); })
        .slice(0, MAX_ITEMS);
    }

    function pushMissingToCloud(merged, remoteList) {
      if (!canUseCloud()) return Promise.resolve();
      var remoteKeys = {};
      (remoteList || []).forEach(function (item) {
        if (item && item.cardNumber) remoteKeys[item.cardNumber] = true;
      });
      var missing = (merged || []).filter(function (item) {
        return item && item.cardNumber && !remoteKeys[item.cardNumber];
      });
      var chain = Promise.resolve();
      missing.forEach(function (item) {
        chain = chain.then(function () {
          return fb.addCardFavorite(item).catch(function (err) {
            console.error('上傳收藏失敗:', item.cardNumber, err);
          });
        });
      });
      return chain;
    }

    function getRareColor(rare) {
      if (!rare) return '#718096';
      var r = String(rare).toUpperCase();
      if (r.indexOf('SSP') >= 0 || r.indexOf('SEC') >= 0 || r.indexOf('SP') >= 0) return '#e53e3e';
      if (r.indexOf('SR') >= 0 || r.indexOf('OFR') >= 0) return '#d69e2e';
      if (r.indexOf('RRR') >= 0) return '#805ad5';
      if (r.indexOf('RR') >= 0) return '#3182ce';
      if (r.indexOf('R') >= 0) return '#38a169';
      return '#718096';
    }

    function rareRank(rare) {
      if (!rare) return 90;
      var r = String(rare).toUpperCase();
      if (r.indexOf('SSP') >= 0 || r.indexOf('SEC') >= 0) return 10;
      if (r.indexOf('SP') >= 0) return 20;
      if (r.indexOf('SR') >= 0 || r.indexOf('OFR') >= 0) return 30;
      if (r.indexOf('RRR') >= 0) return 40;
      if (r.indexOf('RR') >= 0) return 50;
      if (r.indexOf('R') >= 0) return 60;
      if (r.indexOf('U') >= 0) return 70;
      if (r.indexOf('C') >= 0) return 80;
      return 90;
    }

    function formatTime(ts) {
      if (!ts) return '—';
      var now = Date.now();
      var diff = now - ts;
      var minutes = Math.floor(diff / 60000);
      var hours = Math.floor(diff / 3600000);
      var days = Math.floor(diff / 86400000);
      if (minutes < 1) return '剛剛';
      if (minutes < 60) return minutes + ' 分鐘前';
      if (hours < 24) return hours + ' 小時前';
      if (days < 7) return days + ' 天前';
      var d = new Date(ts);
      return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatYen(n) {
      if (n === null || n === undefined || isNaN(n)) return '—';
      return '¥' + Number(n).toLocaleString('en-US');
    }

    function buildCardImageUrls(cardNumberDisplay) {
      var cardNum = String(cardNumberDisplay || '').trim();
      if (cardNum.indexOf(' ') >= 0) cardNum = cardNum.substr(0, cardNum.indexOf(' '));
      if (!cardNum || cardNum.indexOf('-') < 0) return { primary: '', fallback: '' };
      var cardFirst = cardNum.substr(0, 1);
      var cardSecond = cardNum.substr(0, cardNum.indexOf('-')).replace('/', '_');
      var cardThird = cardNum.replace('/', '_').replace('-', '_');
      return {
        primary: 'https://imgs.devilfox.net/ws/' + cardSecond.toLowerCase() + '/' + cardThird.toLowerCase() + '.png',
        fallback: 'https://ws-tcg.com/wordpress/wp-content/images/cardlist/' +
          cardFirst.toLowerCase() + '/' + cardSecond.toLowerCase() + '/' + cardThird.toLowerCase() + '.png'
      };
    }

    function setCodeFromCardNumber(cardNumber) {
      var n = String(cardNumber || '').trim();
      var dash = n.indexOf('-');
      if (dash < 0) return '';
      return n.slice(0, dash).replace(/\//g, '_');
    }

    function extractLatestPrice(cardInfo) {
      if (!cardInfo || !Array.isArray(cardInfo.cardPrice)) {
        return { priceJPY: null, asOf: '' };
      }
      var prices = cardInfo.cardPrice;
      var dates = Array.isArray(cardInfo.upddate) ? cardInfo.upddate : [];
      for (var i = prices.length - 1; i >= 0; i--) {
        var p = prices[i];
        if (p !== null && p !== undefined && p !== 0 && !isNaN(p)) {
          return {
            priceJPY: Number(p),
            asOf: dates[i] ? String(dates[i]) : ''
          };
        }
      }
      return { priceJPY: null, asOf: '' };
    }

    function applyCachedPrices(items) {
      var now = Date.now();
      (items || []).forEach(function (item) {
        var cached = priceCache[item.cardNumber];
        if (!cached) return;
        if (cached.fetchedAt && (now - cached.fetchedAt) > PRICE_TTL_MS) return;
        if (typeof cached.priceJPY === 'number') {
          item.priceJPY = cached.priceJPY;
          item.priceAsOf = cached.asOf || '';
          item.priceStatus = 'ready';
        } else if (cached.missing) {
          item.priceJPY = null;
          item.priceAsOf = '';
          item.priceStatus = 'missing';
        }
      });
    }

    function lookupPriceInSetJson(setJson, cardNumber) {
      if (!setJson || typeof setJson !== 'object') return null;
      var raw = String(cardNumber || '').trim();
      if (!raw) return { priceJPY: null, asOf: '' };

      var candidates = [raw];
      var underscored = raw.replace(/\//g, '_');
      if (underscored !== raw) candidates.push(underscored);
      if (raw.indexOf('/') < 0 && raw.indexOf('_') >= 0) {
        candidates.push(raw.replace('_', '/'));
      }

      for (var c = 0; c < candidates.length; c++) {
        if (setJson[candidates[c]]) return extractLatestPrice(setJson[candidates[c]]);
      }

      var lowerCandidates = candidates.map(function (k) { return String(k).toLowerCase(); });
      for (var key in setJson) {
        if (!Object.prototype.hasOwnProperty.call(setJson, key)) continue;
        var lowerKey = String(key).toLowerCase();
        for (var i = 0; i < lowerCandidates.length; i++) {
          if (lowerKey === lowerCandidates[i]) return extractLatestPrice(setJson[key]);
        }
      }
      return { priceJPY: null, asOf: '' };
    }

    function fetchJson(url) {
      return fetch(url, { credentials: 'omit' }).then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      });
    }

    function loadSetJson(setCode) {
      if (!setCode) return Promise.resolve(null);
      if (Object.prototype.hasOwnProperty.call(setJsonCache, setCode)) {
        return Promise.resolve(setJsonCache[setCode]);
      }
      var urls = [PRICE_BASE + setCode + '.json'].concat(
        PRICE_LOCAL_FALLBACKS.map(function (prefix) { return prefix + setCode + '.json'; })
      );

      function tryNext(i) {
        if (i >= urls.length) {
          // 不把失敗寫進 setJsonCache，方便重新整理後重試
          return null;
        }
        return fetchJson(urls[i]).then(function (json) {
          setJsonCache[setCode] = json;
          return json;
        }).catch(function () {
          return tryNext(i + 1);
        });
      }

      return tryNext(0);
    }

    function loadPricesForItems(items) {
      var token = ++priceLoadToken;
      var groups = {};
      (items || []).forEach(function (item) {
        if (!item || !item.cardNumber) return;
        if (item.priceStatus === 'ready' || item.priceStatus === 'missing') return;
        var setCode = setCodeFromCardNumber(item.cardNumber);
        if (!setCode) {
          item.priceStatus = 'missing';
          return;
        }
        if (!groups[setCode]) groups[setCode] = [];
        groups[setCode].push(item);
        item.priceStatus = 'loading';
      });

      var setCodes = Object.keys(groups);
      if (!setCodes.length) {
        updateTotalBar();
        return Promise.resolve();
      }

      var anyFetchFailed = false;
      var chain = Promise.resolve();
      setCodes.forEach(function (setCode) {
        chain = chain.then(function () {
          if (token !== priceLoadToken) return;
          return loadSetJson(setCode).then(function (json) {
            if (token !== priceLoadToken) return;
            var now = Date.now();
            if (!json) {
              anyFetchFailed = true;
              groups[setCode].forEach(function (item) {
                item.priceJPY = null;
                item.priceAsOf = '';
                item.priceStatus = 'error';
                // 網路／CORS 失敗不當成「無價」快取，避免合計長期卡在 ¥0
                if (priceCache[item.cardNumber] && priceCache[item.cardNumber].missing) {
                  delete priceCache[item.cardNumber];
                }
              });
              writePriceCache();
              refreshVisiblePrices();
              updateTotalBar();
              return;
            }
            groups[setCode].forEach(function (item) {
              var result = lookupPriceInSetJson(json, item.cardNumber);
              if (result && typeof result.priceJPY === 'number') {
                item.priceJPY = result.priceJPY;
                item.priceAsOf = result.asOf || '';
                item.priceStatus = 'ready';
                priceCache[item.cardNumber] = {
                  priceJPY: result.priceJPY,
                  asOf: result.asOf || '',
                  fetchedAt: now
                };
              } else {
                item.priceJPY = null;
                item.priceAsOf = '';
                item.priceStatus = 'missing';
                priceCache[item.cardNumber] = {
                  missing: true,
                  fetchedAt: now
                };
              }
            });
            writePriceCache();
            refreshVisiblePrices();
            updateTotalBar();
          });
        });
      });
      return chain.then(function () {
        if (token !== priceLoadToken) return;
        if (anyFetchFailed) {
          setStatus('價格資料載入失敗，勾選合計可能不完整。請按重新整理重試。', 'is-error');
        }
      });
    }

    function matchesFilter(item, q) {
      if (!q) return true;
      var hay = [
        item.cardNumber || '',
        item.cardName || '',
        item.cardTitle || '',
        item.cardRare || ''
      ].join(' ').toLowerCase();
      return hay.indexOf(q) >= 0;
    }

    function getVisibleItems() {
      var q = String(filterQuery || '').trim().toLowerCase();
      var list = allItems.filter(function (item) {
        return matchesFilter(item, q);
      });

      list.sort(function (a, b) {
        if (sortMode === 'oldest') return (a.timestamp || 0) - (b.timestamp || 0);
        if (sortMode === 'cardNumber') {
          return String(a.cardNumber || '').localeCompare(String(b.cardNumber || ''), 'en', { numeric: true });
        }
        if (sortMode === 'rare') {
          var rr = rareRank(a.cardRare) - rareRank(b.cardRare);
          if (rr !== 0) return rr;
          return String(a.cardNumber || '').localeCompare(String(b.cardNumber || ''), 'en', { numeric: true });
        }
        if (sortMode === 'priceDesc' || sortMode === 'priceAsc') {
          var ap = typeof a.priceJPY === 'number' ? a.priceJPY : -1;
          var bp = typeof b.priceJPY === 'number' ? b.priceJPY : -1;
          if (ap < 0 && bp < 0) return (b.timestamp || 0) - (a.timestamp || 0);
          if (ap < 0) return 1;
          if (bp < 0) return -1;
          return sortMode === 'priceDesc' ? (bp - ap) : (ap - bp);
        }
        return (b.timestamp || 0) - (a.timestamp || 0);
      });
      return list;
    }

    function priceLabel(item) {
      if (!item) return { text: '—', muted: true };
      if (item.priceStatus === 'loading' || item.priceStatus === 'idle') {
        return { text: '價格載入中…', muted: true };
      }
      if (item.priceStatus === 'error') {
        return { text: '價格載入失敗', muted: true };
      }
      if (typeof item.priceJPY === 'number') {
        return { text: formatYen(item.priceJPY), muted: false };
      }
      return { text: '無價格紀錄', muted: true };
    }

    function updateCountLabel(visibleCount) {
      if (!allItems.length) {
        countEl.textContent = '共 0 張';
        return;
      }
      if (visibleCount === allItems.length) {
        countEl.textContent = '共 ' + allItems.length + ' 張';
      } else {
        countEl.textContent = '顯示 ' + visibleCount + ' / 共 ' + allItems.length + ' 張';
      }
    }

    function updateTotalBar() {
      var checked = 0;
      var priced = 0;
      var unpriced = 0;
      var total = 0;
      Object.keys(checkedSet).forEach(function (cardNumber) {
        if (!checkedSet[cardNumber]) return;
        var item = allItems.find(function (it) { return it.cardNumber === cardNumber; });
        if (!item) return;
        checked += 1;
        if (typeof item.priceJPY === 'number') {
          priced += 1;
          total += item.priceJPY;
        } else {
          unpriced += 1;
        }
      });
      totalValueEl.textContent = formatYen(total);
      totalSubEl.textContent = '已勾選 ' + checked + ' 張 · 有價 ' + priced + ' 張 · 無價 ' + unpriced + ' 張';
    }

    function refreshVisiblePrices() {
      var nodes = listEl.querySelectorAll('[data-price-for]');
      Array.prototype.forEach.call(nodes, function (el) {
        var cardNumber = el.getAttribute('data-price-for');
        var item = allItems.find(function (it) { return it.cardNumber === cardNumber; });
        var label = priceLabel(item);
        el.textContent = label.text;
        el.classList.toggle('is-muted', !!label.muted);
      });
    }

    function renderAlbum() {
      var visible = getVisibleItems();
      updateCountLabel(visible.length);
      updateTotalBar();

      if (!allItems.length) {
        emptyEl.style.display = '';
        emptyTextEl.textContent = '尚未收藏任何卡片。';
        listEl.innerHTML = '';
        return;
      }

      if (!visible.length) {
        emptyEl.style.display = '';
        emptyTextEl.textContent = '沒有符合搜尋條件的卡片。';
        listEl.innerHTML = '';
        return;
      }

      emptyEl.style.display = 'none';
      var html = '';
      visible.forEach(function (item) {
        var cardNumber = item.cardNumber || '';
        var name = item.cardName || '（尚無卡名）';
        var rare = item.cardRare || '';
        var urls = buildCardImageUrls(cardNumber);
        var checked = !!checkedSet[cardNumber];
        var rareHtml = rare
          ? '<span class="fav-rare" style="background:' + getRareColor(rare) + ';">' + escapeHtml(rare) + '</span>'
          : '';
        var label = priceLabel(item);

        html += '<li class="fav-tile' + (checked ? ' is-checked' : '') + '" data-card-number="' + escapeHtml(cardNumber) + '">';
        html += '  <label class="fav-check">';
        html += '    <input type="checkbox" data-check="' + escapeHtml(cardNumber) + '"' + (checked ? ' checked' : '') + ' aria-label="勾選 ' + escapeHtml(cardNumber) + ' 以合計價格">';
        html += '  </label>';
        html += '  <div class="fav-tile-body">';
        html += '    <div class="fav-tile-art">';
        html += '      <div class="fav-tile-placeholder"><i class="fas fa-image" aria-hidden="true"></i><span>載入卡面</span></div>';
        if (urls.primary) {
          html += '      <img src="' + escapeHtml(urls.primary) + '" data-fallback="' + escapeHtml(urls.fallback) + '" alt="' + escapeHtml(cardNumber) + '" loading="lazy" decoding="async">';
        }
        html += rareHtml;
        html += '    </div>';
        html += '    <div class="fav-tile-caption">';
        html += '      <span class="fav-cardno">' + escapeHtml(cardNumber) + '</span>';
        html += '      <span class="fav-name">' + escapeHtml(name) + '</span>';
        html += '      <div class="fav-price' + (label.muted ? ' is-muted' : '') + '" data-price-for="' + escapeHtml(cardNumber) + '">' + escapeHtml(label.text) + '</div>';
        html += '      <div class="fav-meta">收藏於 ' + escapeHtml(formatTime(item.timestamp)) + '</div>';
        html += '    </div>';
        html += '  </div>';
        html += '  <button type="button" class="fav-remove-btn" data-remove="' + escapeHtml(cardNumber) + '" title="取消收藏" aria-label="取消收藏 ' + escapeHtml(cardNumber) + '">';
        html += '    <i class="fas fa-trash-alt" aria-hidden="true"></i>';
        html += '  </button>';
        html += '</li>';
      });
      listEl.innerHTML = html;
    }

    function setItemsAndRender(list) {
      allItems = (list || []).map(function (item) {
        return {
          cardNumber: item.cardNumber,
          cardName: item.cardName || '',
          cardRare: item.cardRare || '',
          cardTitle: item.cardTitle || '',
          source: item.source || 'line',
          timestamp: item.timestamp || Date.now(),
          priceJPY: null,
          priceAsOf: '',
          priceStatus: 'idle'
        };
      });
      Object.keys(checkedSet).forEach(function (key) {
        if (!allItems.some(function (it) { return it.cardNumber === key; })) {
          delete checkedSet[key];
        }
      });
      applyCachedPrices(allItems);
      renderAlbum();
      loadPricesForItems(allItems);
    }

    function onAlbumImageLoad(img) {
      img.classList.add('is-loaded');
      var art = img.closest('.fav-tile-art');
      if (art) art.classList.add('has-image');
    }

    function onAlbumImageError(img) {
      var fallback = img.getAttribute('data-fallback');
      if (fallback && img.getAttribute('src') !== fallback) {
        img.removeAttribute('data-fallback');
        img.src = fallback;
        return;
      }
      img.classList.add('is-broken');
      img.removeAttribute('src');
      var art = img.closest('.fav-tile-art');
      if (art) {
        art.classList.remove('has-image');
        var label = art.querySelector('.fav-tile-placeholder span');
        if (label) label.textContent = '無卡面';
      }
    }

    function removeFavorite(cardNumber) {
      if (!cardNumber) return;
      var next = allItems
        .filter(function (item) { return item.cardNumber !== cardNumber; })
        .map(function (item) {
          return {
            cardNumber: item.cardNumber,
            cardName: item.cardName,
            cardRare: item.cardRare,
            cardTitle: item.cardTitle,
            source: item.source,
            timestamp: item.timestamp
          };
        });
      delete checkedSet[cardNumber];
      writeLocal(next);
      setItemsAndRender(next);
      setStatus('已取消收藏 ' + cardNumber, 'is-ok');

      if (canUseCloud()) {
        fb.removeCardFavorite(cardNumber).catch(function (err) {
          console.error(err);
          setStatus('本機已移除，雲端同步失敗', 'is-error');
        });
      }
    }

    function loadFavorites() {
      var local = readLocal();
      setItemsAndRender(local);

      if (!canUseCloud()) {
        setStatus(cloudUser ? '雲端未就緒，顯示本機收藏' : '顯示本機收藏（登入後可同步雲端）');
        return Promise.resolve(local);
      }

      setStatus('同步雲端收藏…');
      return fb.loadCardFavorites()
        .then(function (remote) {
          var merged = mergeLists(local, remote || []);
          writeLocal(merged);
          setItemsAndRender(merged);
          return pushMissingToCloud(merged, remote || []).then(function () {
            setStatus('已同步雲端收藏', 'is-ok');
            return merged;
          });
        })
        .catch(function (err) {
          console.error(err);
          setStatus('雲端讀取失敗，繼續顯示本機收藏', 'is-error');
          return local;
        });
    }

    listEl.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-remove]');
      if (btn) {
        e.preventDefault();
        e.stopPropagation();
        removeFavorite(btn.getAttribute('data-remove'));
        return;
      }

      // 點卡面／說明區也可勾選，方便合計總額
      if (e.target.closest('.fav-check') || e.target.closest('[data-check]')) return;
      var tile = e.target.closest('.fav-tile');
      if (!tile) return;
      var input = tile.querySelector('[data-check]');
      if (!input) return;
      e.preventDefault();
      input.checked = !input.checked;
      input.dispatchEvent(new Event('change', { bubbles: true }));
    });

    listEl.addEventListener('change', function (e) {
      var input = e.target.closest('[data-check]');
      if (!input) return;
      var cardNumber = input.getAttribute('data-check');
      if (!cardNumber) return;
      if (input.checked) checkedSet[cardNumber] = true;
      else delete checkedSet[cardNumber];
      var tile = input.closest('.fav-tile');
      if (tile) tile.classList.toggle('is-checked', !!input.checked);
      updateTotalBar();
    });

    listEl.addEventListener('load', function (e) {
      if (e.target && e.target.tagName === 'IMG') onAlbumImageLoad(e.target);
    }, true);

    listEl.addEventListener('error', function (e) {
      if (e.target && e.target.tagName === 'IMG') onAlbumImageError(e.target);
    }, true);

    searchInput.addEventListener('input', function () {
      filterQuery = searchInput.value || '';
      renderAlbum();
    });

    sortSelect.addEventListener('change', function () {
      sortMode = sortSelect.value || 'newest';
      renderAlbum();
    });

    document.getElementById('favSelectVisibleBtn').addEventListener('click', function () {
      getVisibleItems().forEach(function (item) {
        checkedSet[item.cardNumber] = true;
      });
      renderAlbum();
    });

    document.getElementById('favClearCheckBtn').addEventListener('click', function () {
      checkedSet = {};
      renderAlbum();
    });

    document.getElementById('favReloadBtn').addEventListener('click', function () {
      allItems.forEach(function (item) {
        item.priceStatus = 'idle';
        item.priceJPY = null;
        item.priceAsOf = '';
        if (item.cardNumber) delete priceCache[item.cardNumber];
      });
      writePriceCache();
      setJsonCache = {};
      loadFavorites();
    });

    priceCache = readPriceCache();

    if (fb && typeof fb.onAuth === 'function') {
      fb.onAuth(function (user) {
        cloudUser = user || null;
        loadFavorites();
      });
    } else {
      setItemsAndRender(readLocal());
      setStatus((fb && fb.reason) || 'Firebase 未載入，僅顯示本機收藏', 'is-error');
    }
  })();
</script>
</body>
</html>
