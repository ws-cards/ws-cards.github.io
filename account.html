<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('ws-theme');
        document.documentElement.setAttribute('data-theme', saved === 'dark' ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <title>個人資料 | WS-Cards</title>
  <meta name="description" content="WS-Cards 個人資料與帳號設定">
  <meta name="theme-color" content="#f3f2ee">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/plugins/fontawesome-free/css/all.min.css">
  <link rel="stylesheet" href="/dist/css/adminlte.min.css">
  <link rel="stylesheet" href="/dist/css/wscards.newline_v101.css">
  <style>
    :root { color-scheme: light; }
    [data-theme="dark"] { color-scheme: dark; }

    .account-page {
      --paper: #f3f2ee;
      --ink: #161616;
      --muted: #6f6d67;
      --rule: #b9b7b0;
      --accent: #2447d6;
      --card: #fff;
      --gutter: clamp(20px, 5vw, 84px);
      --max: 720px;
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--paper);
      color: var(--ink);
      margin: 0;
      min-height: 100vh;
    }
    [data-theme="dark"] .account-page {
      --paper: #121212;
      --ink: #f3f3f3;
      --muted: #a3a29c;
      --rule: #3a3a3a;
      --card: #1c1c1c;
    }
    .account-page .main-header { position: sticky; top: 0; z-index: 100; min-height: 56px; }
    .account-shell {
      width: min(100%, var(--max));
      margin: 0 auto;
      padding: 2rem var(--gutter) 4rem;
    }
    .account-shell h1 {
      margin: 0 0 0.35rem;
      font-size: clamp(1.6rem, 4vw, 2rem);
      font-weight: 900;
      letter-spacing: -0.02em;
    }
    .account-lead { margin: 0 0 1.75rem; color: var(--muted); font-size: 0.95rem; }
    .account-card {
      background: var(--card);
      border: 1px solid var(--rule);
      border-radius: 16px;
      padding: 1.35rem 1.25rem 1.5rem;
    }
    .account-hero {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
      padding-bottom: 1.15rem;
      border-bottom: 1px solid var(--rule);
    }
    .account-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      background: rgba(0,0,0,.06);
      flex-shrink: 0;
    }
    [data-theme="dark"] .account-avatar { background: rgba(255,255,255,.08); }
    .account-avatar-fallback {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 800;
      background: rgba(36,71,214,.12);
      color: var(--accent);
      flex-shrink: 0;
    }
    .account-hero-meta { min-width: 0; }
    .account-hero-meta .name {
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1.3;
      word-break: break-word;
    }
    .account-hero-meta .email {
      margin-top: 0.2rem;
      color: var(--muted);
      font-size: 0.88rem;
      word-break: break-all;
    }
    .account-hero-meta .uid {
      margin-top: 0.35rem;
      color: var(--muted);
      font-size: 0.75rem;
      opacity: 0.85;
      word-break: break-all;
    }
    .field { margin-bottom: 1rem; }
    .field label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .field .hint { margin: 0.3rem 0 0; color: var(--muted); font-size: 0.78rem; }
    .field input,
    .field textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--rule);
      border-radius: 10px;
      background: transparent;
      color: inherit;
      padding: 0.7rem 0.85rem;
      font: inherit;
    }
    .field input:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .field textarea { min-height: 110px; resize: vertical; }
    .account-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      margin-top: 1.25rem;
    }
    .account-btn {
      appearance: none;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: var(--paper);
      border-radius: 999px;
      padding: 0.65rem 1.15rem;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .account-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .account-btn.secondary {
      background: transparent;
      color: var(--ink);
    }
    .account-status {
      margin-top: 0.85rem;
      min-height: 1.25rem;
      font-size: 0.88rem;
      color: var(--muted);
    }
    .account-status.is-error { color: #b42318; }
    [data-theme="dark"] .account-status.is-error { color: #f97066; }
    .account-status.is-ok { color: #0f7b4a; }
    [data-theme="dark"] .account-status.is-ok { color: #6ce9a6; }
    .account-gate {
      display: none;
      text-align: center;
      padding: 2.5rem 1rem;
      border: 1px dashed var(--rule);
      border-radius: 16px;
    }
    .account-gate h2 { margin: 0 0 0.5rem; font-size: 1.25rem; }
    .account-gate p { margin: 0 0 1.25rem; color: var(--muted); }
    .account-page.is-guest .account-card { display: none; }
    .account-page.is-guest .account-gate { display: block; }
    .account-page.is-loading .account-card,
    .account-page.is-loading .account-gate { opacity: 0.5; pointer-events: none; }
  </style>
</head>
<body class="account-page hold-transition sidebar-mini layout-fixed layout-navbar-fixed is-loading">
  <div data-navbar data-page-title="個人資料"></div>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="/assets/js/firebase-config.js"></script>
  <script src="/assets/js/ws-firebase.js"></script>
  <script src="/dist/js/include-navbar.js"></script>

  <div id="customDrawerOverlay" class="custom-drawer-overlay" onclick="toggleCustomDrawer()"></div>
  <aside class="custom-drawer" id="customDrawer">
    <div class="custom-drawer-header">
      <a href="./" class="brand-link">
        <img src="/dist/img/logo.png" alt="" class="brand-image">
        <span class="brand-text">WS-Cards</span>
      </a>
      <button type="button" class="custom-drawer-close" onclick="toggleCustomDrawer()" aria-label="關閉選單">
        <i class="fas fa-times" aria-hidden="true"></i>
      </button>
    </div>
    <nav class="custom-drawer-nav" aria-label="網站導覽">
      <ul>
        <li class="menu-item">
          <a href="/line_test_v101.html" class="menu-link">
            <i class="fas fa-chart-line main-icon"></i>
            <span>各卡號漲幅趨勢(WS)</span>
          </a>
        </li>
        <li class="menu-item">
          <a href="/productTimeline.html" class="menu-link">
            <i class="fas fa-calendar-alt main-icon"></i>
            <span>商品發售時間軸</span>
          </a>
        </li>
        <li class="menu-item">
          <a href="/account.html" class="menu-link active">
            <i class="fas fa-user main-icon"></i>
            <span>個人資料</span>
          </a>
        </li>
      </ul>
    </nav>
    <div class="custom-drawer-footer">WS-Cards<span>β</span></div>
  </aside>

  <main class="account-shell">
    <h1>個人資料</h1>
    <p class="account-lead">來自 Google 登入的帳號資訊，可編輯站內顯示名稱、暱稱與簡介，並同步到 Firestore。</p>

    <div class="account-gate" id="accountGate">
      <h2>請先登入</h2>
      <p>登入後即可查看與編輯個人資料。</p>
      <button type="button" class="account-btn" id="gateSignInBtn">
        <i class="fab fa-google" aria-hidden="true"></i> 使用 Google 登入
      </button>
    </div>

    <section class="account-card" id="accountCard" aria-label="個人資料表單">
      <div class="account-hero">
        <img id="profileAvatar" class="account-avatar" alt="" hidden>
        <div id="profileAvatarFallback" class="account-avatar-fallback" aria-hidden="true">?</div>
        <div class="account-hero-meta">
          <div class="name" id="profileHeroName">—</div>
          <div class="email" id="profileHeroEmail">—</div>
          <div class="uid" id="profileUid">uid：—</div>
        </div>
      </div>

      <form id="profileForm" novalidate>
        <div class="field">
          <label for="profileEmail">Email（唯讀）</label>
          <input id="profileEmail" type="email" disabled autocomplete="email">
        </div>
        <div class="field">
          <label for="profileDisplayName">顯示名稱</label>
          <input id="profileDisplayName" type="text" maxlength="80" autocomplete="nickname">
          <p class="hint">預設帶入 Google 名稱，可改成站內想顯示的名字。</p>
        </div>
        <div class="field">
          <label for="profileNickname">暱稱</label>
          <input id="profileNickname" type="text" maxlength="40" autocomplete="off">
        </div>
        <div class="field">
          <label for="profileBio">簡介</label>
          <textarea id="profileBio" maxlength="500" placeholder="簡單介紹自己（最多 500 字）"></textarea>
        </div>
        <div class="field">
          <label for="profilePhotoURL">頭像網址</label>
          <input id="profilePhotoURL" type="url" maxlength="500" placeholder="https://…">
          <p class="hint">預設為 Google 大頭貼；可改成其他公開圖片網址。</p>
        </div>

        <div class="account-actions">
          <button type="submit" class="account-btn" id="profileSaveBtn">儲存</button>
          <button type="button" class="account-btn secondary" id="profileReloadBtn">重新載入</button>
        </div>
        <div class="account-status" id="profileStatus" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <script>
    (function () {
      var fb = window.WsFirebase;
      var body = document.body;
      var statusEl = document.getElementById('profileStatus');

      function setStatus(msg, kind) {
        statusEl.textContent = msg || '';
        statusEl.classList.remove('is-error', 'is-ok');
        if (kind) statusEl.classList.add(kind);
      }

      function setGuest(isGuest) {
        body.classList.toggle('is-guest', !!isGuest);
      }

      function setLoading(on) {
        body.classList.toggle('is-loading', !!on);
      }

      function showAvatar(url, name) {
        var img = document.getElementById('profileAvatar');
        var fallback = document.getElementById('profileAvatarFallback');
        var initial = (name || '?').trim().charAt(0).toUpperCase() || '?';
        fallback.textContent = initial;
        if (url) {
          img.hidden = false;
          img.style.display = 'block';
          fallback.style.display = 'none';
          img.src = url;
          img.onerror = function () {
            img.hidden = true;
            img.style.display = 'none';
            fallback.style.display = 'flex';
          };
        } else {
          img.hidden = true;
          img.removeAttribute('src');
          img.style.display = 'none';
          fallback.style.display = 'flex';
        }
      }

      function fillForm(profile) {
        var name = profile.displayName || profile.nickname || profile.email || '使用者';
        document.getElementById('profileHeroName').textContent = name;
        document.getElementById('profileHeroEmail').textContent = profile.email || '（未提供 Email）';
        document.getElementById('profileUid').textContent = 'uid：' + (profile.uid || '—');
        document.getElementById('profileEmail').value = profile.email || '';
        document.getElementById('profileDisplayName').value = profile.displayName || '';
        document.getElementById('profileNickname').value = profile.nickname || '';
        document.getElementById('profileBio').value = profile.bio || '';
        document.getElementById('profilePhotoURL').value = profile.photoURL || '';
        showAvatar(profile.photoURL, name);
      }

      function loadProfile() {
        if (!fb || !fb.ready || !fb.firestoreReady) {
          setStatus((fb && fb.reason) || 'Firestore 未就緒', 'is-error');
          setLoading(false);
          return;
        }
        setLoading(true);
        setStatus('載入中…');
        fb.ensureUserProfile()
          .then(function (profile) {
            if (!profile) throw new Error('無法載入個人資料');
            fillForm(profile);
            setStatus('已載入', 'is-ok');
          })
          .catch(function (err) {
            console.error(err);
            setStatus('載入失敗：' + (err && err.message ? err.message : err), 'is-error');
          })
          .then(function () { setLoading(false); });
      }

      document.getElementById('gateSignInBtn').addEventListener('click', function () {
        if (!fb || !fb.ready) {
          alert((fb && fb.reason) || 'Firebase 尚未設定');
          return;
        }
        fb.signInWithGoogle().catch(function (err) {
          alert('登入失敗：' + (err && err.message ? err.message : err));
        });
      });

      document.getElementById('profileReloadBtn').addEventListener('click', function () {
        loadProfile();
      });

      document.getElementById('profileForm').addEventListener('submit', function (e) {
        e.preventDefault();
        if (!fb || !fb.ready) return;
        var btn = document.getElementById('profileSaveBtn');
        btn.disabled = true;
        setStatus('儲存中…');
        fb.saveUserProfile({
          displayName: document.getElementById('profileDisplayName').value,
          nickname: document.getElementById('profileNickname').value,
          bio: document.getElementById('profileBio').value,
          photoURL: document.getElementById('profilePhotoURL').value
        })
          .then(function () { return fb.loadUserProfile(); })
          .then(function (profile) {
            if (profile) fillForm(profile);
            setStatus('已儲存到雲端', 'is-ok');
          })
          .catch(function (err) {
            console.error(err);
            setStatus('儲存失敗：' + (err && err.message ? err.message : err), 'is-error');
          })
          .then(function () { btn.disabled = false; });
      });

      if (!fb || typeof fb.onAuth !== 'function') {
        setGuest(true);
        setLoading(false);
        setStatus((fb && fb.reason) || 'Firebase 未載入', 'is-error');
        return;
      }

      fb.onAuth(function (user) {
        if (!user) {
          setGuest(true);
          setLoading(false);
          setStatus('');
          return;
        }
        setGuest(false);
        loadProfile();
      });
    })();

    function toggleCustomDrawer(event) {
      if (event) event.preventDefault();
      var drawer = document.getElementById('customDrawer');
      var overlay = document.getElementById('customDrawerOverlay');
      var button = document.getElementById('leftbar');
      if (!drawer || !overlay) return;
      var open = drawer.classList.toggle('open');
      overlay.classList.toggle('active', open);
      if (button) {
        button.setAttribute('aria-expanded', open ? 'true' : 'false');
        button.setAttribute('aria-label', open ? '關閉選單' : '開啟選單');
      }
    }
  </script>
</body>
</html>
