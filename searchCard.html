<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <title>WS-CARDS — 全息查卡系統</title>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<style>
/* === DESIGN TOKENS === */
:root {
    --cyan:        #00d4ff;
    --cyan-dim:    rgba(0, 212, 255, 0.25);
    --purple:      #7f5af0;
    --purple-dim:  rgba(127, 90, 240, 0.25);
    --gold:        #ffd700;
    --bg-deep:     #050810;
    --bg-card:     rgba(255,255,255,0.04);
    --border-glass:rgba(255,255,255,0.09);
    --text-hi:     #e8f4fd;
    --text-lo:     rgba(232,244,253,0.55);
    --font-d:      'Orbitron', monospace;
    --font-b:      'Syne', sans-serif;
}

/* === RESET === */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
::selection { background: var(--cyan-dim); color: var(--cyan); }
html, body { width: 100%; min-height: 100%; }
body {
    background: var(--bg-deep);
    font-family: var(--font-b);
    color: var(--text-hi);
    overflow-x: hidden;
    cursor: none;
}

/* === CUSTOM CURSOR === */
#cursor-dot {
    position: fixed; top: 0; left: 0; z-index: 9999;
    width: 8px; height: 8px;
    background: var(--cyan);
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%,-50%);
    box-shadow: 0 0 10px var(--cyan), 0 0 20px var(--cyan);
    will-change: left, top;
}
#cursor-ring {
    position: fixed; top: 0; left: 0; z-index: 9998;
    width: 32px; height: 32px;
    border: 1.5px solid rgba(0,212,255,0.55);
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%,-50%);
    will-change: left, top;
}

/* === CANVAS (particles) === */
#particle-canvas {
    position: fixed; inset: 0; z-index: 0;
    width: 100%; height: 100%;
    pointer-events: none;
}

/* === SCANLINES === */
.scanlines {
    position: fixed; inset: 0; z-index: 1;
    background: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);
    pointer-events: none;
    animation: scanShift 10s linear infinite;
}
@keyframes scanShift { to { background-position: 0 80px; } }

/* === AURORA BLOBS === */
.aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.blob {
    position: absolute; border-radius: 50%;
    filter: blur(90px); opacity: 0.14;
    animation: blobFloat 24s ease-in-out infinite;
    will-change: transform;
}
.blob-1 { width: 700px; height: 700px; background: radial-gradient(circle, var(--cyan), transparent 70%); top: -250px; left: -200px; animation-duration: 28s; }
.blob-2 { width: 550px; height: 550px; background: radial-gradient(circle, var(--purple), transparent 70%); top: 25%; right: -180px; animation-duration: 33s; animation-delay: -12s; }
.blob-3 { width: 450px; height: 450px; background: radial-gradient(circle, #ff4d6d, transparent 70%); bottom: -120px; left: 28%; animation-duration: 20s; animation-delay: -6s; }
.blob-4 { width: 380px; height: 380px; background: radial-gradient(circle, var(--gold), transparent 70%); top: 55%; right: 25%; animation-duration: 26s; animation-delay: -18s; }
@keyframes blobFloat {
    0%,100% { transform: translate(0,0) scale(1); }
    25%      { transform: translate(55px,-45px) scale(1.08); }
    50%      { transform: translate(-35px,65px) scale(0.94); }
    75%      { transform: translate(45px,35px) scale(1.04); }
}

/* === PAGE LAYOUT === */
.page-container {
    position: relative; z-index: 2;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
}

/* === HEADER === */
.site-header { width: 100%; padding: 44px 24px 16px; text-align: center; }

.glitch-title {
    font-family: var(--font-d);
    font-size: clamp(2.4rem, 8vw, 5rem);
    font-weight: 900;
    letter-spacing: 0.22em;
    color: var(--text-hi);
    position: relative; display: inline-block;
    text-shadow: 0 0 35px rgba(0,212,255,0.45), 0 0 70px rgba(0,212,255,0.15);
    animation: glitchStable 9s ease-in-out infinite;
}
.glitch-title::before, .glitch-title::after {
    content: attr(data-text);
    position: absolute; top: 0; left: 0; width: 100%;
}
.glitch-title::before { color: var(--cyan);   clip-path: polygon(0 0,100% 0,100% 35%,0 35%); opacity: 0; animation: gfx1 9s ease-in-out infinite; }
.glitch-title::after  { color: var(--purple); clip-path: polygon(0 65%,100% 65%,100% 100%,0 100%); opacity: 0; animation: gfx2 9s ease-in-out infinite; }

@keyframes glitchStable {
    0%,88%,100% { transform: none; }
    90%  { transform: skewX(1.2deg); }
    92%  { transform: skewX(-1.2deg); }
    94%  { transform: none; }
}
@keyframes gfx1 {
    0%,88%,100% { opacity:0; transform:none; }
    90%  { opacity:.85; transform:translate(-4px,2px); }
    91%  { opacity:0; }
    93%  { opacity:.6;  transform:translate(4px,-2px); }
    94%  { opacity:0; }
}
@keyframes gfx2 {
    0%,88%,100% { opacity:0; transform:none; }
    90%  { opacity:.7;  transform:translate(5px,1px); }
    91.8%{ opacity:0; }
    93.5%{ opacity:.5;  transform:translate(-5px,-1px); }
    94%  { opacity:0; }
}

.subtitle {
    font-family: var(--font-d);
    font-size: clamp(0.55rem, 1.8vw, 0.8rem);
    letter-spacing: 0.38em;
    color: var(--cyan);
    margin-top: 10px;
    min-height: 1.3em;
    opacity: 0.75;
}
.subtitle::after { content:'|'; animation: blink 1s step-end infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* === SEARCH SECTION === */
.search-section {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    padding: 44px 24px;
    width: 100%;
}

/* === SEARCH WRAPPER === */
.search-wrapper {
    position: relative;
    display: flex; align-items: center; justify-content: center;
}
/* === TCG FRAME (holo border) === */
.search-wrapper .tcg-frame {
    position: absolute;
    left: -12px; top: -28px;
    width: 94px;
    aspect-ratio: 63 / 88;
    border-radius: 8px;
    pointer-events: none; z-index: 0;
    transition: all 0.5s cubic-bezier(0.000, 0.105, 0.035, 1.570);
    overflow: hidden;
}
.search-wrapper .tcg-frame::before {
    content: '';
    position: absolute; inset: 0;
    background: conic-gradient(from 0deg, #ff0080, #ff8c00, #ffd700, #00ff80, #00d4ff, #7f5af0, #ff0080);
    animation: holoSpin 3s linear infinite;
    border-radius: inherit;
}
.search-wrapper .tcg-frame::after {
    content: '';
    position: absolute; inset: 3px;
    background: var(--bg-deep);
    border-radius: 6px;
}
@keyframes holoSpin { to { transform: rotate(360deg); } }

.search-wrapper.active .tcg-frame {
    left: -16px; top: -28px;
    width: calc(100% + 32px);
    aspect-ratio: unset;
    height: calc(100% + 56px);
    border-radius: 28px;
}

/* === INPUT HOLDER === */
.search-wrapper .input-holder {
    height: 70px; width: 70px;
    overflow: hidden;
    background: transparent;
    border-radius: 8px;
    position: relative; z-index: 2;
    transition: all 0.5s cubic-bezier(0.000, 0.105, 0.035, 1.570);
}
.search-wrapper.active .input-holder {
    width: 480px;
    border-radius: 50px;
    background: rgba(5,8,16,0.88);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid rgba(0,212,255,0.22);
    box-shadow: 0 0 28px rgba(0,212,255,0.14), 0 0 56px rgba(0,212,255,0.06), inset 0 1px 0 rgba(255,255,255,0.08);
    transition: all .5s cubic-bezier(0.000, 0.105, 0.035, 1.570);
}
/* === SEARCH INPUT === */
.search-wrapper .input-holder .search-input {
    width: 100%; height: 50px;
    padding: 0 70px 0 24px;
    opacity: 0;
    position: absolute; top: 0; left: 0;
    background: transparent; border: none; outline: none;
    font-family: var(--font-d);
    font-size: 14px; font-weight: 400;
    letter-spacing: 0.06em;
    color: var(--cyan);
    caret-color: var(--cyan);
    transform: translate(0, 60px);
    transition: all .3s cubic-bezier(0.000, 0.105, 0.035, 1.570);
    transition-delay: 0.3s;
}
.search-wrapper .input-holder .search-input::placeholder {
    color: rgba(0,212,255,0.32);
    font-size: 12px; letter-spacing: 0.1em;
}
.search-wrapper.active .input-holder .search-input {
    opacity: 1;
    transform: translate(0, 10px);
}
/* === SEARCH ICON BUTTON === */
@keyframes searchIconBounce {
    0%,100%  { transform: translateY(0); }
    6.667%   { transform: translateY(-10px); }
    13.333%  { transform: translateY(0); }
    20%      { transform: translateY(-7px); }
    26.667%  { transform: translateY(0); }
    30%      { transform: translateY(-4px); }
    33.333%  { transform: translateY(0); }
}
.search-wrapper .input-holder .search-icon {
    width: 70px; height: 70px;
    border: none; border-radius: 8px;
    background: var(--bg-deep);
    padding: 0; outline: none;
    position: relative; z-index: 2; float: right;
    cursor: none;
    transition: all 0.3s ease-in-out;
    animation: searchIconBounce 4s ease-in-out 2s infinite;
    box-shadow: 0 0 22px rgba(0,212,255,0.18), inset 0 0 18px rgba(0,212,255,0.05);
    overflow: hidden;
}
/* rotating holo shimmer on button */
.search-wrapper .input-holder .search-icon::before {
    content: '';
    position: absolute; inset: 0;
    background: conic-gradient(from 0deg, #ff0080, #ff8c00, #ffd700, #00ff80, #00d4ff, #7f5af0, #ff0080);
    animation: holoSpin 3s linear infinite;
    opacity: 0.22;
}
.search-wrapper.active .input-holder .search-icon {
    width: 50px; height: 50px;
    margin: 10px; border-radius: 30px;
    animation: none;
    background: rgba(0,212,255,0.08);
    box-shadow: 0 0 18px rgba(0,212,255,0.28);
}
/* === SEARCH ICON SPAN (magnifier shape) === */
.search-wrapper .input-holder .search-icon span {
    width: 22px; height: 22px;
    display: inline-block;
    vertical-align: middle;
    position: relative; z-index: 1;
    transform: rotate(45deg);
    transition: all .4s cubic-bezier(0.650, -0.600, 0.240, 1.650);
}
.search-wrapper.active .input-holder .search-icon span {
    transform: rotate(-45deg);
}
.search-wrapper .input-holder .search-icon span::before,
.search-wrapper .input-holder .search-icon span::after {
    position: absolute; content: '';
}
.search-wrapper .input-holder .search-icon span::before {
    width: 4px; height: 11px;
    left: 9px; top: 18px;
    border-radius: 2px;
    background: var(--cyan);
    box-shadow: 0 0 7px var(--cyan);
}
.search-wrapper .input-holder .search-icon span::after {
    width: 14px; height: 14px;
    left: 0; top: 0;
    border-radius: 16px;
    border: 3px solid var(--cyan);
    box-shadow: 0 0 9px var(--cyan);
}
/* === CLOSE BUTTON === */
.search-wrapper .close {
    position: absolute; z-index: 1;
    top: 24px; right: 20px;
    width: 25px; height: 25px;
    cursor: none;
    transform: rotate(-180deg);
    transition: all .3s cubic-bezier(0.285, -0.450, 0.935, 0.110);
    transition-delay: 0.2s;
}
.search-wrapper.active .close {
    right: -56px;
    transform: rotate(45deg);
    transition: all .6s cubic-bezier(0.000, 0.105, 0.035, 1.570);
    transition-delay: 0.5s;
}
.search-wrapper .close::before, .search-wrapper .close::after {
    position: absolute; content: '';
    border-radius: 2px;
}
.search-wrapper .close::before {
    width: 4px; height: 25px; left: 10px; top: 0;
    background: var(--cyan); box-shadow: 0 0 7px var(--cyan);
}
.search-wrapper .close::after {
    width: 25px; height: 4px; left: 0; top: 10px;
    background: var(--cyan); box-shadow: 0 0 7px var(--cyan);
}

/* === RIPPLE === */
.ripple {
    position: absolute; border-radius: 50%;
    background: rgba(0,212,255,0.28);
    transform: scale(0);
    animation: rippleAnim 0.65s linear forwards;
    pointer-events: none;
}
@keyframes rippleAnim { to { transform: scale(4.5); opacity: 0; } }

/* === RESULTS SECTION === */
.results-section {
    width: 100%; max-width: 1200px;
    padding: 0 24px 80px;
    opacity: 0; transform: translateY(18px);
    transition: opacity 0.45s ease, transform 0.45s ease;
}
.results-section.visible { opacity: 1; transform: translateY(0); }

.results-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 22px; padding-bottom: 10px;
    border-bottom: 1px solid rgba(0,212,255,0.13);
}
.results-count {
    font-family: var(--font-d);
    font-size: 0.7rem; letter-spacing: 0.22em;
    color: var(--cyan); opacity: 0.65;
}

/* === RESULTS GRID === */
.results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px,1fr));
    gap: 14px;
}

/* === RESULT CARD === */
.result-card {
    position: relative;
    background: var(--bg-card);
    border: 1px solid var(--border-glass);
    border-radius: 16px; padding: 20px;
    cursor: none; overflow: hidden;
    transform: perspective(900px) rotateY(90deg);
    opacity: 0;
    animation: cardFlipIn 0.5s cubic-bezier(0.230,1.000,0.320,1.000) forwards;
    transition: border-color 0.3s, box-shadow 0.3s, transform 0.15s;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}
.result-card:hover {
    border-color: rgba(0,212,255,0.38);
    box-shadow: 0 0 32px rgba(0,212,255,0.1), 0 8px 32px rgba(0,0,0,0.45);
}
/* radial glow following mouse */
.result-card::before {
    content: '';
    position: absolute; inset: 0; border-radius: inherit;
    background: radial-gradient(ellipse at var(--mx,50%) var(--my,50%), rgba(0,212,255,0.12) 0%, rgba(127,90,240,0.07) 45%, transparent 70%);
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
}
.result-card:hover::before { opacity: 1; }
/* rainbow foil shimmer */
.result-card::after {
    content: '';
    position: absolute; inset: 0; border-radius: inherit;
    background: linear-gradient(calc(var(--ha,135deg)), transparent 20%, rgba(255,0,128,0.04) 36%, rgba(255,215,0,0.04) 50%, rgba(0,212,255,0.04) 65%, transparent 80%);
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
}
.result-card:hover::after { opacity: 1; }

@keyframes cardFlipIn { to { transform: perspective(900px) rotateY(0deg); opacity: 1; } }

.card-code {
    font-family: var(--font-d);
    font-size: 0.65rem; letter-spacing: 0.15em;
    color: var(--cyan); opacity: 0.72;
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px;
}
.card-code::before {
    content: '';
    display: inline-block; width: 6px; height: 6px;
    border-radius: 50%; background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan); flex-shrink: 0;
}
.card-name {
    font-family: var(--font-b);
    font-size: 0.9rem; font-weight: 600; line-height: 1.45;
    color: var(--text-hi); margin-bottom: 13px;
}
.card-meta { display: flex; gap: 8px; flex-wrap: wrap; }
.card-tag {
    font-family: var(--font-d);
    font-size: 0.58rem; letter-spacing: 0.1em;
    padding: 3px 10px; border-radius: 20px; border: 1px solid;
}
.card-tag.tc  { color: var(--purple); border-color: rgba(127,90,240,0.38); background: rgba(127,90,240,0.09); }
.card-tag.ts  { color: var(--gold);   border-color: rgba(255,215,0,0.35);   background: rgba(255,215,0,0.05); }

/* === SKELETON LOADING === */
.skeleton-card {
    background: rgba(255,255,255,0.025);
    border: 1px solid var(--border-glass);
    border-radius: 16px; padding: 20px;
    overflow: hidden; position: relative;
}
.skeleton-card::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(0,212,255,0.04) 50%, transparent 100%);
    animation: shimmer 1.6s infinite;
}
@keyframes shimmer { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }
.skel-ln {
    height: 11px; border-radius: 6px;
    background: rgba(255,255,255,0.06); margin-bottom: 10px;
}
.skel-ln.s { width: 38%; } .skel-ln.m { width: 68%; } .skel-ln.l { width: 88%; }

/* === NO RESULTS === */
.no-results {
    grid-column: 1/-1; text-align: center; padding: 64px 24px;
    font-family: var(--font-d); font-size: 0.8rem;
    letter-spacing: 0.22em; color: var(--text-lo);
}
.no-results-icon { font-size: 2.8rem; display: block; margin-bottom: 18px; opacity: 0.28; }

/* === RWD === */
@media (max-width: 560px) {
    .search-section { padding: 24px 16px; }
    .search-wrapper.active .input-holder { width: calc(100vw - 80px); }
    .search-wrapper.active .tcg-frame    { width: calc(100vw - 44px); }
    .search-wrapper.active .close        { right: -44px; }
    .results-grid { grid-template-columns: 1fr; }
}
@media (max-width: 400px) {
    .search-wrapper .input-holder               { height: 56px; width: 56px; }
    .search-wrapper .tcg-frame                  { width: 72px; }
    .search-wrapper .input-holder .search-icon  { width: 56px; height: 56px; }
    .search-wrapper.active .input-holder        { height: 56px; width: calc(100vw - 70px); }
    .search-wrapper.active .input-holder .search-icon { width: 40px; height: 40px; margin: 8px; }
    .search-wrapper .input-holder .search-input { font-size: 13px; padding: 0 56px 0 16px; }
    .search-wrapper.active .close               { right: -40px; }
    .glitch-title                               { font-size: 2.1rem; }
}

</style>
</head>
<body>

<!-- Custom cursor -->
<div id="cursor-dot"></div>
<div id="cursor-ring"></div>

<!-- Background layers -->
<canvas id="particle-canvas"></canvas>
<div class="scanlines"></div>
<div class="aurora">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
</div>

<div class="page-container">
    <header class="site-header">
        <div class="glitch-title" data-text="WS-CARDS">WS-CARDS</div>
        <div class="subtitle" id="typewriter"></div>
    </header>

    <main class="search-section">
        <div class="search-wrapper" id="searchWrapper">
            <div class="tcg-frame"></div>
            <div class="input-holder">
                <input type="text" class="search-input" id="searchInput" placeholder="搜尋卡牌集合名稱或編號…" autocomplete="off" spellcheck="false" />
                <button class="search-icon" id="searchBtn" onclick="searchToggle(this, event)"><span></span></button>
            </div>
            <span class="close" id="closeBtn" onclick="searchToggle(this, event)"></span>
        </div>
    </main>

    <section class="results-section" id="resultsSection">
        <div class="results-header">
            <span class="results-count" id="resultsCount"></span>
        </div>
        <div class="results-grid" id="resultsGrid"></div>
    </section>
</div>

<script src="https://code.jquery.com/jquery-3.6.1.slim.js" integrity="sha256-tXm+sa1uzsbFnbXt8GJqsgi2Tw+m4BLGDof6eUPjbtk=" crossorigin="anonymous"></script>
<script>
/* ===================== CUSTOM CURSOR ===================== */
const curDot  = document.getElementById('cursor-dot');
const curRing = document.getElementById('cursor-ring');
let rx = 0, ry = 0, mx = 0, my = 0;

document.addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    curDot.style.left = mx + 'px';
    curDot.style.top  = my + 'px';
});
(function trackRing() {
    rx += (mx - rx) * 0.14;
    ry += (my - ry) * 0.14;
    curRing.style.left = rx + 'px';
    curRing.style.top  = ry + 'px';
    requestAnimationFrame(trackRing);
})();

/* ===================== TYPEWRITER ===================== */
const twEl   = document.getElementById('typewriter');
const twText = 'CARD SCANNER v2.0 — WEISS SCHWARZ DATABASE';
let twI = 0;
function typeWrite() {
    twEl.textContent = twText.slice(0, twI++);
    if (twI <= twText.length) setTimeout(typeWrite, twI < 4 ? 90 : 52);
}
setTimeout(typeWrite, 700);

/* ===================== PARTICLES ===================== */
const cvs = document.getElementById('particle-canvas');
const ctx = cvs.getContext('2d');
let CW, CH;
const CR = 63 / 88;

function resizeCvs() { CW = cvs.width = innerWidth; CH = cvs.height = innerHeight; }
window.addEventListener('resize', resizeCvs);
resizeCvs();

class Ptcl {
    constructor() { this.reset(true); }
    reset(init) {
        this.card = Math.random() < 0.38;
        this.x = Math.random() * CW;
        this.y = init ? Math.random() * CH : CH + 60;
        this.vx = (Math.random() - 0.5) * 0.35;
        this.vy = -(Math.random() * 0.5 + 0.18);
        this.a  = Math.random() * 0.35 + 0.05;
        if (this.card) {
            this.w  = Math.random() * 28 + 14;
            this.h  = this.w / CR;
            this.r  = Math.random() * Math.PI * 2;
            this.rs = (Math.random() - 0.5) * 0.007;
            this.hue = Math.random() * 360;
        } else {
            this.sz = Math.random() * 2.2 + 0.5;
            this.tw = Math.random() * Math.PI * 2;
        }
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        if (this.card) { this.r += this.rs; this.hue += 0.4; }
        else this.tw += 0.048;
        if (this.y < -110 || this.x < -110 || this.x > CW + 110) this.reset();
    }
    draw() {
        ctx.save();
        if (this.card) {
            ctx.translate(this.x, this.y); ctx.rotate(this.r);
            ctx.globalAlpha = this.a;
            ctx.strokeStyle = `hsl(${this.hue},100%,70%)`;
            ctx.lineWidth = 1;
            const [w, h, r] = [this.w, this.h, 3];
            ctx.beginPath();
            ctx.moveTo(-w/2+r,-h/2); ctx.lineTo(w/2-r,-h/2); ctx.arcTo(w/2,-h/2,w/2,-h/2+r,r);
            ctx.lineTo(w/2,h/2-r);   ctx.arcTo(w/2,h/2,w/2-r,h/2,r);
            ctx.lineTo(-w/2+r,h/2);  ctx.arcTo(-w/2,h/2,-w/2,h/2-r,r);
            ctx.lineTo(-w/2,-h/2+r); ctx.arcTo(-w/2,-h/2,-w/2+r,-h/2,r);
            ctx.closePath(); ctx.stroke();
        } else {
            ctx.globalAlpha = this.a * (0.5 + 0.5 * Math.sin(this.tw));
            ctx.fillStyle = '#00d4ff';
            ctx.shadowColor = '#00d4ff'; ctx.shadowBlur = 8;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.sz, 0, Math.PI*2); ctx.fill();
        }
        ctx.restore();
    }
}

const ptcls = Array.from({length: 65}, () => new Ptcl());
let pmx = -9999, pmy = -9999;
document.addEventListener('mousemove', e => { pmx = e.clientX; pmy = e.clientY; });

(function animPtcls() {
    ctx.clearRect(0, 0, CW, CH);
    ptcls.forEach(p => {
        if (!p.card) {
            const dx = p.x - pmx, dy = p.y - pmy, d = Math.sqrt(dx*dx + dy*dy);
            if (d < 90) { const f = (90-d)/90; p.vx += dx/d*f*0.25; p.vy += dy/d*f*0.25; }
            p.vx *= 0.96; p.vy *= 0.96;
        }
        p.update(); p.draw();
    });
    requestAnimationFrame(animPtcls);
})();

/* ===================== MAGNETIC BUTTON ===================== */
const searchBtn = document.getElementById('searchBtn');
searchBtn.addEventListener('mousemove', function(e) {
    const rc = this.getBoundingClientRect();
    const dx = e.clientX - (rc.left + rc.width/2);
    const dy = e.clientY - (rc.top  + rc.height/2);
    this.style.transform = `translate(${dx*0.38}px,${dy*0.38}px) scale(1.06)`;
});
searchBtn.addEventListener('mouseleave', () => { searchBtn.style.transform = ''; });

/* ===================== RIPPLE ===================== */
function addRipple(btn, e) {
    const rc   = btn.getBoundingClientRect();
    const size = Math.max(rc.width, rc.height);
    const sp   = document.createElement('span');
    sp.className = 'ripple';
    sp.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-rc.left-size/2}px;top:${e.clientY-rc.top-size/2}px;`;
    btn.appendChild(sp);
    setTimeout(() => sp.remove(), 750);
}

/* ===================== DATA ===================== */
let titleData = null;
async function loadTitles() {
    if (titleData) return titleData;
    try { titleData = await (await fetch('cardTitle.json')).json(); }
    catch { titleData = {}; }
    return titleData;
}

/* ===================== SEARCH TOGGLE ===================== */
function searchToggle(obj, evt) {
    const wrap = $('#searchWrapper');
    if (!wrap.hasClass('active')) {
        addRipple(obj, evt);
        wrap.addClass('active');
        evt.preventDefault();
        setTimeout(() => document.getElementById('searchInput').focus(), 420);
    } else if (!$(obj).closest('.input-holder').length) {
        wrap.removeClass('active');
        document.getElementById('searchInput').value = '';
        clearResults();
    }
}

/* ===================== SEARCH LOGIC ===================== */
const sinput  = document.getElementById('searchInput');
const secSect = document.getElementById('resultsSection');
const secGrid = document.getElementById('resultsGrid');
const secCnt  = document.getElementById('resultsCount');
let debounce;

sinput.addEventListener('input', function() {
    clearTimeout(debounce);
    const q = this.value.trim();
    if (!q) { clearResults(); return; }
    showSkeleton();
    debounce = setTimeout(() => doSearch(q), 320);
});

sinput.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.getElementById('closeBtn').click();
});

function clearResults() {
    secSect.classList.remove('visible');
    secGrid.innerHTML = '';
    secCnt.textContent = '';
}

function showSkeleton() {
    secSect.classList.add('visible');
    secGrid.innerHTML = Array(6).fill(0).map(() =>
        `<div class="skeleton-card">
            <div class="skel-ln s"></div>
            <div class="skel-ln l"></div>
            <div class="skel-ln m"></div>
        </div>`
    ).join('');
    secCnt.textContent = 'SCANNING DATABASE…';
}

async function doSearch(query) {
    const data = await loadTitles();
    const q = query.toLowerCase();
    const hits = Object.entries(data).filter(([code, name]) =>
        code.toLowerCase().includes(q) || name.toLowerCase().includes(q)
    ).map(([code, name]) => ({code, name}));
    renderResults(hits, query);
}

function renderResults(hits, query) {
    secGrid.innerHTML = '';
    if (!hits.length) {
        secSect.classList.add('visible');
        secCnt.textContent = 'NO RESULTS';
        secGrid.innerHTML = `<div class="no-results"><span class="no-results-icon">◈</span>找不到「${esc(query)}」相關卡牌集合</div>`;
        return;
    }
    const shown = hits.slice(0, 60);
    secCnt.textContent = `FOUND ${hits.length.toLocaleString()} COLLECTION${hits.length > 1 ? 'S' : ''}`;
    secSect.classList.add('visible');

    shown.forEach((item, i) => {
        const card = document.createElement('div');
        card.className = 'result-card';
        card.style.animationDelay = `${i * 38}ms`;
        const series = item.code.split('/')[0] || '';
        card.innerHTML = `
            <div class="card-code">${esc(item.code)}</div>
            <div class="card-name">${esc(item.name)}</div>
            <div class="card-meta">
                <span class="card-tag tc">COLLECTION</span>
                ${series ? `<span class="card-tag ts">${esc(series)}</span>` : ''}
            </div>`;
        card.addEventListener('mousemove', function(e) {
            const rc = this.getBoundingClientRect();
            const x  = ((e.clientX - rc.left) / rc.width)  * 100;
            const y  = ((e.clientY - rc.top)  / rc.height) * 100;
            const ha = Math.atan2(e.clientY-(rc.top+rc.height/2), e.clientX-(rc.left+rc.width/2)) * 180/Math.PI + 90;
            this.style.setProperty('--mx', x + '%');
            this.style.setProperty('--my', y + '%');
            this.style.setProperty('--ha', ha + 'deg');
            this.style.transform = `perspective(800px) rotateX(${(y-50)*-0.06}deg) rotateY(${(x-50)*0.06}deg) scale(1.025)`;
        });
        card.addEventListener('mouseleave', function() { this.style.transform = ''; });
        secGrid.appendChild(card);
    });
}

function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

setTimeout(loadTitles, 1200);
</script>
