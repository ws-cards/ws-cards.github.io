  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('ws-theme');
        document.documentElement.setAttribute('data-theme', saved === 'dark' ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <style>
    /* 頁面就緒前藏內文（進度 overlay 除外），避免字體 swap 閃爍與半載入畫面 */
    html { background: #ffffff; }
    html[data-theme="dark"] { background: #141414; }
    html:not(.page-ready) body > *:not(#wsPageLoader) { visibility: hidden; }
    html.page-ready body > *:not(#wsPageLoader) { visibility: visible; }
    /* 關鍵 CSS：外部 stylesheet 尚未到位時也能先畫出進度條 */
    #wsPageLoader.ws-page-loader {
      position: fixed; inset: 0; z-index: 20000;
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem; visibility: visible !important;
      background: #ffffff; color: #2d3748;
    }
    html[data-theme="dark"] #wsPageLoader.ws-page-loader {
      background: #141414; color: #e9e7e1;
    }
    #wsPageLoader .ws-page-loader-panel {
      width: min(20.5rem, 100%); text-align: center;
    }
    #wsPageLoader .ws-page-loader-brand {
      display: inline-flex; align-items: center; gap: 0.65rem; margin-bottom: 0.85rem;
    }
    #wsPageLoader .ws-page-loader-mark {
      display: block; width: 1.15rem; height: 1px; background: #b07c28; opacity: 0.72;
    }
    html[data-theme="dark"] #wsPageLoader .ws-page-loader-mark { background: #cbb083; }
    #wsPageLoader .ws-page-loader-name {
      font-family: 'UoqMunThenKhung', 'Noto Serif TC', serif;
      font-size: 1.55rem; letter-spacing: 0.18em;
    }
    #wsPageLoader .ws-page-loader-label {
      margin: 0.85rem 0 1rem; font-size: 0.84rem; opacity: 0.72;
    }
    #wsPageLoader .ws-page-loader-track {
      height: 5px; border-radius: 999px; overflow: hidden;
      background: rgba(45, 55, 72, 0.12);
    }
    html[data-theme="dark"] #wsPageLoader .ws-page-loader-track {
      background: rgba(233, 231, 225, 0.14);
    }
    #wsPageLoader .ws-page-loader-fill {
      display: block; height: 100%; width: 0%;
      border-radius: inherit; background: #b07c28;
      transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    html[data-theme="dark"] #wsPageLoader .ws-page-loader-fill {
      background: #cbb083;
    }
    #wsPageLoader .ws-page-loader-pct {
      margin-top: 0.7rem;
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      font-weight: 600; font-variant-numeric: tabular-nums;
    }
  </style>
